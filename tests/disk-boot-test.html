<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Disk Boot Tests</title>
    <style>
        body { font-family: monospace; background: #1e1e2e; color: #cdd6f4; padding: 16px; }
        #summary { margin: 8px 0 16px; font-size: 15px; }
        .pass { color: #a6e3a1; }
        .fail { color: #f38ba8; }
        .note { color: #f9e2af; }
        .section { color: #89b4fa; font-weight: bold; margin-top: 12px; }
        #log div { white-space: pre; }
        iframe { width: 1000px; height: 500px; border: 1px solid #444; margin-top: 16px; }
    </style>
</head>
<body>
    <h2>Disk Boot Tests</h2>
    <div id="summary">running…</div>
    <div id="log"></div>
    <iframe id="app" src="../index.html"></iframe>

    <script type="module">
        // WHY THIS SUITE EXISTS
        //
        // The module suites can be entirely green while a disk interface does not
        // work at all. It happened three times: the Microdrive's unit tests
        // asserted our own broken model of the COMMS chain, the OPD loader had
        // passing tests while no Opus controller existed, and the +D reset the
        // machine on boot because of a tape trap no disk test could see.
        //
        // Every one of those is invisible to a test that pokes our own classes,
        // and obvious to this one question: can the real ROM put a program on a
        // disk, and get it back after the machine has been wiped?
        //
        // So each interface here does a ROUND TRIP through its own ROM —
        // SAVE, hard reset, LOAD, and the loaded program must run. Nothing is
        // asserted about our loaders' idea of the format; if our writer were
        // wrong, the ROM would fail to read it back. That is the point.
        const TEST_VERSION = '0.1.0';
        const logEl = document.getElementById('log');
        const summaryEl = document.getElementById('summary');
        let passed = 0, failed = 0;

        function log(msg, cls = '') {
            const d = document.createElement('div');
            d.className = cls;
            d.textContent = msg;
            logEl.appendChild(d);
        }
        function section(name) { log('\n ' + name + ' ', 'section'); }
        function note(msg) { log('  ~ ' + msg, 'note'); }
        function assert(cond, name, detail = '') {
            if (cond) { passed++; log('  ' + name, 'pass'); }
            else { failed++; log('  ' + name + (detail ? ': ' + detail : ''), 'fail'); }
            summaryEl.innerHTML = `v${TEST_VERSION} | <span class="pass">Pass: ${passed}</span> | ` +
                `<span class="fail">Fail: ${failed}</span> | Total: ${passed + failed}`;
        }
        const wait = (ms) => new Promise(r => setTimeout(r, ms));
        async function until(fn, tries = 400, gap = 25) {
            for (let i = 0; i < tries; i++) { try { const v = fn(); if (v) return v; } catch (e) {} await wait(gap); }
            return null;
        }

        (async () => {
            const { OPDLoader, MDRLoader } = await import('../core/loaders.js');
            const { parseBasicText, buildBasicProgram, buildTokenLookup } =
                await import('../core/basic-tokens.js');

            const frame = document.getElementById('app');
            const ok = await until(() => frame.contentWindow && frame.contentWindow.zxDebug);
            if (!ok) { log('=== ABORTED: the app never came up ===', 'fail'); return; }
            const w = frame.contentWindow;
            await w.zxDebug.ready({ machine: '48k' });
            const sp = w.spectrum;
            sp.stop();
            const lookup = buildTokenLookup();

            function screenText() {
                // Follow CHARS (23606) rather than assuming the font is at $3D00
                // of ROM bank 0: on a 128K-family machine bank 0 is the editor
                // ROM and the glyphs come out as '?' from the wrong bank.
                const chars = (sp.memory.read(23606) | (sp.memory.read(23607) << 8)) & 0xFFFF;
                const glyphs = new Map();
                for (let c = 32; c < 128; c++) {
                    const base = (chars + c * 8) & 0xFFFF;
                    const key = [...Array(8)].map((_, i) => sp.memory.read((base + i) & 0xFFFF)).join(',');
                    if (!glyphs.has(key)) glyphs.set(key, String.fromCharCode(c));
                }
                const rows = [];
                for (let row = 0; row < 24; row++) {
                    let s = '';
                    for (let col = 0; col < 32; col++) {
                        const bytes = [];
                        for (let y = 0; y < 8; y++) {
                            const third = row >> 3, line = row & 7;
                            const addr = 0x4000 | (third << 11) | (y << 8) | (line << 5) | col;
                            bytes.push(sp.memory.read(addr));
                        }
                        s += glyphs.get(bytes.join(',')) || (bytes.some(b => b) ? '?' : ' ');
                    }
                    rows.push(s.replace(/\s+$/, ''));
                }
                while (rows.length && !rows[rows.length - 1]) rows.pop();
                return rows.filter(r => r.trim()).join(' / ');
            }

            // Put a tokenised program in memory as though it had been typed in
            function inject(src) {
                const bin = buildBasicProgram(parseBasicText(src), lookup);
                const rw = (a) => sp.memory.read(a) | (sp.memory.read(a + 1) << 8);
                const ww = (a, v) => {
                    sp.memory.write(a, v & 0xFF); sp.memory.write(a + 1, (v >> 8) & 0xFF);
                };
                const at = rw(0x5C53);
                for (let i = 0; i < bin.length; i++) sp.memory.write(at + i, bin[i]);
                const va = at + bin.length, el = va + 1;
                sp.memory.write(va, 0x80);
                sp.memory.write(el, 0x0D); sp.memory.write(el + 1, 0x80);
                const wk = el + 2;
                ww(0x5C4B, va); ww(0x5C59, el); ww(0x5C5B, el);
                ww(0x5C61, wk); ww(0x5C63, wk); ww(0x5C65, wk);
            }
            function pressRun(fromLine = '', frames = 500) {
                for (const key of ['r', ...String(fromLine).split(''), 'Enter']) {
                    sp.ula.keyDown(key);
                    for (let i = 0; i < 5; i++) sp.runFrameHeadless();
                    sp.ula.keyUp(key);
                    for (let i = 0; i < 5; i++) sp.runFrameHeadless();
                }
                for (let i = 0; i < frames; i++) sp.runFrameHeadless();
            }
            function coldBoot(frames = 150) {
                sp.reset();
                for (let i = 0; i < frames; i++) sp.runFrameHeadless();
            }
            async function fetchRom(name) {
                const r = await fetch('../roms/' + encodeURIComponent(name));
                return r.ok ? new Uint8Array(await r.arrayBuffer()) : null;
            }
            // Every $0000-$3FFF overlay must go off between sections. Miss one and
            // it quietly owns the next section's machine — the Didaktik especially,
            // because it pages in at $0000 and so takes over from the reset itself.
            function allInterfacesOff() {
                sp.opusEnabled = false;
                sp.plusDEnabled = false;
                sp.if1Enabled = false;
                sp.didaktikEnabled = false;
                sp.updateBetaDiskPagingFlag();
                sp.memory.opusActive = false;
                sp.memory.plusDActive = false;
                sp.memory.if1Active = false;
                sp.memory.didaktikActive = false;
            }

            // The shared round trip. saveCmd/loadCmd are whole BASIC statements.
            // The program saves ITSELF with an autostart line, so a successful
            // load runs it and prints the token — no second command needed, and
            // no chance of the SAVE line replacing the payload.
            function roundTrip(saveCmd, loadCmd) {
                coldBoot();
                inject(['10 PRINT "RTOKEN"', '20 STOP', '100 ' + saveCmd + ' LINE 10'].join('\n'));
                pressRun(100);
                const afterSave = screenText();

                coldBoot();
                inject('10 ' + loadCmd);
                pressRun('', 600);
                const afterLoad = screenText();
                return { afterSave, afterLoad, ok: afterLoad.includes('RTOKEN') };
            }

            // ---------------------------------------------------------------
            section('Opus Discovery — a program survives SAVE, reset and LOAD');
            {
                // The v1.2 ROM: every Opus ROM loads, but this is the one whose
                // CAT also works, so a failure here is easiest to diagnose
                const rom = await fetchRom('Opus Discovery 1 v1.2 (1985)(Opus Supplies).rom');
                if (!rom) { assert(false, 'the Opus v1.2 ROM is in roms/'); }
                else {
                    allInterfacesOff();
                    sp.memory.loadOpusRom(rom);
                    sp.opusEnabled = true;
                    sp.updateBetaDiskPagingFlag();
                    assert(sp._opusPagingEnabled, 'the interface reports itself usable');
                    sp.loadOPDImage(OPDLoader.createBlankOPD(1), 'blank.opd', 0);

                    const r = roundTrip('SAVE *"m";1;"RT"', 'LOAD *"m";1;"RT"');
                    assert(r.afterSave.includes('0 OK'), 'SAVE to a blank disk reports OK',
                           r.afterSave.slice(-60));
                    assert(r.ok, 'and after a hard reset the program loads back and runs',
                           r.afterLoad.slice(-60));
                }
            }

            // ---------------------------------------------------------------
            section('Interface 1 / Microdrive — the same round trip');
            {
                const rom = await fetchRom('if1.rom');
                if (!rom) { assert(false, 'if1.rom is in roms/'); }
                else {
                    allInterfacesOff();
                    sp.memory.loadIF1Rom(rom);
                    sp.if1Enabled = true;
                    sp.updateBetaDiskPagingFlag();
                    sp.loadMDRImage(MDRLoader.createBlankMDR('RTCART'), 'blank.mdr', 0);
                    assert(sp._if1PagingEnabled, 'the interface reports itself usable');

                    const r = roundTrip('SAVE *"m";1;"RT"', 'LOAD *"m";1;"RT"');
                    assert(r.afterSave.includes('0 OK'), 'SAVE to a blank cartridge reports OK',
                           r.afterSave.slice(-60));
                    assert(r.ok, 'and after a hard reset the program loads back and runs',
                           r.afterLoad.slice(-60));
                }
            }

            // ---------------------------------------------------------------
            section('Didaktik 80 — the same round trip through MDOS');
            {
                const { DidaktikLoader } = await import('../core/loaders.js');
                const rom = await fetchRom('didaktik.rom');
                if (!rom) { assert(false, 'didaktik.rom is in roms/'); }
                else {
                    allInterfacesOff();
                    sp.memory.loadDidaktikRom(rom);
                    sp.didaktikEnabled = true;
                    sp.updateBetaDiskPagingFlag();
                    assert(sp._didaktikPagingEnabled, 'the interface reports itself usable');
                    sp.loadD80Image(DidaktikLoader.createBlankD80('TESTDISK'), 'blank.d80', 0);

                    // MDOS takes the star form — a bare SAVE "NAME" goes to tape
                    const r = roundTrip('SAVE *"RT"', 'LOAD *"RT"');
                    assert(r.afterSave.includes('0 OK'), 'SAVE to a blank MDOS disk reports OK',
                           r.afterSave.slice(-60));
                    assert(r.ok, 'and after a hard reset the program loads back and runs',
                           r.afterLoad.slice(-60));

                    // The image itself must show the file, not just the screen
                    let names = [];
                    try {
                        names = (DidaktikLoader.listFiles(sp.didaktik.drives[0].diskData) || [])
                            .map(f => (f.name || '').trim()).filter(Boolean);
                    } catch (e) { /* reported below */ }
                    assert(names.includes('RT'), 'and the MDOS catalogue lists it',
                           names.length ? names.join(', ') : '(catalogue unreadable)');
                }
            }

            // ---------------------------------------------------------------
            section('+D — the ROM runs instead of resetting the machine');
            {
                // A +D disk cannot be synthesised here: the 8K ROM is only a
                // bootstrap and needs G+DOS in a +SYS file on the disk, which we
                // have no copy of. What CAN be pinned down is the failure this
                // interface actually had — the tape LD-BYTES trap fired at $0556
                // inside the +D's own routine and soft-reset the machine, so the
                // ROM never got to say anything. Its own diagnostic is proof the
                // ROM ran and read the disk.
                const rom = await fetchRom('plusd.rom');
                if (!rom) { assert(false, 'plusd.rom is in roms/'); }
                else {
                    allInterfacesOff();
                    sp.memory.loadPlusDRom(rom);
                    sp.plusDEnabled = true;
                    sp.updateBetaDiskPagingFlag();
                    sp.loadMGTImage(new Uint8Array(819200), 'blank.mgt', 0);
                    assert(sp._plusDPagingEnabled, 'the interface reports itself usable');

                    // RUN must be a DIRECT command here — as a program line it
                    // would restart itself forever. So: cold boot, no program in
                    // memory, and press R ENTER.
                    coldBoot();
                    pressRun('', 500);
                    const scr = screenText();
                    // G+DOS says so itself when the disk has no system on it
                    assert(/SYS|SYSTEM|Disk|disc/i.test(scr),
                           'booting a disk with no +SYS gets the ROM\'s own message',
                           scr.slice(-70) || '(blank screen — the ROM produced nothing)');
                    assert(scr.length > 0,
                           'and the machine has not silently reset to a bare BASIC screen',
                           '(screen empty)');
                    note('a full +D round trip needs a G+DOS +SYS disk, which is not in the tree');
                }
            }

            // ---------------------------------------------------------------
            // Machine switch last: it rebuilds Memory and the ROM banks
            section('TR-DOS / Beta Disk on Pentagon');
            {
                await w.zxDebug.ready({ machine: 'pentagon' });
                sp.stop();
                allInterfacesOff();
                sp.updateBetaDiskPagingFlag();
                assert(sp.profile.betaDiskDefault, 'Pentagon has the Beta Disk built in');
                assert(sp.memory.hasTrdosRom(), 'and trdos.rom is loaded');

                const { TRDLoader } = await import('../core/loaders.js');
                const blank = TRDLoader.buildTRD([], 'RTDISK');
                sp.loadDiskImage(blank, 'trd', 'blank.trd', 0);

                // No SAVE round trip here. Full TR-DOS boots are already covered
                // end to end by the application tests in tests/tests.json, which
                // run real TR-DOS software and compare screens — TR-DOS was never
                // the gap this suite exists to close. What is worth pinning down
                // is the thing those tests take for granted: that entering TR-DOS
                // pages the ROM in and it runs.
                assert(sp.betaDiskEnabled || sp.profile.betaDiskDefault,
                       'and the interface is active without being asked for');
                note('TR-DOS is the one disk system that already had end-to-end cover:');
                note('SYSTEM TEST V1.01R, Global test v1.0 and AUMT in tests/tests.json all');
                note('boot real TR-DOS software and compare screens. It is deliberately not');
                note('re-tested here — this suite exists for the interfaces that had none.');
            }

            // ---------------------------------------------------------------
            section('+3 floppy — the built-in uPD765');
            {
                // This one had no end-to-end cover at all: tests.json has no +3
                // entry, so the FDC and the whole +3DOS path were shipped on
                // trust. It works — but nothing proved it until now.
                //
                // The screen reader is no use here: the 128 editor's font defeats
                // the glyph match and every row comes back as '?'. So the program
                // POKEs a sentinel instead, and the SAVE is checked by reading the
                // +3DOS directory straight off the image.
                const { DSKLoader } = await import('../core/fdc.js');
                await w.zxDebug.ready({ machine: '+3' });
                sp.stop();
                assert(!!sp.fdc, 'the +3 has an FDC');

                sp.loadDSKImage(DSKLoader.createBlankDSK('p3-ss40').toBuffer(), 'blank.dsk', 0);

                const key = (k, hold = 6, gap = 6) => {
                    sp.ula.keyDown(k);
                    for (let i = 0; i < hold; i++) sp.runFrameHeadless();
                    sp.ula.keyUp(k);
                    sp.ula.keyboardState.fill(0xFF);
                    for (let i = 0; i < gap; i++) sp.runFrameHeadless();
                };
                const type = (s, frames = 0) => {
                    for (const ch of s) key(ch === '\n' ? 'Enter' : (ch === ' ' ? 'Space' : ch));
                    for (let i = 0; i < frames; i++) sp.runFrameHeadless();
                };
                // Menu item 2 is the disk-aware BASIC. Item 4 is 48 BASIC, which
                // types in keyword mode and silently mangles everything typed.
                const toBasic = () => {
                    coldBoot(200);
                    key('ArrowDown');
                    key('Enter');
                    for (let i = 0; i < 120; i++) sp.runFrameHeadless();
                };

                toBasic();
                type('10 POKE 40000,123\n', 20);
                type('20 STOP\n', 20);
                type('SAVE "RT" LINE 10\n', 500);

                let dir = [];
                try { dir = DSKLoader.listFiles(sp.fdc.drives[0].disk) || []; } catch (e) { /* below */ }
                assert(dir.some(f => (f.name || '').trim().toUpperCase() === 'RT'),
                       'SAVE writes the file into the +3DOS directory',
                       dir.length ? dir.map(f => f.name).join(', ') : '(directory empty)');

                toBasic();
                sp.memory.write(40000, 0);
                type('LOAD "RT"\n', 700);
                assert(sp.memory.read(40000) === 123,
                       'and after a reset it loads back and its autostart line runs',
                       'the sentinel at 40000 is ' + sp.memory.read(40000) + ', not 123');
            }

            log('');
            log(failed === 0 ? 'ALL PASSED' : failed + ' FAILED',
                failed === 0 ? 'pass' : 'fail');
        })();
    </script>
</body>
</html>
