<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Disk Boot Tests</title>
    <style>
        body { font-family: monospace; background: #1e1e2e; color: #cdd6f4; padding: 16px; }
        #summary { margin: 8px 0 16px; font-size: 15px; }
        .pass { color: #a6e3a1; }
        .fail { color: #f38ba8; }
        .note { color: #f9e2af; }
        .section { color: #89b4fa; font-weight: bold; margin-top: 12px; }
        #log div { white-space: pre; }
        iframe { width: 1000px; height: 500px; border: 1px solid #444; margin-top: 16px; }
    </style>
</head>
<body>
    <h2>Disk Boot Tests</h2>
    <div id="summary">running…</div>
    <div id="log"></div>
    <iframe id="app" src="../index.html"></iframe>

    <script type="module">
        // WHY THIS SUITE EXISTS
        //
        // The module suites can be entirely green while a disk interface does not
        // work at all. It happened three times: the Microdrive's unit tests
        // asserted our own broken model of the COMMS chain, the OPD loader had
        // passing tests while no Opus controller existed, and the +D reset the
        // machine on boot because of a tape trap no disk test could see.
        //
        // Every one of those is invisible to a test that pokes our own classes,
        // and obvious to this one question: can the real ROM put a program on a
        // disk, and get it back after the machine has been wiped?
        //
        // So each interface here does a ROUND TRIP through its own ROM —
        // SAVE, hard reset, LOAD, and the loaded program must run. Nothing is
        // asserted about our loaders' idea of the format; if our writer were
        // wrong, the ROM would fail to read it back. That is the point.
        const TEST_VERSION = '0.1.0';
        const logEl = document.getElementById('log');
        const summaryEl = document.getElementById('summary');
        let passed = 0, failed = 0;

        function log(msg, cls = '') {
            const d = document.createElement('div');
            d.className = cls;
            d.textContent = msg;
            logEl.appendChild(d);
        }
        function section(name) { log('\n ' + name + ' ', 'section'); }
        function note(msg) { log('  ~ ' + msg, 'note'); }
        function assert(cond, name, detail = '') {
            if (cond) { passed++; log('  ' + name, 'pass'); }
            else { failed++; log('  ' + name + (detail ? ': ' + detail : ''), 'fail'); }
            summaryEl.innerHTML = `v${TEST_VERSION} | <span class="pass">Pass: ${passed}</span> | ` +
                `<span class="fail">Fail: ${failed}</span> | Total: ${passed + failed}`;
        }
        const wait = (ms) => new Promise(r => setTimeout(r, ms));
        async function until(fn, tries = 400, gap = 25) {
            for (let i = 0; i < tries; i++) { try { const v = fn(); if (v) return v; } catch (e) {} await wait(gap); }
            return null;
        }

        (async () => {
            const { OPDLoader, MDRLoader } = await import('../core/loaders.js');
            const { parseBasicText, buildBasicProgram, buildTokenLookup } =
                await import('../core/basic-tokens.js');

            const frame = document.getElementById('app');
            const ok = await until(() => frame.contentWindow && frame.contentWindow.zxDebug);
            if (!ok) { log('=== ABORTED: the app never came up ===', 'fail'); return; }
            const w = frame.contentWindow;
            await w.zxDebug.ready({ machine: '48k' });
            const sp = w.spectrum;
            sp.stop();
            const lookup = buildTokenLookup();

            function screenText() {
                // Follow CHARS (23606) rather than assuming the font is at $3D00
                // of ROM bank 0: on a 128K-family machine bank 0 is the editor
                // ROM and the glyphs come out as '?' from the wrong bank.
                const chars = (sp.memory.read(23606) | (sp.memory.read(23607) << 8)) & 0xFFFF;
                const glyphs = new Map();
                for (let c = 32; c < 128; c++) {
                    const base = (chars + c * 8) & 0xFFFF;
                    const key = [...Array(8)].map((_, i) => sp.memory.read((base + i) & 0xFFFF)).join(',');
                    if (!glyphs.has(key)) glyphs.set(key, String.fromCharCode(c));
                }
                const rows = [];
                for (let row = 0; row < 24; row++) {
                    let s = '';
                    for (let col = 0; col < 32; col++) {
                        const bytes = [];
                        for (let y = 0; y < 8; y++) {
                            const third = row >> 3, line = row & 7;
                            const addr = 0x4000 | (third << 11) | (y << 8) | (line << 5) | col;
                            bytes.push(sp.memory.read(addr));
                        }
                        s += glyphs.get(bytes.join(',')) || (bytes.some(b => b) ? '?' : ' ');
                    }
                    rows.push(s.replace(/\s+$/, ''));
                }
                while (rows.length && !rows[rows.length - 1]) rows.pop();
                return rows.filter(r => r.trim()).join(' / ');
            }

            // Put a tokenised program in memory as though it had been typed in
            function inject(src) {
                const bin = buildBasicProgram(parseBasicText(src), lookup);
                const rw = (a) => sp.memory.read(a) | (sp.memory.read(a + 1) << 8);
                const ww = (a, v) => {
                    sp.memory.write(a, v & 0xFF); sp.memory.write(a + 1, (v >> 8) & 0xFF);
                };
                const at = rw(0x5C53);
                for (let i = 0; i < bin.length; i++) sp.memory.write(at + i, bin[i]);
                const va = at + bin.length, el = va + 1;
                sp.memory.write(va, 0x80);
                sp.memory.write(el, 0x0D); sp.memory.write(el + 1, 0x80);
                const wk = el + 2;
                ww(0x5C4B, va); ww(0x5C59, el); ww(0x5C5B, el);
                ww(0x5C61, wk); ww(0x5C63, wk); ww(0x5C65, wk);
            }
            function pressRun(fromLine = '', frames = 500) {
                for (const key of ['r', ...String(fromLine).split(''), 'Enter']) {
                    sp.ula.keyDown(key);
                    for (let i = 0; i < 5; i++) sp.runFrameHeadless();
                    sp.ula.keyUp(key);
                    for (let i = 0; i < 5; i++) sp.runFrameHeadless();
                }
                for (let i = 0; i < frames; i++) sp.runFrameHeadless();
            }
            function coldBoot(frames = 150) {
                sp.reset();
                for (let i = 0; i < frames; i++) sp.runFrameHeadless();
            }
            async function fetchRom(name) {
                const r = await fetch('../roms/' + encodeURIComponent(name));
                return r.ok ? new Uint8Array(await r.arrayBuffer()) : null;
            }
            // Every $0000-$3FFF overlay must go off between sections. Miss one and
            // it quietly owns the next section's machine — the Didaktik especially,
            // because it pages in at $0000 and so takes over from the reset itself.
            function allInterfacesOff() {
                sp.opusEnabled = false;
                sp.plusDEnabled = false;
                sp.if1Enabled = false;
                sp.didaktikEnabled = false;
                sp.updateBetaDiskPagingFlag();
                sp.memory.opusActive = false;
                sp.memory.plusDActive = false;
                sp.memory.if1Active = false;
                sp.memory.didaktikActive = false;
            }

            // The shared round trip. saveCmd/loadCmd are whole BASIC statements.
            // The program saves ITSELF with an autostart line, so a successful
            // load runs it and prints the token — no second command needed, and
            // no chance of the SAVE line replacing the payload.
            function roundTrip(saveCmd, loadCmd) {
                coldBoot();
                inject(['10 PRINT "RTOKEN"', '20 STOP', '100 ' + saveCmd + ' LINE 10'].join('\n'));
                pressRun(100);
                const afterSave = screenText();

                coldBoot();
                inject('10 ' + loadCmd);
                pressRun('', 600);
                const afterLoad = screenText();
                return { afterSave, afterLoad, ok: afterLoad.includes('RTOKEN') };
            }

            // ---------------------------------------------------------------
            section('The disk clock only ever moves forward');
            {
                // Everything timed by rotation — the index pulse, the Write Track
                // deadline, the DRQ byte schedule — is arithmetic on this one
                // number, so it has to be monotonic across frame boundaries.
                //
                // THE BUG THIS EXISTS FOR. Built as `totalFrames * tstatesPerFrame
                // + cpu.tStates` it was not: totalFrames is incremented at the END
                // of a frame while the frame is subtracted from cpu.tStates at the
                // START of the next one, so between the two the clock leapt a whole
                // frame forward and then dropped back. Against a 698880-T
                // revolution that was a wobble nothing noticed; against a DRQ due
                // 112 T out it scheduled a byte a whole frame late and stalled
                // every Opus transfer.
                const tpf = sp.getTstatesPerFrame();
                let back = 0, worstBack = 0, prev = sp.diskClockNow();
                const starts = [];
                for (let f = 0; f < 200; f++) {
                    // Sample either side of the boundary, which is where it broke.
                    starts.push(sp.diskClockNow());
                    sp.runFrameHeadless();
                    const after = sp.diskClockNow();
                    if (after < prev) { back++; worstBack = Math.max(worstBack, prev - after); }
                    prev = after;
                }
                assert(back === 0,
                       'sampled either side of 200 frame boundaries, it never goes back',
                       back ? back + ' times, worst by ' + worstBack : '');
                // And it advances at the rate of the machine, not some multiple:
                // a frame per frame. The broken version doubled it for one sample.
                const steps = [];
                for (let i = 1; i < starts.length; i++) steps.push(starts[i] - starts[i - 1]);
                const offBy = steps.filter(s => Math.abs(s - tpf) > 64).length;
                assert(offBy === 0,
                       'and advances one frame per frame, to within a long instruction',
                       offBy ? offBy + ' of ' + steps.length + ' steps wrong' : '');
                assert(Math.abs(sp.diskByteTStates() - tpf * 10 / 6250) < 1e-9,
                       'the byte time is a revolution shared over the track',
                       sp.diskByteTStates().toFixed(4));
            }

            // ---------------------------------------------------------------
            section('An image reaches the right drive in the first place');
            {
                // Getting the disk to the correct controller is part of "does the
                // disk system work", and it is decided by CONTENT, not extension.
                // Two traps live here: a D80 is exactly the same 737,280 bytes as
                // a double-sided OPD, and a blank D80 also satisfies isTRD — so
                // before the Didaktik check was moved to the front of detectType,
                // a .d80 was detected as TR-DOS and reached the boot-file
                // injector, which answered "Cannot add boot".
                const { DidaktikLoader, TRDLoader } = await import('../core/loaders.js');
                const det = (d) => sp.snapshotLoader.detectType(d, '');   // no filename: content only

                const d80 = DidaktikLoader.createBlankD80('T');
                const opdDs = OPDLoader.createBlankOPD(2);
                assert(d80.length === opdDs.length,
                       'a D80 and a double-sided OPD really are the same size',
                       d80.length + ' vs ' + opdDs.length);
                assert(DidaktikLoader.hasSdosSignature(d80) &&
                       !DidaktikLoader.hasSdosSignature(opdDs),
                       'only the MDOS one carries the SDOS marker that tells them apart');

                for (const [name, img, want] of [
                    ['D80', d80, 'd80'],
                    ['D40', DidaktikLoader.createBlankD40('T'), 'd80'],
                    ['OPD single-sided', OPDLoader.createBlankOPD(1), 'opd'],
                    ['OPD double-sided', opdDs, 'opd'],
                    ['MDR', MDRLoader.createBlankMDR('T'), 'mdr'],
                    ['TRD', TRDLoader.buildTRD([], 'T'), 'trd'],
                    ['MGT', new Uint8Array(819200), 'mgt']
                ]) {
                    const got = det(img);
                    assert(got === want, name + ' is detected as ' + want,
                           'got ' + got);
                }
            }

            // ---------------------------------------------------------------
            section('Opus Discovery — a program survives SAVE, reset and LOAD');
            {
                // The v1.2 ROM: every Opus ROM loads, but this is the one whose
                // CAT also works, so a failure here is easiest to diagnose
                const rom = await fetchRom('Opus Discovery 1 v1.2 (1985)(Opus Supplies).rom');
                if (!rom) { assert(false, 'the Opus v1.2 ROM is in roms/'); }
                else {
                    allInterfacesOff();
                    sp.memory.loadOpusRom(rom);
                    sp.opusEnabled = true;
                    sp.updateBetaDiskPagingFlag();
                    assert(sp._opusPagingEnabled, 'the interface reports itself usable');
                    sp.loadOPDImage(OPDLoader.createBlankOPD(1), 'blank.opd', 0);

                    const r = roundTrip('SAVE *"m";1;"RT"', 'LOAD *"m";1;"RT"');
                    assert(r.afterSave.includes('0 OK'), 'SAVE to a blank disk reports OK',
                           r.afterSave.slice(-60));
                    assert(r.ok, 'and after a hard reset the program loads back and runs',
                           r.afterLoad.slice(-60));
                }
            }

            // ---------------------------------------------------------------
            section('Opus Discovery — a bare RUN loads the program called "run"');
            {
                // On an Opus, `RUN` with no program in memory means "load and run
                // the file called run" — the ROM builds `LOAD *1;"run"` in the
                // edit line and re-parses it. ROM v2.2 and later do that parse
                // with code at $0556, which the emulator was trapping as the
                // Spectrum ROM's LD-BYTES: the trap returned with carry clear,
                // the filename was never read, and the Opus reported
                // "C Nonsense in BASIC" for a command it had written itself.
                // Every disk game on an Opus starts this way, so it is the first
                // thing a user does and it has to be a boot test, not a unit one.
                const rom = await fetchRom('Opus Discovery 1 v2.2 (1985)(Opus Supplies).rom');
                if (!rom) { assert(false, 'the Opus v2.2 ROM is in roms/'); }
                else {
                    allInterfacesOff();
                    sp.memory.loadOpusRom(rom);
                    sp.opusEnabled = true;
                    sp.updateBetaDiskPagingFlag();
                    sp.loadOPDImage(OPDLoader.createBlankOPD(1), 'blank.opd', 0);

                    coldBoot();
                    inject(['10 PRINT "RTOKEN"', '20 STOP',
                            '100 SAVE *"m";1;"run" LINE 10'].join('\n'));
                    pressRun(100);
                    const afterSave = screenText();
                    assert(afterSave.includes('0 OK'), 'the program saves itself as "run"',
                           afterSave.slice(-60));

                    coldBoot();
                    pressRun('', 700);          // just R and ENTER, nothing in memory
                    const after = screenText();
                    assert(after.includes('RTOKEN'),
                           'and after a hard reset a bare RUN loads it and runs it',
                           after.slice(-70));
                }
            }

            // ---------------------------------------------------------------
            // FORMAT is the one operation that makes a disk rather than editing
            // one. It goes through Write Track, which no controller here used to
            // implement — so every FORMAT in the app reported success and changed
            // nothing. These two sections start from an image that is NOT a disk
            // of the right kind and let the ROM make one, which is the only test
            // that cannot pass by accident.
            section('Opus Discovery — the ROM formats a blank image into a disk');
            {
                const rom = await fetchRom('Opus Discovery 1 v1.2 (1985)(Opus Supplies).rom');
                if (!rom) { assert(false, 'the Opus v1.2 ROM is in roms/'); }
                else {
                    allInterfacesOff();
                    sp.memory.loadOpusRom(rom);
                    sp.opusEnabled = true;
                    sp.updateBetaDiskPagingFlag();
                    // All zeros: no anchor sector, no directory — not an Opus disk
                    // at all until the ROM has formatted it.
                    sp.loadOPDImage(new Uint8Array(184320), 'raw.opd', 0);
                    let before = 'x';
                    try {
                        before = OPDLoader.getDiskInfo(sp.opus.drives[0].diskData).diskLabel;
                    } catch (e) { before = ''; }
                    assert(!before, 'the image starts out with no label of any kind',
                           JSON.stringify(before));

                    coldBoot();
                    inject('10 FORMAT "m";1;"OPDISK"');
                    pressRun('', 3000);
                    const img = sp.opus.drives[0].diskData;
                    assert(screenText().includes('0 OK'), 'FORMAT reports OK',
                           screenText().slice(-70));
                    // THE PACING. The Opus transfers by NMI, and the DRQ schedule
                    // is absolute — the nth byte is due a byte-time after the
                    // (n-1)th was DUE, not after the host got round to it. Set up
                    // the other way the handler's own cost is added to every byte:
                    // it measured ~130 T-states against the 111.8 a byte of a
                    // 6250-byte track has, and a track took 1.16 revolutions to
                    // write, which no real drive could do. One revolution plus the
                    // head-settle delay before the first byte is the right answer.
                    const ofmt = sp.opus.lastFormat || {};
                    assert(ofmt.revolutions > 0.98 && ofmt.revolutions < 1.05,
                           'a track takes one revolution to write, as the medium does',
                           String(ofmt.revolutions));
                    // And the write does not begin where the command was issued:
                    // the chip waits for the index. So the command as a whole
                    // spans between one and two revolutions, which is the figure
                    // a real drive gives.
                    assert(ofmt.indexWait >= 0 && ofmt.indexWait <= 1,
                           'after waiting part of a turn for the index to come round',
                           String(ofmt.indexWait));
                    assert(ofmt.indexWait + ofmt.revolutions >= 1 &&
                           ofmt.indexWait + ofmt.revolutions <= 2,
                           'so the command spans between one and two revolutions',
                           String(ofmt.indexWait + ofmt.revolutions));
                    // The anchor sector the ROM wrote is what our own reader uses
                    // to work out the geometry, so this is the ROM and the loader
                    // agreeing about the format rather than either alone.
                    assert(img[0] === 0x18 && img[1] === 0x05,
                           'and the ROM has written an Opus anchor sector',
                           img[0].toString(16) + ' ' + img[1].toString(16));
                    let info = null;
                    try { info = OPDLoader.getDiskInfo(img); } catch (e) {}
                    assert(info && info.diskLabel === 'OPDISK',
                           'our reader finds the label the ROM was given',
                           info ? JSON.stringify(info.diskLabel) : '(unreadable)');
                    assert(info && info.tracks === 40 && info.sides === 1 &&
                           info.sectorsPerTrack === 18 && info.bytesPerSector === 256,
                           'in the geometry the drive was set to',
                           info ? `${info.tracks}x${info.sides}x${info.sectorsPerTrack}x${info.bytesPerSector}` : '');
                    assert(info && info.fileCount === 0, 'with an empty catalogue');

                    // And the disk works: SAVE to it, wipe the machine, LOAD back.
                    coldBoot();
                    inject(['10 PRINT "FMTOKEN"', '20 STOP',
                            '100 SAVE *"m";1;"RT" LINE 10'].join('\n'));
                    pressRun(100, 800);
                    assert(screenText().includes('0 OK'),
                           'a SAVE to the disk the ROM just made reports OK',
                           screenText().slice(-70));
                    coldBoot();
                    inject('10 LOAD *"m";1;"RT"');
                    pressRun('', 1200);
                    assert(screenText().includes('FMTOKEN'),
                           'and after a hard reset the program loads back and runs',
                           screenText().slice(-70));
                    let names = [];
                    try {
                        names = (OPDLoader.listFiles(sp.opus.drives[0].diskData) || [])
                            .map(f => (f.name || '').trim()).filter(Boolean);
                    } catch (e) {}
                    assert(names.includes('RT'), 'and the catalogue of the new disk lists it',
                           names.join(', ') || '(empty)');
                }
            }

            // ---------------------------------------------------------------
            section('Didaktik 80 — MDOS formats 160 track-sides');
            {
                const { DidaktikLoader } = await import('../core/loaders.js');
                const rom = await fetchRom('didaktik.rom');
                if (!rom) { assert(false, 'didaktik.rom is in roms/'); }
                else {
                    allInterfacesOff();
                    sp.memory.loadDidaktikRom(rom);
                    sp.didaktikEnabled = true;
                    sp.updateBetaDiskPagingFlag();
                    // A valid MDOS disk with every byte poisoned, so "formatted"
                    // cannot be confused with "was already blank".
                    const old = DidaktikLoader.createBlankD80('OLDLABEL');
                    for (let i = 0; i < old.length; i++) old[i] = 0x5A;
                    sp.loadD80Image(old, 'old.d80', 0);

                    coldBoot();
                    inject('10 FORMAT "A:MDDISK"');
                    pressRun('', 400);
                    // MDOS asks before it destroys a disk, which is worth pinning:
                    // a format that needed no confirmation would mean the ROM had
                    // taken a different path through its own command parser.
                    assert(/discard|proceed/i.test(screenText()),
                           'MDOS asks before discarding the disk',
                           screenText().slice(-70));
                    sp.ula.keyDown('p');
                    for (let i = 0; i < 6; i++) sp.runFrameHeadless();
                    sp.ula.keyUp('p');
                    sp.ula.keyboardState.fill(0xFF);
                    for (let i = 0; i < 6000; i++) sp.runFrameHeadless();

                    const img = sp.didaktik.drives[0].diskData;
                    // Same pacing as the Opus: the Didaktik is the other interface
                    // that transfers by NMI, and MDOS measured ~128 T a byte
                    // before the DRQ schedule was made absolute.
                    const dfmt = sp.didaktik.lastFormat || {};
                    assert(dfmt.revolutions > 0.98 && dfmt.revolutions < 1.05,
                           'MDOS writes a track in one revolution too',
                           String(dfmt.revolutions));
                    assert(dfmt.indexWait >= 0 && dfmt.indexWait <= 1 &&
                           dfmt.indexWait + dfmt.revolutions >= 1 &&
                           dfmt.indexWait + dfmt.revolutions <= 2,
                           'after its own wait for the index, so one to two in all',
                           dfmt.indexWait + ' + ' + dfmt.revolutions);
                    let info = null;
                    try { info = DidaktikLoader.getDiskInfo(img); } catch (e) {}
                    assert(info && info.diskLabel === 'MDDISK',
                           'the formatted disk carries the new label',
                           info ? JSON.stringify(info.diskLabel) : '(unreadable)');
                    assert(info && info.tracks === 80 && info.sides === 2 &&
                           info.sectorsPerTrack === 9 && info.bytesPerSector === 512,
                           'in MDOS geometry',
                           info ? `${info.tracks}x${info.sides}x${info.sectorsPerTrack}x${info.bytesPerSector}` : '');
                    assert(info && info.fileCount === 0,
                           'and the old disk\'s contents are gone',
                           info ? String(info.fileCount) : '');

                    coldBoot();
                    inject(['10 PRINT "FMTOKEN"', '20 STOP', '100 SAVE *"RT" LINE 10'].join('\n'));
                    pressRun(100, 800);
                    coldBoot();
                    inject('10 LOAD *"RT"');
                    pressRun('', 1200);
                    let names = [];
                    try {
                        names = (DidaktikLoader.listFiles(sp.didaktik.drives[0].diskData) || [])
                            .map(f => (f.name || '').trim()).filter(Boolean);
                    } catch (e) {}
                    assert(names.includes('RT'),
                           'a SAVE to the disk MDOS made lands in its catalogue',
                           names.join(', ') || '(empty)');
                    assert(screenText().includes('FMTOKEN'),
                           'and the program loads back after a hard reset',
                           screenText().slice(-70));
                }
            }

            // ---------------------------------------------------------------
            section('Interface 1 / Microdrive — the same round trip');
            {
                const rom = await fetchRom('if1.rom');
                if (!rom) { assert(false, 'if1.rom is in roms/'); }
                else {
                    allInterfacesOff();
                    sp.memory.loadIF1Rom(rom);
                    sp.if1Enabled = true;
                    sp.updateBetaDiskPagingFlag();
                    sp.loadMDRImage(MDRLoader.createBlankMDR('RTCART'), 'blank.mdr', 0);
                    assert(sp._if1PagingEnabled, 'the interface reports itself usable');

                    const r = roundTrip('SAVE *"m";1;"RT"', 'LOAD *"m";1;"RT"');
                    assert(r.afterSave.includes('0 OK'), 'SAVE to a blank cartridge reports OK',
                           r.afterSave.slice(-60));
                    assert(r.ok, 'and after a hard reset the program loads back and runs',
                           r.afterLoad.slice(-60));
                }
            }

            // ---------------------------------------------------------------
            section('Didaktik 80 — the same round trip through MDOS');
            {
                const { DidaktikLoader } = await import('../core/loaders.js');
                const rom = await fetchRom('didaktik.rom');
                if (!rom) { assert(false, 'didaktik.rom is in roms/'); }
                else {
                    allInterfacesOff();
                    sp.memory.loadDidaktikRom(rom);
                    sp.didaktikEnabled = true;
                    sp.updateBetaDiskPagingFlag();
                    assert(sp._didaktikPagingEnabled, 'the interface reports itself usable');
                    sp.loadD80Image(DidaktikLoader.createBlankD80('TESTDISK'), 'blank.d80', 0);

                    // Time the bytes of the LOAD as well as checking it works.
                    // The Didaktik transfers by NMI like the Opus, so it gets the
                    // same absolute DRQ schedule and should read at the medium's
                    // rate — 111.8 T-states a byte on a 48K. Measured from the
                    // host's service instead it came to ~136, the handler's cost
                    // added to every byte rather than hidden inside it.
                    const svc = [];
                    const origR = sp.didaktik.readRegister.bind(sp.didaktik);
                    sp.didaktik.readRegister = (reg) => {
                        const reading = sp.didaktik.reading;
                        const v = origR(reg);
                        if ((reg & 3) === 3 && reading) svc.push(sp.diskClockNow());
                        return v;
                    };

                    // MDOS takes the star form — a bare SAVE "NAME" goes to tape
                    const r = roundTrip('SAVE *"RT"', 'LOAD *"RT"');

                    delete sp.didaktik.readRegister;
                    const byteT = sp.diskByteTStates();
                    const gaps = [];
                    for (let i = 1; i < svc.length; i++) {
                        const d = svc[i] - svc[i - 1];
                        if (d > 0 && d < byteT * 8) gaps.push(d);
                    }
                    const meanT = gaps.length
                        ? gaps.reduce((p, c) => p + c, 0) / gaps.length : 0;
                    assert(gaps.length > 200, 'the LOAD read enough bytes to time',
                           gaps.length + ' bytes');
                    assert(gaps.length > 200 && Math.abs(meanT - byteT) < 2,
                           'and MDOS read them at the disk\'s rate, not the handler\'s',
                           meanT.toFixed(1) + ' T a byte against the medium\'s ' +
                           byteT.toFixed(1));

                    assert(r.afterSave.includes('0 OK'), 'SAVE to a blank MDOS disk reports OK',
                           r.afterSave.slice(-60));
                    assert(r.ok, 'and after a hard reset the program loads back and runs',
                           r.afterLoad.slice(-60));

                    // The image itself must show the file, not just the screen
                    let names = [];
                    try {
                        names = (DidaktikLoader.listFiles(sp.didaktik.drives[0].diskData) || [])
                            .map(f => (f.name || '').trim()).filter(Boolean);
                    } catch (e) { /* reported below */ }
                    assert(names.includes('RT'), 'and the MDOS catalogue lists it',
                           names.length ? names.join(', ') : '(catalogue unreadable)');
                }
            }

            // ---------------------------------------------------------------
            section('Didaktik 80 on a 128K — only with the hardware patch');
            {
                // A stock 128K cannot run a Didaktik; some 48-to-128K upgrades
                // were patched so it could (VELESOFT, and Arki55 used one for
                // years). What the patch has to achieve here is ROM page 1: the
                // Didaktik ROM runs from reset and expects 48K BASIC beneath it,
                // and a 128K left on bank 0 boots the editor instead, so MDOS
                // never starts. The round trip is the same one as on the 48K --
                // a SAVE, a hard reset and a LOAD that must run -- because
                // "it works on a 128K" means exactly that and nothing weaker.
                const { DidaktikLoader } = await import('../core/loaders.js');
                const rom = await fetchRom('didaktik.rom');
                if (!rom) { assert(false, 'didaktik.rom is in roms/'); }
                else {
                    allInterfacesOff();
                    await w.zxDebug.ready({ machine: '128k' });
                    sp.stop();
                    sp.memory.loadDidaktikRom(rom);
                    sp.didaktikEnabled = true;

                    // Off by default, and that default must bite
                    sp.didaktik128Patch = false;
                    sp.updateBetaDiskPagingFlag();
                    assert(!sp._didaktikPagingEnabled,
                           'without the patch a 128K refuses the interface');
                    assert(!sp.memory.didaktikForceRom1,
                           '  and does not hold the ROM at page 1');

                    sp.didaktik128Patch = true;
                    sp.updateBetaDiskPagingFlag();
                    assert(sp._didaktikPagingEnabled,
                           'with the patch it reports itself usable');
                    assert(sp.memory.didaktikForceRom1, '  and hardwires ROM page 1');
                    coldBoot();
                    assert(sp.memory.currentRomBank === 1,
                           '  which survives a reset, when bank 0 would be the editor',
                           'bank ' + sp.memory.currentRomBank);
                    sp.memory.writePaging(0x00);   // an OUT that would select ROM 0
                    assert(sp.memory.currentRomBank === 1,
                           '  and a 7FFD write cannot put the editor back',
                           'bank ' + sp.memory.currentRomBank);

                    sp.loadD80Image(DidaktikLoader.createBlankD80('TESTDISK'), 'blank.d80', 0);
                    const r = roundTrip('SAVE *"RT"', 'LOAD *"RT"');
                    assert(r.afterSave.includes('0 OK'),
                           'SAVE to an MDOS disk reports OK on a patched 128K',
                           r.afterSave.slice(-60));
                    assert(r.ok, 'and after a hard reset the program loads back and runs',
                           r.afterLoad.slice(-60));
                    let n128 = [];
                    try {
                        n128 = (DidaktikLoader.listFiles(sp.didaktik.drives[0].diskData) || [])
                            .map(f => (f.name || '').trim()).filter(Boolean);
                    } catch (e) { /* reported below */ }
                    assert(n128.includes('RT'), 'and the catalogue lists it',
                           n128.length ? n128.join(', ') : '(catalogue unreadable)');

                    // The patch is for the Sinclair-compatible 128K/+2 only
                    await w.zxDebug.ready({ machine: '+2a' });
                    sp.stop();
                    sp.didaktikEnabled = true; sp.didaktik128Patch = true;
                    sp.updateBetaDiskPagingFlag();
                    assert(!sp._didaktikPagingEnabled,
                           'the patch does not extend to the +2A, which decodes 7FFD differently');
                    await w.zxDebug.ready({ machine: 'pentagon' });
                    sp.stop();
                    sp.didaktikEnabled = true; sp.didaktik128Patch = true;
                    sp.updateBetaDiskPagingFlag();
                    assert(!sp._didaktikPagingEnabled,
                           'nor to a machine with its own disk interface built in');

                    allInterfacesOff();
                    sp.didaktik128Patch = false;
                    await w.zxDebug.ready({ machine: '48k' });
                    sp.stop();
                    sp.updateBetaDiskPagingFlag();
                    assert(!sp.memory.didaktikForceRom1,
                           'and a 48K never holds the ROM at page 1');
                }
            }

            // ---------------------------------------------------------------
            section('+D — the ROM runs instead of resetting the machine');
            {
                // A +D disk cannot be synthesised here: the 8K ROM is only a
                // bootstrap and needs G+DOS in a +SYS file on the disk, which we
                // have no copy of. What CAN be pinned down is the failure this
                // interface actually had — the tape LD-BYTES trap fired at $0556
                // inside the +D's own routine and soft-reset the machine, so the
                // ROM never got to say anything. Its own diagnostic is proof the
                // ROM ran and read the disk.
                const rom = await fetchRom('plusd.rom');
                if (!rom) { assert(false, 'plusd.rom is in roms/'); }
                else {
                    allInterfacesOff();
                    sp.memory.loadPlusDRom(rom);
                    sp.plusDEnabled = true;
                    sp.updateBetaDiskPagingFlag();
                    sp.loadMGTImage(new Uint8Array(819200), 'blank.mgt', 0);
                    assert(sp._plusDPagingEnabled, 'the interface reports itself usable');

                    // RUN must be a DIRECT command here — as a program line it
                    // would restart itself forever. So: cold boot, no program in
                    // memory, and press R ENTER.
                    coldBoot();
                    pressRun('', 500);
                    const scr = screenText();
                    // G+DOS says so itself when the disk has no system on it
                    assert(/SYS|SYSTEM|Disk|disc/i.test(scr),
                           'booting a disk with no +SYS gets the ROM\'s own message',
                           scr.slice(-70) || '(blank screen — the ROM produced nothing)');
                    assert(scr.length > 0,
                           'and the machine has not silently reset to a bare BASIC screen',
                           '(screen empty)');
                    note('a full +D round trip needs a G+DOS +SYS disk, which is not in the tree');
                }
            }

            // ---------------------------------------------------------------
            // Machine switch last: it rebuilds Memory and the ROM banks
            section('TR-DOS / Beta Disk on Pentagon');
            {
                // TR-DOS used to be exempted from this suite's round trip on the
                // grounds that tests/tests.json already boots real TR-DOS software.
                // It does -- but every one of those entries READS a disk somebody
                // else wrote. None of them proves our TR-DOS WRITER, which is the
                // failure mode this suite exists for and the one the Microdrive
                // actually had. So Pentagon does the round trip like everything else.
                //
                // Two things make it look different from the +D/Opus/Didaktik ones.
                // The Beta Disk is not a $0000 overlay with a star syntax: from
                // 128 BASIC `SAVE "x"` goes to TAPE, and only TR-DOS's own prompt
                // saves to disk -- so the commands are typed at the A> prompt
                // instead of run as program lines, and the shared roundTrip()
                // helper (which cold-boots into BASIC) cannot be used. And the
                // reset has to be bootTrdos(), not reset(): a plain Pentagon reset
                // lands in the ROM's own menu, not in TR-DOS.
                await w.zxDebug.ready({ machine: 'pentagon' });
                sp.stop();
                allInterfacesOff();
                sp.updateBetaDiskPagingFlag();
                assert(sp.profile.betaDiskDefault, 'Pentagon has the Beta Disk built in');
                assert(sp.memory.hasTrdosRom(), 'and trdos.rom is loaded');
                assert(sp.betaDiskEnabled || sp.profile.betaDiskDefault,
                       'and the interface is active without being asked for');

                const { TRDLoader } = await import('../core/loaders.js');
                const blank = TRDLoader.buildTRD([], 'RTDISK');
                sp.loadDiskImage(blank, 'trd', 'blank.trd', 0);

                // One key at a time at the TR-DOS prompt. The cursor is in K mode,
                // so the FIRST letter gives a whole keyword -- 's' is SAVE, 'r' is
                // RUN -- and the rest of the line is typed as characters. Spelling
                // out "SAVE" would type the keyword and then AVE.
                const trdosKeys = (keys, frames = 500) => {
                    for (const k of keys) {
                        sp.ula.keyDown(k);
                        for (let i = 0; i < 6; i++) sp.runFrameHeadless();
                        sp.ula.keyUp(k);
                        sp.ula.keyboardState.fill(0xFF);
                        for (let i = 0; i < 6; i++) sp.runFrameHeadless();
                    }
                    for (let i = 0; i < frames; i++) sp.runFrameHeadless();
                };
                // bootTrdos() is a full machine reset with the disk preserved and
                // TR-DOS paged in at $0000, which is how the app enters TR-DOS.
                let pagedAtEntry = false;
                const enterTrdos = (frames = 250) => {
                    const ok = sp.bootTrdos();
                    pagedAtEntry = !!sp.memory.trdosActive;
                    for (let i = 0; i < frames; i++) {
                        sp.ula.keyboardState.fill(0xFF);
                        sp.runFrameHeadless();
                    }
                    return ok;
                };

                assert(enterTrdos(), 'bootTrdos() reports it entered TR-DOS');
                const prompt = screenText();
                assert(/TR-DOS/i.test(prompt), 'and the ROM itself prints its banner',
                       prompt.slice(0, 70) || '(blank screen — the ROM produced nothing)');
                assert(pagedAtEntry, '  having paged the TR-DOS ROM in to get there');
                // By the time the prompt is up, TR-DOS has paged ITSELF back out:
                // the Beta Disk is not a permanent overlay, it comes back in on an
                // opcode fetch in $3D00-$3DFF. What has to hold at the prompt is
                // the background ROM bank -- updateBetaDiskPaging() only re-pages
                // when bank 1 (48K BASIC) is selected, so a Pentagon sitting on
                // bank 0, the 128 editor, can never re-enter TR-DOS at all.
                assert(sp.memory.currentRomBank === 1,
                       '  and left ROM bank 1 selected, which is what lets it back in',
                       'bank ' + sp.memory.currentRomBank);

                // A program in memory, then SAVE "rt" at the prompt. Lower case
                // throughout: after a keyword the Spectrum types lower case, and
                // what matters is that the save and the load agree.
                inject(['10 PRINT "RTOKEN"', '20 STOP'].join('\n'));
                trdosKeys(['s', '"', 'r', 't', '"', 'Enter']);
                const afterSave = screenText();
                assert(!/error|no disk|not found/i.test(afterSave),
                       'SAVE to a blank TR-DOS disk reports no error',
                       afterSave.slice(-70));

                // The image must show the file, not just the screen — this is the
                // half that a read-only screen test can never reach.
                let cat = [];
                try {
                    cat = (TRDLoader.listFiles(sp.betaDisk.drives[0].diskData) || [])
                        .map(f => (f.name || '').trim()).filter(Boolean);
                } catch (e) { /* reported below */ }
                assert(cat.some(n => n.toLowerCase() === 'rt'),
                       'and the TR-DOS catalogue lists it',
                       cat.length ? cat.join(', ') : '(catalogue unreadable)');

                // Hard reset, re-enter TR-DOS, RUN "rt" — it must load AND run
                assert(enterTrdos(), 'the machine re-enters TR-DOS after a hard reset');
                assert(!screenText().includes('RTOKEN'),
                       '  with the program really gone from RAM');
                trdosKeys(['r', '"', 'r', 't', '"', 'Enter'], 700);
                const afterLoad = screenText();
                assert(afterLoad.includes('RTOKEN'),
                       'and RUN loads the program back off the disk and runs it',
                       afterLoad.slice(-70));

                // ---------------------------------------------------------------
                // TR-DOS formats a disk too — but only if you can type the word.
                // At the `A>` prompt the cursor is in K mode, where `f` is FOR,
                // not FORMAT: FORMAT is an EXTENDED-mode keyword (CAPS+SYMBOL,
                // then SYMBOL+0) and nothing in `ula.keyDown` reaches it, so the
                // matrix is driven directly here. Getting that wrong is how
                // TR-DOS came to look as though it could not format at all.
                section('TR-DOS — FORMAT makes a disk, from the prompt');
                {
                    const CAPS = [0, 0], SYM = [7, 1], ZERO = [4, 0];
                    const press = (cells, f = 8) => {
                        for (const [r, b] of cells) sp.ula.keyboardState[r] &= ~(1 << b);
                        for (let i = 0; i < f; i++) sp.runFrameHeadless();
                        for (const [r, b] of cells) sp.ula.keyboardState[r] |= (1 << b);
                        for (let i = 0; i < f; i++) sp.runFrameHeadless();
                    };

                    // A valid TRD with every byte overwritten, so a formatted
                    // track cannot be confused with one that was already blank.
                    const old = TRDLoader.buildTRD([], 'OLDDISK');
                    for (let i = 0; i < old.length; i++) old[i] = 0x5A;
                    sp.loadDiskImage(old, 'trd', 'old.trd', 0);
                    assert(enterTrdos(), 'TR-DOS comes up on the poisoned disk');

                    press([CAPS, SYM]);        // extended mode
                    press([SYM, ZERO]);        // SYMBOL SHIFT + 0 = FORMAT
                    assert(/FORMAT/.test(screenText()),
                           'SYMBOL+0 in extended mode types the FORMAT keyword',
                           screenText().slice(-50));
                    trdosKeys(['"', 't', 'r', 'd', '"', 'Enter'], 200);
                    for (let i = 0; i < 3000; i++) sp.runFrameHeadless();

                    // Snapshot this BEFORE the SAVE below: every TR-DOS save
                    // issues a Write Track of its own, so `lastFormat` would then
                    // describe that one instead of the format.
                    const lastTrack = { ...(sp.betaDisk.lastFormat || {}) };
                    const scr = screenText();
                    // TR-DOS prints the new disk's name and its free/total count.
                    assert(/trd/.test(scr), 'the format reports the disk\'s new name',
                           scr.slice(-80));
                    assert(/(\d+)\/\1/.test(scr),
                           'and a free count equal to the total — an empty disk',
                           scr.slice(-80));
                    assert(!/error/i.test(scr), 'with no error', scr.slice(-80));

                    const img = sp.betaDisk.drives[0].diskData;
                    // Byte 231 of the disk-info sector (track 0, sector 9) is the
                    // TR-DOS id. The ROM wrote it, so this is the ROM and our
                    // reader agreeing on where the catalogue lives.
                    assert(img[0x800 + 231] === 0x10,
                           'the ROM wrote a TR-DOS disk-info sector',
                           '$' + img[0x800 + 231].toString(16));
                    assert(img[0x800] === 0x00,
                           'with an empty directory in front of it');
                    let cat = [];
                    try { cat = (TRDLoader.listFiles(img) || []).filter(f => f.name); }
                    catch (e) { /* reported below */ }
                    assert(cat.length === 0,
                           'and the old disk\'s files are gone',
                           cat.map(f => f.name).join(', '));

                    // The disk the ROM made has to be usable, which is the only
                    // claim that matters.
                    inject(['10 PRINT "RTOKEN"', '20 STOP'].join('\n'));
                    trdosKeys(['s', '"', 'r', 't', '"', 'Enter'], 600);
                    assert(!/error/i.test(screenText()),
                           'a SAVE to the disk TR-DOS just made reports no error',
                           screenText().slice(-70));
                    let after = [];
                    try {
                        after = (TRDLoader.listFiles(sp.betaDisk.drives[0].diskData) || [])
                            .map(f => (f.name || '').trim()).filter(Boolean);
                    } catch (e) { /* reported below */ }
                    assert(after.some(n => n.toLowerCase() === 'rt'),
                           'and it appears in the catalogue of the new disk',
                           after.join(', ') || '(empty)');

                    // What TR-DOS actually made: 80 tracks on ONE side, because
                    // that is the drive type it defaults to — "1264 free of 1264"
                    // is 80 × 16 minus track 0, not 40 × 2. The last track of the
                    // format says how each of them was laid down.
                    assert(lastTrack.found === 16,
                           'each track was streamed as 16 sectors',
                           JSON.stringify(lastTrack));
                    assert(lastTrack.written === 16 && lastTrack.skipped === 0,
                           'and all 16 of them landed',
                           JSON.stringify(lastTrack));
                    assert(lastTrack.track === 79 && lastTrack.side === 0,
                           'the last one being track 79, side 0 — an 80-track single-sided disk',
                           JSON.stringify(lastTrack));
                    // TR-DOS feeds the data register in a POLLING loop rather than
                    // by NMI, and its loop is faster than the medium — about 57
                    // T-states a byte against the 114.7 a byte has on a Pentagon.
                    // Nothing paced it, so it used to fill a whole track in half a
                    // revolution; the chip now holds DRQ down on port $FF until the
                    // next byte is due and the loop waits, as it does on hardware.
                    // That matters beyond tidiness: with the write window anchored
                    // at the index, a buffer that fills before the window opens
                    // gives a NEGATIVE figure here, which is how the gap was found.
                    assert(lastTrack.revolutions > 0.98 && lastTrack.revolutions < 1.05,
                           'and TR-DOS takes a revolution too, now the chip paces its poll loop',
                           String(lastTrack.revolutions));
                    // And the wait before any of it: a Write Track begins on the
                    // index, not where the command landed, so the command spans
                    // between one and two revolutions.
                    const span = lastTrack.indexWait + lastTrack.revolutions;
                    assert(lastTrack.indexWait >= 0 && lastTrack.indexWait <= 1,
                           'the chip waited part of a turn for the index first',
                           String(lastTrack.indexWait));
                    assert(span >= 1 && span <= 2,
                           'so the whole command spans between one and two revolutions',
                           String(span));
                }

                // The TR-DOS chip is the one ROM that is NOT part of memory.rom,
                // so setMachineType's `new Memory` drops it while every machine ROM
                // survives. That is why a TR-DOS disk could fail on Pentagon while
                // the same disk worked on a Scorpion, which carries TR-DOS inside
                // scorpion.rom (trdosInRom) and so cannot lose it. Switching away
                // and back has to put the chip back.
                sp.memory.trdosRom.fill(0);
                assert(!sp.memory.hasTrdosRom(), 'a blanked TR-DOS chip reads as absent');
                await w.zxDebug.ready({ machine: '48k' });
                sp.stop();
                await w.zxDebug.ready({ machine: 'pentagon' });
                sp.stop();
                assert(sp.memory.hasTrdosRom(),
                       'and switching back to Pentagon gives it a TR-DOS chip again');
                assert(sp.bootTrdos(), '  so TR-DOS still boots');
                note('the cold-cache half of that bug — ensureRom() fetching trdos.rom when');
                note('roms/ has not been walked yet — needs an empty ROM cache, which this');
                note('suite cannot make; it is held by the fetch list in zxDebug.ensureRom.');

                // The other side of the asymmetry, stated rather than assumed:
                // a Scorpion's TR-DOS is bank 3 of scorpion.rom, so it travels
                // with the machine ROM and no separate chip can go missing.
                await w.zxDebug.ready({ machine: 'scorpion' });
                sp.stop();
                assert(sp.profile.trdosInRom && sp.profile.trdosRomBank === 3,
                       'a Scorpion keeps TR-DOS in its own ROM, not a separate chip');
                sp.memory.trdosRom.fill(0);
                assert(sp.memory.hasTrdosRom(),
                       '  so blanking the chip cannot take TR-DOS away from it');
                sp.loadDiskImage(TRDLoader.buildTRD([], 'RTDISK'), 'trd', 'blank.trd', 0);
                assert(sp.bootTrdos(), '  and it boots TR-DOS regardless');
            }

            // ---------------------------------------------------------------
            section('+3 floppy — the built-in uPD765');
            {
                // This one had no end-to-end cover at all: tests.json has no +3
                // entry, so the FDC and the whole +3DOS path were shipped on
                // trust. It works — but nothing proved it until now.
                //
                // The screen reader is no use here: the 128 editor's font defeats
                // the glyph match and every row comes back as '?'. So the program
                // POKEs a sentinel instead, and the SAVE is checked by reading the
                // +3DOS directory straight off the image.
                const { DSKLoader } = await import('../core/fdc.js');
                await w.zxDebug.ready({ machine: '+3' });
                sp.stop();
                assert(!!sp.fdc, 'the +3 has an FDC');

                sp.loadDSKImage(DSKLoader.createBlankDSK('p3-ss40').toBuffer(), 'blank.dsk', 0);

                const key = (k, hold = 6, gap = 6) => {
                    sp.ula.keyDown(k);
                    for (let i = 0; i < hold; i++) sp.runFrameHeadless();
                    sp.ula.keyUp(k);
                    sp.ula.keyboardState.fill(0xFF);
                    for (let i = 0; i < gap; i++) sp.runFrameHeadless();
                };
                const type = (s, frames = 0) => {
                    for (const ch of s) key(ch === '\n' ? 'Enter' : (ch === ' ' ? 'Space' : ch));
                    for (let i = 0; i < frames; i++) sp.runFrameHeadless();
                };
                // Menu item 2 is the disk-aware BASIC. Item 4 is 48 BASIC, which
                // types in keyword mode and silently mangles everything typed.
                const toBasic = () => {
                    coldBoot(200);
                    key('ArrowDown');
                    key('Enter');
                    for (let i = 0; i < 120; i++) sp.runFrameHeadless();
                };

                toBasic();
                type('10 POKE 40000,123\n', 20);
                type('20 STOP\n', 20);
                type('SAVE "RT" LINE 10\n', 500);

                let dir = [];
                try { dir = DSKLoader.listFiles(sp.fdc.drives[0].disk) || []; } catch (e) { /* below */ }
                assert(dir.some(f => (f.name || '').trim().toUpperCase() === 'RT'),
                       'SAVE writes the file into the +3DOS directory',
                       dir.length ? dir.map(f => f.name).join(', ') : '(directory empty)');

                toBasic();
                sp.memory.write(40000, 0);
                type('LOAD "RT"\n', 700);
                assert(sp.memory.read(40000) === 123,
                       'and after a reset it loads back and its autostart line runs',
                       'the sentinel at 40000 is ' + sp.memory.read(40000) + ', not 123');
            }

            log('');
            log(failed === 0 ? 'ALL PASSED' : failed + ' FAILED',
                failed === 0 ? 'pass' : 'fail');
        })();
    </script>
</body>
</html>
