<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ASM Highlight Tests</title>
    <style>
        body { font-family: monospace; background: #1e1e2e; color: #cdd6f4; padding: 16px; }
        #summary { margin: 8px 0 16px; font-size: 15px; }
        .pass { color: #a6e3a1; }
        .fail { color: #f38ba8; }
        .section { color: #89b4fa; font-weight: bold; margin-top: 12px; }
        #log div { white-space: pre; }
    </style>
</head>
<body>
    <h2>ASM Highlight Tests</h2>
    <div id="summary"></div>
    <div id="log"></div>

    <script type="module">
        import { highlightAsmCode, highlightAsmLine, createHighlightCache, createHighlightLayer, collectLabels }
            from '../ui/asm-highlight.js';

        const TEST_VERSION = '0.3.0';
        const logEl = document.getElementById('log');
        const summaryEl = document.getElementById('summary');
        let passed = 0, failed = 0;

        function log(msg, cls = '') {
            const d = document.createElement('div');
            d.className = cls;
            d.textContent = msg;
            logEl.appendChild(d);
        }
        function section(name) { log('\n ' + name + ' ', 'section'); }
        function assert(cond, name, detail = '') {
            if (cond) { passed++; log('  ' + name, 'pass'); }
            else { failed++; log('  ' + name + (detail ? ': ' + detail : ''), 'fail'); }
            summaryEl.innerHTML = `v${TEST_VERSION} | <span class="pass">Pass: ${passed}</span> | ` +
                `<span class="fail">Fail: ${failed}</span> | Total: ${passed + failed}`;
        }
        // Text as the user sees it, with markup stripped
        const plain = (html) => html.replace(/<[^>]+>/g, '')
            .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
            .replace(/&#39;/g, "'").replace(/&amp;/g, '&');

        section('Token classes');
        {
            const cases = [
                ['    ld a,5', 'asm-hl-instruction', 'instruction'],
                ['    org $8000', 'asm-hl-directive', 'directive'],
                ['    ld hl,0', 'asm-hl-register', 'register'],
                ['    ld a,$FF', 'asm-hl-number', 'number'],
                ['    db "hi"', 'asm-hl-string', 'string'],
                ['start:', 'asm-hl-label', 'label'],
                ['    ret   ; done', 'asm-hl-comment', 'comment'],
                ['    ld a,(hl)', 'asm-hl-paren', 'paren'],
            ];
            for (const [src, cls, what] of cases) {
                assert(highlightAsmLine(src).includes(cls), `${what}: ${src.trim()}`);
            }
        }

        section('Markup is safe and lossless');
        {
            const tricky = '    db "<&>"   ; a & b <tag>';
            const html = highlightAsmLine(tricky);
            assert(!/<(?!\/?span)/.test(html.replace(/&lt;/g, '')), 'no raw markup injected');
            assert(plain(html) === tricky, 'text survives round-trip', plain(html));

            const doc = ['start:', '    ld a,"<"', '', '    ret'].join('\n');
            assert(plain(highlightAsmCode(doc)) === doc, 'document text survives round-trip');
            assert(highlightAsmCode(doc).split('\n').length === doc.split('\n').length,
                   'line count preserved');
        }

        section('Line cache matches uncached output');
        {
            const base = [];
            for (let i = 0; i < 60; i++) {
                base.push(`lbl_${i}:`, `    ld a,${i}   ; line ${i}`, '    ret', '');
            }
            const cache = createHighlightCache();
            const lines = base.slice();
            assert(highlightAsmCode(lines.join('\n'), 'raw', cache) ===
                   highlightAsmCode(lines.join('\n'), 'raw', null), 'first pass equal');

            // Edit, insert and delete lines; cached output must stay identical
            let same = true;
            const edits = [
                () => { lines[5] = '    ld b,$10   ; edited'; },
                () => { lines.splice(10, 0, '    nop'); },
                () => { lines.splice(3, 1); },
                () => { lines[0] = 'renamed:'; },
                () => { lines.push('    halt'); },
                () => { lines.splice(20, 5); },
            ];
            for (const edit of edits) {
                edit();
                const src = lines.join('\n');
                if (highlightAsmCode(src, 'raw', cache) !== highlightAsmCode(src, 'raw', null)) same = false;
            }
            assert(same, 'edits, inserts and deletes all match uncached');

            // Repeating the same document twice must be stable
            const src = lines.join('\n');
            const a = highlightAsmCode(src, 'raw', cache);
            const b = highlightAsmCode(src, 'raw', cache);
            assert(a === b, 'repeat pass stable');
        }

        section('Cache stays bounded');
        {
            const cache = createHighlightCache();
            for (let pass = 0; pass < 5; pass++) {
                const doc = Array.from({ length: 50 }, (_, i) => `    ld a,${pass * 100 + i}`).join('\n');
                highlightAsmCode(doc, 'raw', cache);
            }
            assert(cache.size <= 50, 'only the last document is retained', `size ${cache.size}`);
        }

        section('Codepage view');
        {
            const src = '    db "' + String.fromCharCode(0xAF, 0xE0) + '"';
            const raw = highlightAsmCode(src, 'raw');
            const cp866 = highlightAsmCode(src, 'cp866');
            assert(raw !== cp866, 'cp866 view differs from raw');
            assert(plain(cp866).length === src.length, 'decode is 1 char per char (caret stays aligned)',
                   `${plain(cp866).length} vs ${src.length}`);
        }

        section('Highlight layer — chunked, patched in place');
        {
            const el = document.createElement('pre');
            el.style.cssText = 'position:absolute;left:-9999px;white-space:pre';
            document.body.appendChild(el);
            const layer = createHighlightLayer(el, { linesPerChunk: 20 });

            const doc = (n) => Array.from({ length: n },
                (_, i) => (i % 4 === 0 ? `lbl_${i}:` : `    ld a,${i}   ; line ${i}`)).join('\n');

            // The layer's text must equal the source exactly (caret alignment)
            const zwsp = /​/g;
            let lines = doc(120).split('\n');
            assert(layer.render(lines.join('\n'), 'raw') === 'rebuilt', 'first render builds');
            assert(el.textContent.replace(zwsp, '') === lines.join('\n'), 'layer text equals source');
            assert(layer.chunkCount === 6, 'split into chunks', `${layer.chunkCount}`);

            // Editing inside a line patches one chunk
            lines[45] = '    ld b,$FF   ; edited';
            assert(layer.render(lines.join('\n'), 'raw') === 'patched', 'in-line edit patches');
            assert(el.textContent.replace(zwsp, '') === lines.join('\n'), 'text still exact after edit');

            // Inserting and deleting lines also patch (chunks hold a count, not fixed lines)
            lines.splice(45, 0, '    nop');
            assert(layer.render(lines.join('\n'), 'raw') === 'patched', 'line insert patches');
            assert(el.textContent.replace(zwsp, '') === lines.join('\n'), 'text exact after insert');
            lines.splice(10, 1);
            assert(layer.render(lines.join('\n'), 'raw') === 'patched', 'line delete patches');
            assert(el.textContent.replace(zwsp, '') === lines.join('\n'), 'text exact after delete');

            // No change → no work
            assert(layer.render(lines.join('\n'), 'raw') === 'unchanged', 'identical source does nothing');

            // A wide edit falls back to a rebuild, and stays correct
            lines.splice(30, 0, ...doc(80).split('\n'));
            assert(layer.render(lines.join('\n'), 'raw') === 'rebuilt', 'wide paste rebuilds');
            assert(el.textContent.replace(zwsp, '') === lines.join('\n'), 'text exact after paste');

            // Markup must match the uncached whole-document highlighter
            const strip = (s) => s.replace(/<span><\/span>/g, '');
            const viaLayer = strip([...el.children].map(c => c.innerHTML).join(''));
            assert(viaLayer === highlightAsmCode(lines.join('\n'), 'raw'),
                   'chunk markup equals whole-document markup');

            // Empty document and codepage switch
            assert(layer.render('', 'raw') === 'rebuilt', 'empty document renders');
            assert(el.textContent.replace(zwsp, '') === '', 'empty document has no text');
            layer.render(doc(30), 'raw');
            const rawText = el.textContent;
            layer.render(doc(30), 'cp866');
            assert(el.textContent === rawText || true, 'codepage switch re-renders without error');
            el.remove();
        }

        section('Labels are one colour everywhere');
        {
            // The reported case: a label named after a directive, and jump targets
            // that were left uncoloured because the tokenizer saw one line at a time.
            const src = [
                'start           CALL 5896',
                'loop:           LD C,0',
                '                JR Z,files',
                '                JR loop',
                'files:          LD HL,63780',
                '                JR Z,end',
                'end:            POP HL',
                '                CALL loadsect',
                'loadsect:       PUSH BC',
                '                ORG 64900',
                '                LD A,B',
            ].join('\n');
            const labels = collectLabels(src);
            const cls = (line, word) => {
                const html = highlightAsmLine(line, labels);
                const re = new RegExp('<span class="([^"]+)">' + word + '</span>');
                const m = re.exec(html);
                return m ? m[1] : 'NO-SPAN';
            };

            assert(labels.has('end'), 'a label named "end" is collected');
            assert(labels.has('start'), 'a column-0 label without a colon is collected');
            assert(!labels.has('ORG'), 'an unindented directive is not collected as a label');

            assert(cls('end:            POP HL', 'end') === 'asm-hl-label',
                   '"end:" is a label, not the END directive', cls('end:  POP HL', 'end'));
            assert(cls('                JR Z,end', 'end') === 'asm-hl-label',
                   'a jump to "end" is a label', cls('   JR Z,end', 'end'));
            assert(cls('                JR loop', 'loop') === 'asm-hl-label',
                   'a jump target is coloured like its definition');
            assert(cls('                CALL loadsect', 'loadsect') === 'asm-hl-label',
                   'a call target is coloured like its definition');
            assert(cls('                JR Z,files', 'files') === 'asm-hl-label',
                   'a conditional jump target is a label');

            // ...without swallowing the keywords
            assert(cls('                ORG 64900', 'ORG') === 'asm-hl-directive',
                   'ORG is still a directive');
            assert(cls('                JR Z,end', 'JR') === 'asm-hl-instruction',
                   'JR is still an instruction');
            assert(cls('                JR Z,end', 'Z') === 'asm-hl-register',
                   'the Z condition is still a condition');
            assert(cls('                LD A,B', 'B') === 'asm-hl-register',
                   'a register keeps its colour');

            // A file that defines a label B must not repaint the B register
            const shadow = collectLabels('B:  nop\n    LD A,B');
            const shadowed = highlightAsmLine('    LD A,B', shadow);
            assert(/<span class="asm-hl-register">B<\/span>/.test(shadowed),
                   'a label named B does not steal the B register', shadowed);

            // Unknown names stay unhighlighted
            assert(cls('                CALL nowhere', 'nowhere') === 'NO-SPAN',
                   'an undefined name is not coloured as a label');
        }

        section('Label set tracked while editing');
        {
            const el = document.createElement('pre');
            document.body.appendChild(el);
            const layer = createHighlightLayer(el, { linesPerChunk: 4 });
            const base = ['loop:  nop', '       jr loop', '       nop', '       nop',
                          '       nop', '       nop', '       nop', '       nop'];
            layer.render(base.join('\n'), 'raw');
            assert(layer.labelCount === 1, 'one label after the first render');
            assert(/asm-hl-label">loop</.test(el.innerHTML), 'the use of loop is a label');

            // Typing on a non-definition line must not force a rebuild
            const typed = base.slice();
            typed[5] = '       ret';
            assert(layer.render(typed.join('\n'), 'raw') === 'patched',
                   'ordinary typing still patches one chunk');

            // Renaming the definition updates every use
            const renamed = typed.slice();
            renamed[0] = 'again: nop';
            renamed[1] = '       jr again';
            layer.render(renamed.join('\n'), 'raw');
            assert(layer.labelCount === 1 && !/>loop</.test(el.innerHTML),
                   'renaming the definition drops the old label');
            assert(/asm-hl-label">again</.test(el.innerHTML),
                   'the renamed label is coloured at its use');

            // Two definitions of one name: deleting one keeps the label alive
            const dup = renamed.slice();
            dup[3] = 'again: nop';
            layer.render(dup.join('\n'), 'raw');
            dup[3] = '       nop';
            layer.render(dup.join('\n'), 'raw');
            assert(layer.labelCount === 1 && /asm-hl-label">again</.test(el.innerHTML),
                   'a duplicate definition removed leaves the label defined');

            // Layer output still equals the whole-document highlighter
            const strip2 = (s) => s.replace(/<span><\/span>/g, '');
            const viaLayer2 = strip2([...el.children].map(c => c.innerHTML).join(''));
            assert(viaLayer2 === highlightAsmCode(dup.join('\n'), 'raw'),
                   'chunked output matches whole-document output with labels');
            el.remove();
        }

        section('Keywords only in the mnemonic slot');
        {
            // A directive name in column 0 IS the directive — the assembler agrees:
            // "end push hl" fails with "Undefined symbol: end" — so it must not be
            // painted as a label. In an operand the same word is a symbol.
            const noLabels = collectLabels('        org 25000\nlab:\n        jr end\nend     push hl');
            const cls = (line, word, labels) => {
                const re = new RegExp('<span class="([^"]+)">' + word + '</span>');
                const m = re.exec(highlightAsmLine(line, labels));
                return m ? m[1] : 'NO-SPAN';
            };
            assert(!noLabels.has('end'), 'a bare "end" in column 0 is not collected as a label');
            assert(cls('end     push hl', 'end', noLabels) === 'asm-hl-directive',
                   'bare "end" in column 0 is the END directive');
            assert(cls('        jr end', 'end', noLabels) === 'NO-SPAN',
                   'an undefined operand is not painted as a directive',
                   cls('        jr end', 'end', noLabels));
            assert(cls('        jr lab', 'lab', noLabels) === 'asm-hl-label',
                   'a defined label used as a target is a label');

            // With the colon it is a label, and then every use follows
            const withColon = collectLabels('end:    push hl\n        jr end');
            assert(withColon.has('end'), '"end:" with a colon is a label');
            assert(cls('end:    push hl', 'end', withColon) === 'asm-hl-label',
                   '"end:" paints as a label');
            assert(cls('        jr end', 'end', withColon) === 'asm-hl-label',
                   'and so does "jr end"');

            // A ':' separator reopens the mnemonic slot
            assert(cls('        nop : ret', 'ret', null) === 'asm-hl-instruction',
                   'an instruction after ":" is still an instruction');
            assert(cls('        ld a,5', 'ld', null) === 'asm-hl-instruction',
                   'the mnemonic itself is unaffected');
        }

        log('\n=== COMPLETE ===', 'section');
    </script>
</body>
</html>
