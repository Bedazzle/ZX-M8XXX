<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ULA Ink/Paper Edge Skew Tests</title>
    <style>
        body { font-family: monospace; background: #1e1e2e; color: #cdd6f4; padding: 16px; }
        #summary { margin: 8px 0 16px; font-size: 15px; }
        .pass { color: #a6e3a1; }
        .fail { color: #f38ba8; }
        .section { color: #89b4fa; font-weight: bold; margin-top: 12px; }
        #log div { white-space: pre; }
    </style>
</head>
<body>
    <h2>ULA Ink/Paper Edge Skew Tests</h2>
    <div id="summary">running…</div>
    <div id="log"></div>

    <script type="module">
        // The Ferranti ULA switches into ink later than it switches back to paper,
        // so an ink pixel is narrower than a paper one. Only pixels that *start* an
        // ink run pay for it, which is why ordinary graphics look unchanged and a
        // one-pixel checkerboard does not. See core/ula-inkskew.js.
        import { leadingInkMask, mix32, applyInkSkew, litCoverage, inkSkewFor }
            from '../core/ula-inkskew.js';
        import { ULA } from '../core/ula.js';
        import { getMachineProfile } from '../core/machines.js';

        const TEST_VERSION = '1.0.0';
        const logEl = document.getElementById('log');
        const summaryEl = document.getElementById('summary');
        let passed = 0, failed = 0;
        function log(msg, cls = '') {
            const d = document.createElement('div');
            d.className = cls; d.textContent = msg; logEl.appendChild(d);
        }
        function section(name) { log('\n ' + name + ' ', 'section'); }
        function assert(cond, name, detail = '') {
            if (cond) { passed++; log('  ' + name, 'pass'); }
            else { failed++; log('  ' + name + (detail ? ': ' + detail : ''), 'fail'); }
            summaryEl.innerHTML = `v${TEST_VERSION} | <span class="pass">Pass: ${passed}</span> | ` +
                `<span class="fail">Fail: ${failed}</span> | Total: ${passed + failed}`;
        }
        const near = (a, b, eps = 1e-9) => Math.abs(a - b) < eps;

        section('Which pixels start an ink run');
        {
            assert(leadingInkMask(0x00, 0) === 0x00, 'no ink, nothing to skew');
            assert(leadingInkMask(0xFF, 0) === 0x80, 'a solid ink cell pays only at its left edge');
            assert(leadingInkMask(0xFF, 1) === 0x00, 'and not even that if the run carries in');
            assert(leadingInkMask(0xAA, 0) === 0xAA, 'a checkerboard is all leading edges');
            assert(leadingInkMask(0x55, 0) === 0x55, 'either phase of it');
            assert(leadingInkMask(0x55, 1) === 0x55, 'bit 7 is paper, so the carry-in cannot matter');
            assert(leadingInkMask(0xAA, 1) === 0x2A, 'but it does when bit 7 is ink');
            assert(leadingInkMask(0x0F, 0) === 0x08, 'one run, one leading pixel');
            assert(leadingInkMask(0xC3, 0) === 0x82, 'two runs, two — each run\'s leftmost pixel');
        }

        section('Blending the sliver the ink gives up');
        {
            const BLACK = 0xFF000000 >>> 0, WHITE = 0xFFFFFFFF >>> 0;
            assert(mix32(BLACK, WHITE, 256) === WHITE, 'full weight is pure ink');
            assert(mix32(BLACK, WHITE, 0) === BLACK, 'zero weight is pure paper');
            const half = mix32(BLACK, WHITE, 128);
            assert((half & 0xFF) === 127 && ((half >>> 8) & 0xFF) === 127,
                   'half weight lands halfway', '0x' + half.toString(16));
            assert(((half >>> 24) & 0xFF) === 255, 'and alpha survives');
            // endianness-agnostic: reversing how the colour was packed reverses the
            // result byte for byte, so the same code serves either machine
            const a = mix32(0xFF102030 >>> 0, 0xFF405060 >>> 0, 128);
            const b = mix32(0x302010FF >>> 0, 0x605040FF >>> 0, 128);
            assert(a === 0xFF283848 >>> 0, 'blends each byte independently', '0x' + a.toString(16));
            assert(b === 0x483828FF >>> 0, 'and the mirrored packing mirrors exactly',
                   '0x' + b.toString(16));
        }

        section('The Bright Miner measurement');
        {
            // The test paints the background as $AA/$55 with ink white, and the
            // sprite cells as the inverted bytes with ink/paper swapped. Both are
            // the same pixel stream, so with no skew both are exactly half lit.
            const bg = [0xAA, 0xAA, 0xAA, 0xAA];
            const sprite = [0x55, 0x55, 0x55, 0x55];
            assert(near(litCoverage(bg, true, 0), 0.5), 'no skew: background is half lit');
            assert(near(litCoverage(sprite, false, 0), 0.5), 'no skew: sprite is half lit too');
            assert(near(litCoverage(bg, true, 0), litCoverage(sprite, false, 0)),
                   'so a pixel-exact renderer cannot tell them apart — uniform grey');

            for (const skew of [0.03, 0.125, 0.25, 0.5]) {   // 0.03 is the shipped, measured one
                const dark = litCoverage(bg, true, skew);
                const light = litCoverage(sprite, false, skew);
                assert(near(dark, (1 - skew) / 2), `skew ${skew}: white-as-ink is (1-skew)/2`,
                       dark.toFixed(4));
                assert(near(light, (1 + skew) / 2), `skew ${skew}: white-as-paper is (1+skew)/2`,
                       light.toFixed(4));
                assert(near(light - dark, skew), `skew ${skew}: the figure stands out by exactly skew`);
                assert(light > dark, `skew ${skew}: and it is the *brighter* one, as hardware shows`);
            }
        }

        section('Ordinary graphics are left alone');
        {
            // A solid run only pays at its single leading edge, so the wider the run
            // the smaller the error — which is why nothing else on screen shifts.
            const solid = [0xFF, 0xFF, 0xFF, 0xFF];
            assert(near(litCoverage(solid, true, 0), 1), 'no skew: a solid ink row is fully lit');
            assert(near(litCoverage(solid, true, 0.25), 1 - 0.25 / 32),
                   'skew 0.25: it loses a quarter pixel out of 32', litCoverage(solid, true, 0.25).toFixed(5));
            assert(litCoverage(solid, true, 0.25) > 0.99, 'i.e. under 1% — invisible');
            assert(near(litCoverage([0x00, 0x00], true, 0.25), 0), 'and a blank row is untouched');
        }

        section('Re-tinting a rendered cell');
        {
            const BLACK = 0xFF000000 >>> 0, WHITE = 0xFFFFFFFF >>> 0;
            const fb = new Uint32Array(8);
            const draw = (byte, ink, paper) => {
                for (let b = 0; b < 8; b++) fb[b] = (byte & (0x80 >> b)) ? ink : paper;
            };

            draw(0xAA, WHITE, BLACK);
            const carry = applyInkSkew(fb, 0, 0xAA, WHITE, BLACK, 0, 0.25);
            assert(fb[0] !== WHITE && fb[0] !== BLACK, 'a leading ink pixel is blended down');
            assert(fb[1] === BLACK, 'paper pixels are not touched');
            assert(carry === 0, 'and the rightmost pixel is handed to the next cell');

            draw(0xFF, WHITE, BLACK);
            applyInkSkew(fb, 0, 0xFF, WHITE, BLACK, 0, 0.25);
            assert(fb[0] !== WHITE, 'a solid cell loses its left edge');
            for (let b = 1; b < 8; b++) if (fb[b] !== WHITE) { assert(false, 'but nothing else'); break; }
            assert(fb[7] === WHITE, 'but nothing else');
            assert(applyInkSkew(fb, 0, 0xFF, WHITE, BLACK, 1, 0.25) === 1,
                   'a run carrying in from the previous cell pays nothing');
            assert(fb[0] !== WHITE, '  (and the earlier blend stands)');

            // skew 0 must be a no-op, byte for byte
            const before = new Uint32Array(8);
            draw(0x5A, WHITE, BLACK); before.set(fb);
            applyInkSkew(fb, 0, 0x5A, WHITE, BLACK, 0, 0);
            assert(fb.every((v, i) => v === before[i]), 'skew 0 changes nothing at all');
        }

        section('Which machines do it');
        {
            // Same split as ULA snow: the Ferranti part, not Amstrad's 40077 gate
            // array and not the clones. SpecEmu shows the Bright Miner figure on
            // 48/128/+2 and withholds it on +2A/+3/Pentagon, which is what says this
            // is a modelled hardware trait rather than a display filter.
            for (const id of ['48k', '128k', '+2']) {
                assert(getMachineProfile(id).ulaInkSkew > 0, `${id} skews`);
                assert(getMachineProfile(id).hasSnow === true, `  and snows — the same silicon`);
            }
            for (const id of ['+2a', '+3', 'pentagon', 'pentagon1024', 'scorpion']) {
                assert(getMachineProfile(id).ulaInkSkew === 0, `${id} does not`);
                assert(getMachineProfile(id).hasSnow === false, `  nor snows`);
            }

            // 0.03 is measured, not fitted: on a real +2 running this test the figure
            // sat 4.7 of a 170-wide black-to-white range above the background, and the
            // brighter region is the paper-white one, as the model predicts.
            assert(inkSkewFor(getMachineProfile('48k')) === 0.03, 'the profile supplies the default');
            assert(inkSkewFor(getMachineProfile('48k'), 0) === 0, 'an override of 0 switches it off');
            assert(inkSkewFor(getMachineProfile('+2a'), 0.5) === 0.5, 'and can force it on elsewhere');
            assert(inkSkewFor(getMachineProfile('48k'), 5) === 1, 'overrides clamp high');
            assert(inkSkewFor(getMachineProfile('48k'), -1) === 0, 'and low');
            assert(inkSkewFor(null) === 0, 'no profile, no skew');
        }

        section('The ULA picks it up from its machine');
        {
            const fakeMemory = () => ({
                profile: getMachineProfile('48k'), currentRamBank: 0,
                read: () => 0, write: () => {}, readScreen: () => 0
            });
            const ula48 = new ULA(fakeMemory(), '48k');
            assert(ula48.getInkSkew() === 0.03, '48K starts skewed');
            assert(ula48.setInkSkew(0) === 0, 'and can be turned off');
            assert(ula48.getInkSkew() === 0, '  (it sticks)');
            assert(ula48.setInkSkew(null) === 0.03, 'null goes back to the profile');

            const plus2a = new ULA(fakeMemory(), '+2a');
            assert(plus2a.getInkSkew() === 0, 'a +2A does not skew');
            assert(plus2a.setInkSkew(0.25) === 0.25, 'but can be made to, for comparison');
            const pent = new ULA(fakeMemory(), 'pentagon');
            assert(pent.getInkSkew() === 0, 'nor does a Pentagon');
        }

        log('\n=== COMPLETE ===', 'section');
    </script>
</body>
</html>
