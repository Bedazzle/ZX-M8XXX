<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Memory Dump Rendering Tests</title>
    <style>
        body { font-family: monospace; background: #1e1e2e; color: #cdd6f4; padding: 16px; }
        #summary { margin: 8px 0 16px; font-size: 15px; }
        .pass { color: #a6e3a1; }
        .fail { color: #f38ba8; }
        .section { color: #89b4fa; font-weight: bold; margin-top: 12px; }
        #log div { white-space: pre; }
        iframe { width: 1400px; height: 900px; border: 1px solid #444; margin-top: 16px; }
    </style>
</head>
<body>
    <h2>Memory Dump Rendering Tests</h2>
    <div id="summary">running…</div>
    <div id="log"></div>
    <iframe id="app" src="../index.html"></iframe>

    <script type="module">
        // The debugger has two hex dumps, right and left, and they used to be two
        // copies of the same markup -- the ASCII column was eighteen identical lines
        // in each, and v1.0.0's four-byte rule had to be written into both by hand.
        // ui/mem-dump-render.js draws the rows for both now.
        //
        // Unlike the two disassembly views, these two are NOT meant to be identical:
        // the left dump has never shown changed bytes, breakpoint/watchpoint marks or
        // the per-byte tooltip. So the invariant here is a split, and this suite
        // pins BOTH halves of it:
        //
        //   shared    -- address column, the four-byte rule, region classes,
        //                the whole ASCII column, the byte text
        //   right only -- changed, has-bp, has-wp*, the tooltip
        //
        // If someone gives the left dump one of those, this fails and says which --
        // which is the point: it becomes a decision, not a drift.
        const TEST_VERSION = '0.1.0';
        const logEl = document.getElementById('log');
        const summaryEl = document.getElementById('summary');
        let passed = 0, failed = 0;

        function log(msg, cls = '') {
            const d = document.createElement('div');
            d.className = cls;
            d.textContent = msg;
            logEl.appendChild(d);
        }
        function section(name) { log('\n ' + name + ' ', 'section'); }
        function assert(cond, name, detail = '') {
            if (cond) { passed++; log('  ' + name, 'pass'); }
            else { failed++; log('  ' + name + (detail ? ': ' + detail : ''), 'fail'); }
            summaryEl.innerHTML = `v${TEST_VERSION} | <span class="pass">Pass: ${passed}</span> | ` +
                `<span class="fail">Fail: ${failed}</span> | Total: ${passed + failed}`;
        }
        const wait = (ms) => new Promise(r => setTimeout(r, ms));
        async function until(fn, tries = 400, gap = 25) {
            for (let i = 0; i < tries; i++) {
                try { const v = fn(); if (v) return v; } catch (e) { /* not ready */ }
                await wait(gap);
            }
            return null;
        }

        const frame = document.getElementById('app');
        let w, d;

        const BASE = 0x8000;
        // Printable text, nulls, high-bit bytes and something disassemblable, so
        // every branch of a cell is reached.
        const PATTERN = [0x21, 0x34, 0x12, 0xC9, 0x00, 0x00, 0x41, 0x42,
                         0x43, 0x20, 0x7F, 0x80, 0xC1, 0xFF, 0x0D, 0x1B];

        const right = () => d.getElementById('memoryView');
        const left = () => d.getElementById('leftMemoryView');
        const rows = (view) => [...view.querySelectorAll('.memory-line')];
        const cell = (view, addr) => view.querySelector(`.memory-byte[data-addr="${addr}"]`);
        const asciiCell = (view, addr) => view.querySelector(`.memory-ascii > span[data-addr="${addr}"]`);

        function goTo(inputId, value) {
            const inp = d.getElementById(inputId);
            inp.value = value;
            inp.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
        }
        function setPanel(id, val) {
            const s = d.getElementById(id);
            s.value = val;
            s.dispatchEvent(new w.Event('change'));
        }

        (async () => {
          try {
            section('The app comes up with both panels dumping memory');
            const ok = await until(() => frame.contentWindow && frame.contentWindow.zxDebug);
            assert(!!ok, 'emulator boots in the iframe');
            if (!ok) { log('\n=== ABORTED ===', 'fail'); return; }
            w = frame.contentWindow; d = frame.contentDocument;
            await w.zxDebug.ready();
            w.spectrum.stop();
            await wait(150);

            for (let i = 0; i < 256; i++) w.zxDebug.poke(BASE + i, PATTERN[i % PATTERN.length]);
            w.zxDebug.regions.add({ start: BASE + 4, end: BASE + 11, type: 'db', comment: 'raw bytes' });
            w.zxDebug.regions.add({ start: BASE + 16, end: BASE + 31, type: 'text', comment: 'strings' });
            w.zxDebug.addBreakpoint('8003');
            w.spectrum.addWatchpoint('8008', 'both');
            w.spectrum.addWatchpoint('8020', 'read');
            w.spectrum.addWatchpoint('8030', 'write');

            setPanel('leftPanelType', 'memdump');
            setPanel('rightPanelType', 'memdump');
            await wait(200);
            goTo('memoryAddress', '8000');
            goTo('leftMemAddress', '8000');
            await wait(400);

            assert(rows(right()).length > 4, 'the right dump has rows', String(rows(right()).length));
            assert(rows(left()).length > 4, 'the left dump has rows', String(rows(left()).length));
            assert(rows(right())[0].querySelector('.memory-addr').dataset.addr === String(BASE),
                   'the right dump starts where it was told');
            assert(rows(left())[0].querySelector('.memory-addr').dataset.addr === String(BASE),
                   'and so does the left one');

            section('Shared: the four-byte rule');

            // The rule falls after the 4th, 8th and 12th byte of a row, whatever the
            // row length -- which is 8, 16 or 32 depending on how wide the panel is.
            for (const [name, view] of [['right', right()], ['left', left()]]) {
                const row = rows(view)[0];
                const cells = row.querySelectorAll('.memory-byte');
                const ruled = [...cells].map((c, i) => c.classList.contains('group-start') ? i : -1)
                                        .filter(i => i >= 0);
                const want = [];
                for (let i = 4; i < cells.length; i += 4) want.push(i);
                assert(ruled.join(',') === want.join(','),
                       `the ${name} dump rules every 4th byte and no other`,
                       `${cells.length} per line, ruled at ${ruled.join(',')}, wanted ${want.join(',')}`);
                assert(ruled.length > 0, `the ${name} dump actually drew some rules`, String(ruled.length));
            }

            section('Shared: the ASCII column');

            // Same address, same character and the same classes in both panels --
            // apart from `changed`, which only the right dump has.
            const sample = [BASE, BASE + 4, BASE + 5, BASE + 6, BASE + 9, BASE + 11,
                            BASE + 13, BASE + 16, BASE + 20];
            let asciiMismatch = '';
            for (const addr of sample) {
                const a = asciiCell(right(), addr), b = asciiCell(left(), addr);
                if (!a || !b) { asciiMismatch = `missing cell at ${addr}`; break; }
                const clsA = [...a.classList].filter(c => c !== 'changed').sort().join(' ');
                const clsB = [...b.classList].filter(c => c !== 'changed').sort().join(' ');
                if (a.textContent !== b.textContent || clsA !== clsB) {
                    asciiMismatch = `at ${addr}: right "${a.textContent}" [${clsA}] vs left "${b.textContent}" [${clsB}]`;
                    break;
                }
            }
            assert(!asciiMismatch, 'both dumps render the ASCII cell the same way', asciiMismatch);

            assert(asciiCell(right(), BASE + 6).classList.contains('printable'),
                   'a printable byte is marked printable');
            assert(asciiCell(right(), BASE + 4).classList.contains('null-byte'),
                   'a zero byte is marked as such');
            assert(asciiCell(right(), BASE + 4).textContent === '■',
                   'and drawn as a filled square', asciiCell(right(), BASE + 4).textContent);
            assert(asciiCell(right(), BASE + 13).textContent === '.',
                   'an unprintable byte is a dot', asciiCell(right(), BASE + 13).textContent);
            assert(asciiCell(left(), BASE + 20).classList.contains('region-text'),
                   'a text region tints the ASCII column in the LEFT dump too');

            section('Shared: byte text and region classes');

            let byteMismatch = '';
            for (const addr of sample) {
                const a = cell(right(), addr), b = cell(left(), addr);
                if (!a || !b) { byteMismatch = `missing cell at ${addr}`; break; }
                if (a.textContent !== b.textContent) {
                    byteMismatch = `at ${addr}: "${a.textContent}" vs "${b.textContent}"`;
                    break;
                }
                const regA = [...a.classList].filter(c => c.startsWith('region-')).join(' ');
                const regB = [...b.classList].filter(c => c.startsWith('region-')).join(' ');
                if (regA !== regB) { byteMismatch = `region class at ${addr}: "${regA}" vs "${regB}"`; break; }
            }
            assert(!byteMismatch, 'both dumps print the same byte with the same region class', byteMismatch);
            assert(cell(right(), BASE + 5).classList.contains('region-db'),
                   'a db region marks the byte cell');

            section('Right only: marks and the tooltip');

            assert(!!cell(right(), 0x8003) && cell(right(), 0x8003).classList.contains('has-bp'),
                   'a breakpoint marks the byte in the right dump');
            assert(cell(right(), 0x8008).classList.contains('has-wp'),
                   'a read+write watchpoint marks it');
            assert(cell(right(), 0x8020).classList.contains('has-wp-r'), 'a read watchpoint has its own mark');
            assert(cell(right(), 0x8030).classList.contains('has-wp-w'), 'and a write watchpoint');
            assert(/^Addr: 8003 \(32771\)/.test(cell(right(), 0x8003).title),
                   'the tooltip gives the address in both bases', cell(right(), 0x8003).title.split('\n')[0]);
            assert(/Value: /.test(cell(right(), 0x8003).title), 'and the value');

            // The left dump does not have these. Asserted, not assumed -- if it ever
            // should, this is where the decision gets recorded.
            assert(!left().querySelector('.memory-byte.has-bp'),
                   'the left dump shows no breakpoint marks (by design)');
            assert(!left().querySelector('.memory-byte[class*="has-wp"]'),
                   'nor watchpoint marks');
            assert(!left().querySelector('.memory-byte[title]'),
                   'nor per-byte tooltips');

            section('Changed bytes, after a snapshot');

            d.getElementById('btnMemorySnap').click();
            await wait(250);
            assert(!right().querySelector('.memory-byte.changed'),
                   'nothing is changed straight after taking a snapshot');

            for (let i = 0; i < 6; i++) w.zxDebug.poke(BASE + i * 5, 0xAA);
            goTo('memoryAddress', '8000');
            await wait(300);
            const changedCells = right().querySelectorAll('.memory-byte.changed').length;
            assert(changedCells === 6, 'each byte written since the snapshot is marked',
                   String(changedCells));
            assert(!!right().querySelector('.memory-ascii > span.changed'),
                   'and its ASCII cell too');
            assert(!left().querySelector('.changed'),
                   'the left dump does not mark changed bytes (by design)');

            d.getElementById('btnMemoryClearSnap').click();
            await wait(250);
            assert(!right().querySelector('.memory-byte.changed'),
                   'clearing the snapshot clears the marks');

            section('Done');
          } catch (err) {
            assert(false, 'the suite ran to the end', String(err && err.stack || err));
          }
          log(`\n${passed} passed, ${failed} failed`, failed ? 'fail' : 'pass');
          document.title = failed ? 'FAIL' : 'PASS';
        })();
    </script>
</body>
</html>
