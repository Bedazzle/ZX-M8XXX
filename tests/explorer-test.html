<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Explorer Tests</title>
    <style>
        body { font-family: monospace; background: #1e1e2e; color: #cdd6f4; padding: 16px; }
        #summary { margin: 8px 0 16px; font-size: 15px; }
        .pass { color: #a6e3a1; }
        .fail { color: #f38ba8; }
        .section { color: #89b4fa; font-weight: bold; margin-top: 12px; }
        #log div { white-space: pre; }
        iframe { width: 1400px; height: 900px; border: 1px solid #444; margin-top: 16px; }
    </style>
</head>
<body>
    <h2>Explorer Tests</h2>
    <div id="summary">running…</div>
    <div id="log"></div>
    <iframe id="app" src="../index.html"></iframe>

    <script type="module">
        // The Explorer is a UI module built around the app's DOM (initExplorer wires
        // ~290 functions to elements in index.html), so it can't be unit-tested in
        // isolation - this drives the real thing in an iframe and reads the panels
        // back. Everything else about it was previously covered only by throwaway
        // probes, which is why splitting the file was risky.
        import { TRDLoader, SCLLoader, crcFdc, crcUdi } from '../core/loaders.js';

        const TEST_VERSION = '0.1.0';
        const logEl = document.getElementById('log');
        const summaryEl = document.getElementById('summary');
        let passed = 0, failed = 0;

        function log(msg, cls = '') {
            const d = document.createElement('div');
            d.className = cls;
            d.textContent = msg;
            logEl.appendChild(d);
        }
        function section(name) { log('\n ' + name + ' ', 'section'); }
        function assert(cond, name, detail = '') {
            if (cond) { passed++; log('  ' + name, 'pass'); }
            else { failed++; log('  ' + name + (detail ? ': ' + detail : ''), 'fail'); }
            summaryEl.innerHTML = `v${TEST_VERSION} | <span class="pass">Pass: ${passed}</span> | ` +
                `<span class="fail">Fail: ${failed}</span> | Total: ${passed + failed}`;
        }

        const wait = (ms) => new Promise(r => setTimeout(r, ms));
        async function until(fn, tries = 200, gap = 25) {
            for (let i = 0; i < tries; i++) {
                try { const v = fn(); if (v) return v; } catch (e) { /* not ready */ }
                await wait(gap);
            }
            return null;
        }

        const frame = document.getElementById('app');
        let w, d;

        // ---- fixtures ------------------------------------------------------
        function makeSNA() {                       // 48K: 27-byte header + 48K RAM
            const b = new Uint8Array(27 + 49152);
            b[0] = 0x3F;                           // I
            b[23] = 0x00; b[24] = 0x40;            // SP = $4000
            b[25] = 1;                             // IM 1
            b[26] = 5;                             // border cyan
            for (let i = 0; i < 6912; i++) b[27 + i] = i & 0xFF;   // a screen
            return b;
        }

        function tapBlock(bytes) {                 // length word + flag/data + xor
            const out = new Uint8Array(2 + bytes.length + 1);
            out[0] = (bytes.length + 1) & 0xFF;
            out[1] = (bytes.length + 1) >> 8;
            out.set(bytes, 2);
            let x = 0;
            for (const v of bytes) x ^= v;
            out[out.length - 1] = x;
            return out;
        }

        function makeTAP() {
            const header = new Uint8Array(18);
            header[0] = 0x00;                      // flag: header
            header[1] = 0x03;                      // type: CODE
            const name = 'TESTCODE  ';
            for (let i = 0; i < 10; i++) header[2 + i] = name.charCodeAt(i);
            header[12] = 0x10; header[13] = 0x00;  // length 16
            header[14] = 0x00; header[15] = 0x80;  // start $8000
            const data = new Uint8Array(17);
            data[0] = 0xFF;                        // flag: data
            for (let i = 0; i < 16; i++) data[1 + i] = 0xC9;
            const h = tapBlock(header), dd = tapBlock(data);
            const tap = new Uint8Array(h.length + dd.length);
            tap.set(h, 0); tap.set(dd, h.length);
            return tap;
        }

        // buildTRD works out `sectors` itself; buildSCL wants it (and length /
        // startAddress) spelled out, so the fixture carries both shapes.
        const trdFiles = [
            { name: 'HELLO', ext: 'C', data: new Uint8Array(256).fill(0xC9),
              start: 32768, startAddress: 32768, length: 256, sectors: 1 },
            { name: 'SECOND', ext: 'C', data: new Uint8Array(512).fill(0x00),
              start: 40000, startAddress: 40000, length: 512, sectors: 2 },
        ];


        // ---- UDI fixtures --------------------------------------------------
        // A UDI holds raw track bytes, so the fixture has to go the other way from
        // every other one here: a TRD is encoded INTO MFM track bytes -- 12 sync
        // zeros, three 0xA1 with their clock bits set, the address mark, the payload
        // and a real CRC-16, separated by 0x4E gaps, the layout a formatter writes.
        // The assert is then a round trip through the Explorer: whatever the
        // catalogue shows has to be what went in. The format's own two sharp edges
        // (the file checksum is not a standard CRC-32, and the clock bitmap is
        // LSB-first) are pinned against five real images in udi-test; these sections
        // are about the Explorer path, not about the format.
        function mfmTrack(sectors) {
            const bytes = [], clocked = [];
            const put = (v, clock = false) => { bytes.push(v); clocked.push(clock); };
            const run = (n, v) => { for (let i = 0; i < n; i++) put(v); };
            // Only the three 0xA1 carry a clock bit, which is what the sample images
            // do; the 0xFE/0xFB after them reads as a mark without one.
            const sync = () => { run(12, 0x00); for (let i = 0; i < 3; i++) put(0xA1, true); };

            run(80, 0x4E);                                  // gap 4a
            for (const s of sectors) {
                sync();
                put(0xFE);
                put(s.cyl); put(s.head); put(s.sec); put(s.sizeCode);
                const idCrc = crcFdc(new Uint8Array([0xA1, 0xA1, 0xA1, 0xFE, s.cyl, s.head, s.sec, s.sizeCode]));
                put(idCrc >> 8); put(idCrc & 0xFF);
                run(22, 0x4E);                              // gap 2
                sync();
                const mark = s.deleted ? 0xF8 : 0xFB;
                put(mark);
                for (const v of s.data) put(v);
                const covered = new Uint8Array(4 + s.data.length);
                covered.set([0xA1, 0xA1, 0xA1, mark], 0);
                covered.set(s.data, 4);
                const dataCrc = crcFdc(covered);
                put(dataCrc >> 8); put(dataCrc & 0xFF);
                run(54, 0x4E);                              // gap 3
            }

            const data = new Uint8Array(bytes);
            const clock = new Uint8Array((data.length >> 3) + ((data.length & 7) ? 1 : 0));
            for (let i = 0; i < clocked.length; i++) if (clocked[i]) clock[i >> 3] |= 1 << (i & 7);
            return { data, clock };
        }

        // Wrap a 16x256 TRD as a UDI. `extras` appends sectors a TRD cannot express
        // to the LAST track (free space, so the catalogue is untouched) and
        // `breakCrc` leaves a stale file checksum -- both are things two of the five
        // real sample images actually do.
        function makeUDI(trd, { extras = [], breakCrc = false } = {}) {
            const sides = 2, spt = 16, ssize = 256;
            const logical = trd.length / (spt * ssize);
            const cylinders = logical / sides;

            const records = [];
            for (let idx = 0; idx < logical; idx++) {
                const cyl = Math.floor(idx / sides), head = idx % sides;
                const secs = [];
                for (let s = 1; s <= spt; s++) {
                    const off = (idx * spt + s - 1) * ssize;
                    secs.push({ cyl, head, sec: s, sizeCode: 1, data: trd.subarray(off, off + ssize) });
                }
                if (idx === logical - 1) for (const e of extras) secs.push({ cyl, head, ...e });
                records.push(mfmTrack(secs));
            }

            let total = 16;                                  // header, no extension
            for (const r of records) total += 3 + r.data.length + r.clock.length;
            const b = new Uint8Array(total + 4);
            b.set([0x55, 0x44, 0x49, 0x21], 0);              // 'UDI!'
            b[4] = total & 0xFF; b[5] = (total >> 8) & 0xFF;
            b[6] = (total >> 16) & 0xFF; b[7] = (total >>> 24) & 0xFF;
            b[8] = 0;                                        // v1.0
            b[9] = cylinders - 1; b[10] = sides - 1;
            let p = 16;
            for (const r of records) {
                b[p] = 0x00;                                 // MFM, no MF/weak maps
                b[p + 1] = r.data.length & 0xFF; b[p + 2] = r.data.length >> 8;
                b.set(r.data, p + 3);
                b.set(r.clock, p + 3 + r.data.length);
                p += 3 + r.data.length + r.clock.length;
            }
            const crc = (crcUdi(b, total) ^ (breakCrc ? 0xFF : 0)) >>> 0;
            b[total] = crc & 0xFF; b[total + 1] = (crc >> 8) & 0xFF;
            b[total + 2] = (crc >> 16) & 0xFF; b[total + 3] = (crc >>> 24) & 0xFF;
            return b;
        }

        async function loadIntoExplorer(bytes, filename) {
            const input = d.getElementById('explorerFileInput');
            const dt = new w.DataTransfer();
            dt.items.add(new w.File([bytes], filename));
            input.files = dt.files;
            input.dispatchEvent(new w.Event('change', { bubbles: true }));
            // wait until the panel reports the file we just gave it
            await until(() => (d.getElementById('explorerFileName').textContent || '').includes(filename));
            await wait(150);
            return d.getElementById('explorerInfoOutput').textContent || '';
        }

        // One throwing section must not abort the rest of the suite
        async function part(name, fn) {
            section(name);
            try { await fn(); }
            catch (e) { assert(false, name + ' threw', e && e.message); }
        }

        const clickTab = (label) => {
            const b = [...d.querySelectorAll('button')]
                .find(x => new RegExp('^\\s*' + label + '\\s*$', 'i').test(x.textContent || ''));
            if (b) b.click();
            return !!b;
        };

        // ---- run -----------------------------------------------------------
        (async () => {
            section('App and Explorer come up');
            const ok = await until(() => frame.contentWindow && frame.contentWindow.spectrum);
            assert(!!ok, 'emulator boots in the iframe');
            if (!ok) { log('\n=== ABORTED ===', 'fail'); return; }
            w = frame.contentWindow; d = frame.contentDocument;
            const errors = [];
            w.addEventListener('error', e => errors.push(e.message), true);

            assert(clickTab('Utils') || true, 'Utils tab clicked (Explorer lives there)');
            await wait(200);
            clickTab('Explorer');
            await wait(200);
            assert(!!d.getElementById('explorerFileInput'), 'Explorer file input exists');

            await part('Snapshot: info panel and registers', async () => {
                const info = await loadIntoExplorer(makeSNA(), 'probe.sna');
                assert(/SNA|Snapshot|48K/i.test(info), 'SNA info panel renders', info.slice(0, 60));
                assert(/SP|PC|IM/i.test(info), 'register table is shown');
                assert(/49179|48K|Border/i.test(info), 'snapshot details are shown');
            });

            await part('Tape: TAP catalogue', async () => {
                const info = await loadIntoExplorer(makeTAP(), 'probe.tap');
                assert(/TAP|Tape|Block/i.test(info), 'TAP info panel renders', info.slice(0, 60));
                assert(/TESTCODE/.test(info), 'the tape header name is listed', info.slice(0, 120));
                assert(/8000|32768/i.test(info), 'the CODE start address is shown');
            });

            await part('Disk: TRD catalogue', async () => {
                const trd = TRDLoader.buildTRD(trdFiles, 'PROBE');
                const info = await loadIntoExplorer(trd, 'probe.trd');
                assert(/TR-?DOS|Disk/i.test(info), 'TRD info panel renders', info.slice(0, 60));
                assert(/HELLO/.test(info), 'first file is listed');
                assert(/SECOND/.test(info), 'second file is listed');
                assert(/PROBE/.test(info), 'the disk label is shown');
            });

            await part('Disk: SCL catalogue', async () => {
                const scl = SCLLoader.buildSCL(trdFiles);
                const info = await loadIntoExplorer(scl, 'probe.scl');
                assert(/SCL|Disk|TR-?DOS/i.test(info), 'SCL info panel renders', info.slice(0, 60));
                assert(/HELLO/.test(info), 'SCL files are listed');
            });

            // The Explorer has its own extension-driven dispatch, separate from
            // SnapshotLoader.detectType, so teaching the emulator about UDI left the
            // Explorer showing nothing but a hex dump. A readable UDI reports itself
            // as a TRD -- the flattened sector image IS what the views index -- with
            // the facts a sector image cannot carry in a section of their own.
            await part('Disk: UDI catalogue', async () => {
                const trd = TRDLoader.buildTRD(trdFiles, 'PROBE');
                const info = await loadIntoExplorer(makeUDI(trd), 'probe.udi');
                assert(/UDI Disk Image/.test(info), 'the UDI info section renders', info.slice(0, 120));
                assert(/HELLO/.test(info), 'the catalogue is read through the flattening');
                assert(/SECOND/.test(info), 'and so is the second file');
                assert(/PROBE/.test(info), 'the disk label survives the round trip');
                assert(/80 cylinders \u00d7 2 sides/.test(info), 'the geometry is reported',
                       info.slice(0, 300));
                assert(/160 records/.test(info), 'and the track record count');
                assert(/2,?560 placed/.test(info), 'every sector was placed', info.slice(0, 400));
                assert(/matches/.test(info), 'the file checksum verifies', info.slice(0, 400));
                // The flattened image is not a file that was ever on disk, and saying
                // "TRD Disk Image" over it would claim it was.
                assert(/Flattened Sector Image/.test(info), 'the sector section says it is flattened');
                assert(!/Dropped|Kept, mark lost/.test(info), 'and nothing is reported lost');

                // The catalogue alone cannot see this: it is read from the flattened
                // bytes either way. But if the raw UDI stayed as the file's data, the
                // hex dump, the Disk Map and file extraction would all be addressing
                // track bytes with sector-image offsets. So the two sizes on screen
                // have to differ -- the file as it is on disk, and the image the views
                // index -- and the second has to be the 640K one.
                assert(/655360 bytes/.test(info), 'the flattened image is what the views index',
                       info.slice(0, 400));
                assert(/File\s*[\d,]{9,} bytes/.test(info), 'while the UDI section reports the real file size',
                       info.slice(0, 200));
            });

            // Two of five real images disagree with their own stored checksum, so
            // refusing on a mismatch (which Fuse does) refuses real disks.
            await part('Disk: a UDI with a stale checksum still loads', async () => {
                const trd = TRDLoader.buildTRD(trdFiles, 'PROBE');
                const info = await loadIntoExplorer(makeUDI(trd, { breakCrc: true }), 'stale.udi');
                assert(/mismatch/.test(info), 'the mismatch is reported', info.slice(0, 400));
                assert(/loaded anyway/.test(info), 'and so is the decision not to refuse it');
                assert(/HELLO/.test(info), 'the catalogue is read regardless');
            });

            // Flattening to a TRD is lossy, and the loss is what protection is made
            // of -- so it is itemised, and the two kinds are kept apart: a sector a
            // TRD has no room for is absent from the image, while a deleted-data mark
            // is a sector that IS there with the fact about it gone.
            await part('Disk: a UDI says what the flattening could not carry', async () => {
                const trd = TRDLoader.buildTRD(trdFiles, 'PROBE');
                const extras = [
                    { sec: 17, sizeCode: 1, data: new Uint8Array(256).fill(0xAA) },
                    { sec: 3, sizeCode: 2, data: new Uint8Array(512).fill(0xBB) },
                    { sec: 1, sizeCode: 1, data: new Uint8Array(256).fill(0xCC), deleted: true },
                ];
                const info = await loadIntoExplorer(makeUDI(trd, { extras }), 'odd.udi');
                assert(/Dropped/.test(info), 'a Dropped row appears', info.slice(0, 500));
                assert(/1 not 256 bytes/.test(info), 'the 512-byte sector is counted', info.slice(0, 500));
                assert(/1 numbered outside/.test(info), 'and the one numbered 17');
                assert(/Kept, mark lost/.test(info), 'the kept-but-flattened row appears');
                assert(/1 deleted-data/.test(info), 'and the deleted-data mark is counted');
                assert(/HELLO/.test(info), 'the catalogue is still read');
            });

            await part('Disk: UDI drives the Disk Map and the editor', async () => {
                const trd = TRDLoader.buildTRD(trdFiles, 'PROBE');
                await loadIntoExplorer(makeUDI(trd), 'probe.udi');
                const tab = [...d.querySelectorAll('.explorer-subtab')]
                    .find(b => /disk map/i.test(b.textContent || ''));
                if (tab) {
                    tab.click();
                    await wait(300);
                    const grid = d.getElementById('diskmapGridContainer');
                    const canvas = d.getElementById('diskmapCanvas');
                    assert((grid && grid.children.length > 0) || (canvas && canvas.width > 0),
                           'the Disk Map draws a UDI', `grid=${grid ? grid.children.length : 'n/a'}`);
                    const status = (d.getElementById('diskmapStatus') || {}).textContent || '';
                    assert(/80 cyl/.test(status), 'with the geometry in its status line', status);
                }
                const first = d.querySelector('.explorer-subtab');
                if (first) { first.click(); await wait(150); }

                // There is no UDI writer, and one cannot be made from a sector image
                // anyway, so the panel is a TRD editor over the flattened bytes.
                clickTab('Edit');
                const listed = await until(() => {
                    const t = (d.getElementById('editorPanels') || {}).textContent || '';
                    return /HELLO/.test(t) ? t : null;
                });
                assert(!!listed, 'the editor panel lists a UDI catalogue',
                       ((d.getElementById('editorPanels') || {}).textContent || '').slice(0, 80));
                assert(/free/.test(listed || ''), 'and states its free space like any disk');
                const infoTab = d.querySelector('.explorer-subtab[data-subtab="info"]');
                if (infoTab) { infoTab.click(); await wait(150); }
            });

            // A lowercase 'udi!' was reserved for a whole-file compressed variant
            // that no spec revision ever defined, so it is refused by name rather
            // than read as if the header were uncompressed.
            await part('Disk: an unreadable UDI says so', async () => {
                const bad = makeUDI(TRDLoader.buildTRD(trdFiles, 'PROBE'));
                bad.set([0x75, 0x64, 0x69, 0x21], 0);        // 'udi!'
                const info = await loadIntoExplorer(bad, 'lower.udi');
                assert(/UDI Disk Image/.test(info), 'the UDI panel still renders', info.slice(0, 120));
                assert(/Error/.test(info), 'with an error rather than an empty catalogue', info.slice(0, 200));
                assert(/compressed/.test(info), 'naming what it refused', info.slice(0, 200));
            });

            // A BASIC file's autostart line is not in the catalogue: TR-DOS writes
            // $80 $AA and the line after the program. Reading it once threw a
            // ReferenceError that took the whole TRD/SCL info panel down.
            await part('Disk: BASIC autostart line', async () => {
                const prog = new Uint8Array(24);
                prog.set([0x80, 0xAA, 0x0A, 0x00], 20);
                const basic = [{ name: 'boot', ext: 'B', data: prog,
                                 length: 20, programLength: 20, sectors: 1 }];
                const trdInfo = await loadIntoExplorer(TRDLoader.buildTRD(basic, 'PROBE'), 'basic.trd');
                assert(/boot/.test(trdInfo), 'TRD with a BASIC file renders', trdInfo.slice(0, 80));
                assert(/LINE 10/.test(trdInfo), 'TRD shows the BASIC autostart line', trdInfo.slice(0, 200));
                const sclInfo = await loadIntoExplorer(SCLLoader.buildSCL(basic), 'basic.scl');
                assert(/LINE 10/.test(sclInfo), 'SCL shows the BASIC autostart line', sclInfo.slice(0, 200));
            });

            await part('Hex and text views', async () => {
                await loadIntoExplorer(makeSNA(), 'probe.sna');
                const hexBtn = d.getElementById('btnExplorerHex');
                if (hexBtn) {
                    hexBtn.click();
                    const hex = await until(() => {
                        const t = d.getElementById('explorerHexOutput').textContent || '';
                        return t.length > 40 ? t : null;
                    });
                    assert(!!hex, 'hex dump renders');
                    assert(/[0-9A-F]{2}\s+[0-9A-F]{2}/i.test(hex || ''), 'hex dump shows byte pairs',
                           (hex || '').slice(0, 50));
                } else {
                    assert(false, 'hex button exists');
                }
            });

            await part('Addresses and offsets follow the hex/decimal switch', async () => {
                // The Explorer shows two kinds of number: a file's load address and a
                // position INSIDE the file. Both follow Settings -> Display, because an
                // offset column left in hex beside a decimal load address reads as a bug.
                const decBox = d.getElementById('chkDecAddresses');
                const setBase = async (dec) => {
                    decBox.checked = dec;
                    decBox.dispatchEvent(new w.Event('change'));
                    await wait(250);
                };
                const firstAddr = () => {
                    const t = d.getElementById('explorerHexOutput').textContent || '';
                    return (t.trim().split(/\s+/)[0] || '');
                };
                const bytesOf = () => {
                    const t = d.getElementById('explorerHexOutput').textContent || '';
                    return t.trim().split(/\s+/).slice(1, 4).join(' ');
                };

                await setBase(false);
                await loadIntoExplorer(makeSNA(), 'probe.sna');
                d.getElementById('btnExplorerHex')?.click();
                await until(() => (d.getElementById('explorerHexOutput').textContent || '').length > 40);
                const hexAddr = firstAddr();
                const hexBytes = bytesOf();
                assert(/^[0-9A-F]{4}$/.test(hexAddr), 'in hex the offset column is four hex digits',
                       hexAddr);

                await setBase(true);
                const decAddr = firstAddr();
                assert(/^[0-9]+$/.test(decAddr) && Number(decAddr) === parseInt(hexAddr, 16),
                       'in decimal it is the same offset written in decimal',
                       `${hexAddr} -> ${decAddr}`);
                assert(bytesOf() === hexBytes,
                       'and the byte column does NOT move -- bytes have their own switch',
                       `${hexBytes} -> ${bytesOf()}`);

                const box = d.getElementById('explorerHexAddr');
                assert(/^[0-9]+$/.test(box.value),
                       'the address box converted rather than keeping its digits', box.value);
                assert(/decimal/.test(box.title), 'and its tooltip says so', box.title);

                const trd = TRDLoader.buildTRD(trdFiles, 'PROBE');
                const infoDec = await loadIntoExplorer(trd, 'probe.trd');
                assert(/32768/.test(infoDec) && !/\$8000/.test(infoDec),
                       'a load address is decimal, without the hex twin beside it',
                       (infoDec.match(/.{0,30}32768.{0,20}/) || [''])[0]);

                // No reload here: loading the same filename twice makes the wait
                // condition true before the new render, which is a race. The panel
                // redraws itself on the switch, so just throw it and read again.
                await setBase(false);
                const infoHex = d.getElementById('explorerInfoOutput').textContent || '';
                assert(/\$8000/.test(infoHex), 'and in hex the pair comes back',
                       JSON.stringify(infoHex.slice(Math.max(0, infoHex.indexOf('32768') - 60),
                                                     infoHex.indexOf('32768') + 60)));

                // The tape block list is its own renderer, so it gets its own check:
                // a TAP CODE header's start address is the number a user reads most
                // often in this panel.
                await setBase(true);
                const tapDec = await loadIntoExplorer(makeTAP(), 'probe.tap');
                assert(/Start address:\s*32768/.test(tapDec) && !/\$8000/.test(tapDec),
                       'a TAP header start address is decimal too',
                       (tapDec.match(/Start address:.{0,12}/) || [''])[0]);
                await setBase(false);
                const tapHex = d.getElementById('explorerInfoOutput').textContent || '';
                assert(/Start address:\s*\$8000/.test(tapHex), 'and hex brings the sigil back',
                       (tapHex.match(/Start address:.{0,12}/) || [''])[0]);
            });

            await part('Switching files clears the previous one', async () => {
                const trd = TRDLoader.buildTRD(trdFiles, 'PROBE');
                await loadIntoExplorer(trd, 'probe.trd');
                const info = await loadIntoExplorer(makeTAP(), 'probe.tap');
                assert(!/HELLO/.test(info), 'the TRD catalogue is gone after loading a TAP',
                       info.slice(0, 80));
                assert(/TESTCODE/.test(info), 'the TAP catalogue replaced it');
            });

            await part('Disk Map renders a loaded disk', async () => {
                // The Disk Map is the largest untested part of the Explorer; these
                // asserts are the safety net for splitting it out.
                const trd = TRDLoader.buildTRD(trdFiles, 'PROBE');
                await loadIntoExplorer(trd, 'probe.trd');
                const tab = [...d.querySelectorAll('.explorer-subtab')]
                    .find(b => /disk map/i.test(b.textContent || ''));
                assert(!!tab, 'the Disk Map sub-tab exists');
                if (!tab) return;
                tab.click();
                await wait(300);

                const panel = d.getElementById('explorer-diskmap');
                assert(panel && panel.style.display !== 'none', 'the panel is shown');

                const grid = d.getElementById('diskmapGridContainer');
                const canvas = d.getElementById('diskmapCanvas');
                assert(!!(grid || canvas), 'it has a grid or canvas view');
                const painted = (grid && grid.children.length > 0) ||
                                (canvas && canvas.width > 0);
                assert(painted, 'and it drew something for the loaded disk',
                       `grid=${grid ? grid.children.length : 'n/a'} canvas=${canvas ? canvas.width : 'n/a'}`);

                const info = d.getElementById('diskmapInfo');
                const legend = d.getElementById('diskmapLegend');
                assert(!!(info || legend), 'the info/legend area exists');

                // switch the view mode; it must not throw or blank the panel
                const diskBtn = [...d.querySelectorAll('.diskmap-view-btn')]
                    .find(b => /disk/i.test(b.textContent || ''));
                if (diskBtn) {
                    diskBtn.click();
                    await wait(250);
                    assert(panel.style.display !== 'none', 'switching to the disk view keeps the panel up');
                }

                // back to the file list for the sections that follow
                const first = d.querySelector('.explorer-subtab');
                if (first) { first.click(); await wait(150); }
            });

            await part('Edit tab: the per-format editors render', async () => {
                // Covers ui/explorer-editors.js — the disk/tape editors, which the
                // info-panel checks above never touch.
                clickTab('Edit');
                await wait(250);
                const left = d.getElementById('editorPanelLeft');
                assert(!!left, 'the dual-panel editor exists');

                const trd = TRDLoader.buildTRD(trdFiles, 'PROBE');
                await loadIntoExplorer(trd, 'probe.trd');
                clickTab('Edit');
                const listed = await until(() => {
                    const t = (d.getElementById('editorPanels') || {}).textContent || '';
                    return /HELLO/.test(t) ? t : null;
                });
                assert(!!listed, 'a TRD catalogue is listed in the editor panel',
                       ((d.getElementById('editorPanels') || {}).textContent || '').slice(0, 80));
                assert(/SECOND/.test(listed || ''), 'every file is listed');
                assert(/PROBE/.test(listed || ''), 'the disk label strip is shown');

                const toolbar = d.getElementById('editorSharedToolbar');
                assert(!!toolbar && !toolbar.classList.contains('hidden'),
                       'the editor toolbar is available for a disk image');
            });

            await part('Edit: TRD BASIC autostart LINE', async () => {
                // The box a BASIC row opens is its LINE, written into the $80 $AA
                // trailer after the program -- not the Addr box a CODE row gets.
                const prog = new Uint8Array(24);
                prog.set([0x80, 0xAA, 0x0A, 0x00], 20);
                const basic = [{ name: 'boot', ext: 'B', data: prog, length: 20, programLength: 20, sectors: 1 },
                               trdFiles[0]];
                clickTab('Edit');
                await wait(250);
                await loadIntoExplorer(TRDLoader.buildTRD(basic, 'PROBE'), 'line.trd');
                clickTab('Edit');
                const rowOf = (name) => [...d.querySelectorAll('#editorPanels .disk-row')]
                    .find(r => (r.querySelector('.file-name') || {}).textContent === name);
                const openRow = async (name) => {
                    (await until(() => rowOf(name))).click();
                    rowOf(name).click();   // re-found: the first click may re-render the list
                    return await until(() => d.querySelector('#editorPanels .editor-inline-edit'));
                };
                const lineOf = (name) => ((rowOf(name) || d).querySelector('.file-addr') || {}).textContent;
                const status = () => [...d.querySelectorAll('#editorPanels *')]
                    .map(e => e.textContent).join(' ');

                let edit = await openRow('boot');
                const box = edit && edit.querySelector('[data-field="line"]');
                assert(!!box, 'a BASIC row opens a LINE box');
                assert(!!box && box.value === '10', 'holding the current line', box && box.value);
                assert(!edit.querySelector('[data-field="addr"]'), 'and no Addr box');

                box.value = '99999';
                edit.querySelector('[data-action="disk-apply"]').click();
                await wait(100);
                assert(/LINE must be/.test(status()), 'a line past 9999 is refused');
                assert(lineOf('boot') === 'LINE 10', 'and the old line stays', lineOf('boot'));

                box.value = '250';
                edit.querySelector('[data-action="disk-apply"]').click();
                await wait(150);
                assert(lineOf('boot') === 'LINE 250', 'Apply writes the new line', lineOf('boot'));

                edit = await openRow('boot');
                edit.querySelector('[data-field="line"]').value = '';
                edit.querySelector('[data-action="disk-apply"]').click();
                await wait(150);
                assert(lineOf('boot') === '', 'an empty box clears it', lineOf('boot'));

                edit = await openRow('HELLO');
                assert(!!edit.querySelector('[data-field="addr"]') && !edit.querySelector('[data-field="line"]'),
                       'a CODE row still opens an Addr box');
            });

            await part('Hex Dump: Find, including the encoded ladder', async () => {
                // The Explorer had no find at all before this. Encoded is the mode
                // that matters: game text is very often not stored as text, and a
                // plaintext search says the same "nothing" either way.
                const size = 0x1000;
                const raw = new Uint8Array(size);
                for (let i = 0; i < size; i++) raw[i] = (i * 7) & 0xff;
                const plant = (off, text, enc) => Array.from(text).forEach(
                    (ch, i) => { raw[off + i] = enc(ch.charCodeAt(0), i) & 0xff; });
                plant(0x100, 'TREASURE', c => c);              // plain
                plant(0x200, 'TREASURE', c => c ^ 0xff);       // complemented
                plant(0x300, 'TREASURE', (c, i) => c - 0x3b - i);  // c - (key + i)
                plant(0x400, 'TREAS', c => c);                 // five characters only
                await loadIntoExplorer(raw, 'probe.bin');

                clickTab('Hex Dump');
                await wait(200);
                const input = d.getElementById('explorerFindText');
                const mode = d.getElementById('explorerFindMode');
                const results = d.getElementById('explorerFindResults');
                const status = d.getElementById('explorerFindStatus');
                assert(!!input && !!mode && !!results, 'the Find row exists in the Hex Dump tab');
                if (!input) return;

                const find = async (text, m, five = false) => {
                    mode.value = m;
                    d.getElementById('chkExplorerFind5ch').checked = five;
                    input.value = text;
                    d.getElementById('btnExplorerFind').click();
                    await wait(250);
                    return [...results.querySelectorAll('.explorer-find-hit')]
                        .map(h => parseInt(h.dataset.off, 10));
                };

                let hits = await find('TREASURE', 'text');
                assert(hits.includes(0x100), 'Text finds the plaintext copy', hits.join(','));
                assert(!hits.includes(0x200), 'and not the complemented one');

                hits = await find('TREASURE', 'encoded');
                assert(hits.includes(0x100) && hits.includes(0x200) && hits.includes(0x300),
                       'Encoded finds all three', hits.map(h => h.toString(16)).join(','));
                const labels = [...results.querySelectorAll('.explorer-find-hit .he')]
                    .map(e => e.textContent).join(' | ');
                assert(/complement/i.test(labels), 'and names the scheme each was wearing', labels);

                hits = await find('TREASURE', 'encoded', true);
                assert(hits.includes(0x400), 'five-character matching finds a truncated word',
                       hits.map(h => h.toString(16)).join(','));

                hits = await find('43 4E', 'hex');
                assert(Array.isArray(hits), 'Hex mode runs');
                await find('ZZ', 'hex');
                assert(/not hex/i.test(status.textContent), 'and rejects what is not hex',
                       status.textContent);

                await find('QQZZXX', 'text');
                assert(/not found/i.test(status.textContent), 'a word that is absent says so',
                       status.textContent);
                await find('QQZZXX', 'encoded');
                assert(/any of the encodings/i.test(status.textContent),
                       'and the encoded search says which "nothing" it means',
                       status.textContent);

                // A hit is a way into the dump, not a dead end
                await find('TREASURE', 'encoded');
                const row = results.querySelector('.explorer-find-hit[data-off="768"]');  // $300
                if (row) {
                    row.click();
                    await wait(200);
                    assert(d.getElementById('explorerHexAddr').value.toUpperCase() === '0300',
                           'clicking a hit scrolls the dump to it',
                           d.getElementById('explorerHexAddr').value);
                }
            });

            await part('Edit: a disk panel always states its free space', async () => {
                // "0 files" said nothing about how much the disk holds, and a copy
                // then overwrote the summary with "Copied N" -- so a disk that had
                // just been filled was the one case where the figure was missing,
                // until something else happened to redraw the panel.
                const sel = d.getElementById('editorNewFormat');
                const statusOf = (side) =>
                    (d.querySelector(`#editorPanel${side} .editor-panel-status`) || {}).textContent || '';
                // a panel is activated on mousedown, not click
                const activate = (side) => d.querySelector(`#editorPanel${side} .editor-panel-header`)
                    .dispatchEvent(new w.MouseEvent('mousedown', { bubbles: true }));
                const makeNew = async (side, fmt) => {
                    activate(side);
                    await wait(100);
                    sel.value = fmt;
                    sel.dispatchEvent(new w.Event('change', { bubbles: true }));
                    await wait(250);
                };

                clickTab('Edit');
                await wait(250);
                for (const [fmt, total] of [['trd', 2544], ['mgt', 1560]]) {
                    await makeNew('Left', fmt);
                    assert(statusOf('Left') === `0 files \u2014 ${total} free`,
                           `a new empty ${fmt.toUpperCase()} states its free sectors`,
                           statusOf('Left'));
                }
                for (const fmt of ['mdr', 'opd', 'd40']) {
                    // these three take their capacity from the image they make,
                    // so the figure is checked for rather than spelled out
                    await makeNew('Left', fmt);
                    assert(/^0 files|\d+ free/.test(statusOf('Left')) &&
                           /\d+ free/.test(statusOf('Left')),
                           `and so does a new ${fmt.toUpperCase()}`, statusOf('Left'));
                }

                await loadIntoExplorer(TRDLoader.buildTRD(trdFiles, 'PROBE'), 'free.trd');
                clickTab('Edit');
                await wait(250);
                await makeNew('Right', 'trd');
                const empty = statusOf('Right');
                activate('Left');
                await wait(100);
                const srcRow = await until(() => d.querySelector('#editorPanelLeft .disk-row'));
                assert(!!srcRow, 'the source disk lists a file to copy');
                if (srcRow) srcRow.click();
                await wait(200);
                const copyBtn = d.getElementById('btnEditorCopy');
                assert(!!copyBtn && !copyBtn.disabled, 'Copy is offered for it');
                copyBtn.click();
                await wait(300);
                assert(/free/.test(statusOf('Right')),
                       'the destination still says how much room is left after a copy',
                       statusOf('Right'));
                assert(/Copied 1/.test(statusOf('Right')),
                       'and still reports what the copy did', statusOf('Right'));
                assert(empty !== statusOf('Right'), 'with the figure brought up to date',
                       `${empty} -> ${statusOf('Right')}`);
            });

            await part('Edit: copying an OPD file copies all of it', async () => {
                // The normal shape of an Opus game is a short BASIC loader whose
                // header declares a few thousand bytes with the game glued after
                // it, filling hundreds of sectors. The Explorer took the header
                // at its word twice over — once when it read the disk into its
                // model and again when it handed a file to the other panel — so
                // a 532-sector file arrived as 19 sectors and the game was gone.
                const { OPDLoader } = await import('../core/loaders.js');
                const payload = new Uint8Array(3000);
                for (let i = 0; i < payload.length; i++) payload[i] = (i * 31 + 7) & 0xFF;
                let img = OPDLoader.buildOPD(
                    [{ name: 'MONO', type: 0, data: payload, autostart: 10 }], 'SRC', 1);
                // Make it a monoloader: say 100 bytes in the header, keep the sectors
                const built = OPDLoader.listFiles(img)[0];
                img[built.dataOffset + 1] = 100;
                img[built.dataOffset + 2] = 0;
                const src = OPDLoader.listFiles(img)[0];
                assert(src.length === 100 && src.sectors === 12,
                       'the fixture declares 100 bytes and occupies 12 sectors',
                       src.length + ' bytes / ' + src.sectors + ' sectors');

                const statusOf = (side) =>
                    (d.querySelector(`#editorPanel${side} .editor-panel-status`) || {}).textContent || '';
                const activate = (side) => d.querySelector(`#editorPanel${side} .editor-panel-header`)
                    .dispatchEvent(new w.MouseEvent('mousedown', { bubbles: true }));

                await loadIntoExplorer(img, 'mono.opd');
                clickTab('Edit');
                await wait(250);
                activate('Right');
                await wait(100);
                const sel = d.getElementById('editorNewFormat');
                sel.value = 'opd';
                sel.dispatchEvent(new w.Event('change', { bubbles: true }));
                await wait(250);
                activate('Left');
                await wait(100);
                const row = await until(() => d.querySelector('#editorPanelLeft .disk-row'));
                assert(!!row, 'the Opus disk lists its file');
                const srcText = row ? row.textContent : '';
                if (row) row.click();
                await wait(200);
                d.getElementById('btnEditorCopy').click();
                await wait(300);

                // The copy should be indistinguishable from the original, which
                // is also what the user sees: name, type, bytes and SECTORS. The
                // 12 used to arrive as 1 — the sectors the header's 100 bytes fit
                // in — and the rest of the file was gone.
                const dstRow = d.querySelector('#editorPanelRight .disk-row');
                assert(!!dstRow && dstRow.textContent === srcText,
                       'the copy lists exactly as the original did, sectors and all',
                       'was "' + srcText + '", now "' + (dstRow && dstRow.textContent) + '"');

                // The bytes, not just the row: save the destination and read it back
                const origCreate = w.URL.createObjectURL;
                const origClick = w.HTMLAnchorElement.prototype.click;
                let blob = null;
                w.URL.createObjectURL = (b) => { blob = b; return 'blob:stub'; };
                w.HTMLAnchorElement.prototype.click = function () {};
                try {
                    activate('Right');
                    await wait(100);
                    d.getElementById('btnEditorSave').click();
                    await until(() => blob, 80, 25);
                } finally {
                    w.URL.createObjectURL = origCreate;
                    w.HTMLAnchorElement.prototype.click = origClick;
                }
                assert(!!blob, 'the copy saves back out');
                if (blob) {
                    const out = new Uint8Array(await blob.arrayBuffer());
                    const copied = OPDLoader.listFiles(out)[0];
                    assert(!!copied && copied.sectors === src.sectors,
                           'the written disk gives the file the same sectors it had',
                           copied && copied.sectors);
                    assert(!!copied && copied.length === src.length,
                           'and leaves its declared length alone, so it still loads as a loader',
                           copied && copied.length);
                    const bytes = copied ? OPDLoader.extractFile(out, copied) : null;
                    const same = bytes && bytes.length >= payload.length &&
                                 payload.every((b, i) => bytes[i] === b);
                    assert(same, 'with every byte of the payload still there',
                           bytes ? bytes.length + ' bytes back' : 'nothing read back');
                }
            });

            await part('Edit: copying a Didaktik file copies all of it too', async () => {
                // MDOS records the bytes used in a file's final sector in the FAT
                // itself, so the exact end of the allocation is known without the
                // directory's length — the same split the Opus has, and the same
                // bug: the copy sliced to the directory and dropped the rest.
                const { DidaktikLoader } = await import('../core/loaders.js');
                const payload = new Uint8Array(2000);
                for (let i = 0; i < payload.length; i++) payload[i] = (i * 17 + 3) & 0xFF;
                let img = DidaktikLoader.createBlankD40('SRC');
                img = DidaktikLoader.addFile(img, {
                    name: 'MONO', type: 'P', data: payload, startAddr: 10, basicLength: 100,
                    declaredLength: 100
                });
                const src = DidaktikLoader.listFiles(img)[0];
                assert(!!src && src.length === 100,
                       'the fixture declares 100 bytes', src && src.length);
                const srcData = DidaktikLoader.extractFile(img, src);
                assert(!!srcData && srcData.length === payload.length,
                       'while the FAT says all 2000 are there', srcData && srcData.length);

                const activate = (side) => d.querySelector(`#editorPanel${side} .editor-panel-header`)
                    .dispatchEvent(new w.MouseEvent('mousedown', { bubbles: true }));
                // Load into the LEFT panel deliberately: a file lands in whichever
                // panel is active, and the part above leaves Right active — so
                // this quietly copied that part's Opus file instead.
                clickTab('Edit');
                await wait(150);
                activate('Left');
                await wait(100);
                await loadIntoExplorer(img, 'mono.d40');
                clickTab('Edit');
                await wait(250);
                const leftHdr = d.querySelector('#editorPanelLeft .editor-panel-header');
                assert(/d40|d80/i.test(leftHdr ? leftHdr.textContent : ''),
                       'the MDOS disk is the one in the left panel',
                       leftHdr && leftHdr.textContent.trim());
                activate('Right');
                await wait(100);
                const sel = d.getElementById('editorNewFormat');
                sel.value = 'd40';
                sel.dispatchEvent(new w.Event('change', { bubbles: true }));
                await wait(250);
                activate('Left');
                await wait(100);
                const row = await until(() => d.querySelector('#editorPanelLeft .disk-row'));
                assert(!!row, 'the MDOS disk lists its file');
                if (row) row.click();
                await wait(200);
                d.getElementById('btnEditorCopy').click();
                await wait(300);

                const origCreate = w.URL.createObjectURL;
                const origClick = w.HTMLAnchorElement.prototype.click;
                let blob = null;
                w.URL.createObjectURL = (b) => { blob = b; return 'blob:stub'; };
                w.HTMLAnchorElement.prototype.click = function () {};
                try {
                    activate('Right');
                    await wait(100);
                    d.getElementById('btnEditorSave').click();
                    await until(() => blob, 80, 25);
                } finally {
                    w.URL.createObjectURL = origCreate;
                    w.HTMLAnchorElement.prototype.click = origClick;
                }
                assert(!!blob, 'the copy saves back out');
                if (blob) {
                    const out = new Uint8Array(await blob.arrayBuffer());
                    const copied = DidaktikLoader.listFiles(out)[0];
                    assert(!!copied && copied.length === src.length,
                           'the copy keeps the declared length it was given',
                           copied && copied.length);
                    const bytes = copied ? DidaktikLoader.extractFile(out, copied) : null;
                    const same = bytes && bytes.length >= payload.length &&
                                 payload.every((b, i) => bytes[i] === b);
                    assert(same, 'and every byte past it', bytes ? bytes.length + ' bytes back' : 'nothing');
                }
            });

            // A crafted file must not be able to put MARKUP on the page. Every
            // one of these fields is rendered by building an HTML string and
            // assigning innerHTML, so an unescaped one is script execution in
            // this origin -- the TZX text and message blocks are 255 bytes
            // each, which is room enough for a working payload.
            await part('a crafted file cannot inject markup (XSS)', async () => {
                const tzxText = (id, text) => {
                    const t = [...text].map(c => c.charCodeAt(0));
                    const head = [...'ZXTape!'].map(c => c.charCodeAt(0)).concat([0x1A, 1, 20]);
                    return new Uint8Array(head.concat([id, t.length], t));
                };
                const payload = '<img src=x onerror="window.__xssRan=1">';
                w.__xssRan = undefined;

                // TZX 0x30, text description
                await loadIntoExplorer(tzxText(0x30, payload), 'xss-text.tzx');
                const panel = d.getElementById('explorerInfoOutput');
                assert(panel.querySelectorAll('img').length === 0,
                       'a TZX text block cannot add an <img>',
                       panel.querySelectorAll('img').length + ' found');
                assert(w.__xssRan === undefined, 'and its onerror never runs');
                assert((panel.textContent || '').includes('<img src=x'),
                       'the payload is shown as text, not parsed',
                       (panel.textContent || '').slice(0, 60));

                // TZX 0x31, message -- the same field a block further on
                await loadIntoExplorer(tzxText(0x31, '\x05' + payload), 'xss-msg.tzx');
                assert(d.getElementById('explorerInfoOutput').querySelectorAll('img').length === 0,
                       'nor can a TZX message block');

                // A TAP filename is only 10 bytes, too few for the payload
                // above -- but plenty for a tag, and a tag is the thing that
                // must not survive.
                const tap = makeTAP();
                const tagName = '<b>PWNED!';                  // exactly 10
                for (let i = 0; i < 10; i++) tap[3 + i] = tagName.charCodeAt(i);
                // the header checksum is the XOR of flag..length, recomputed
                let ck = 0;
                for (let i = 2; i < 2 + 18; i++) ck ^= tap[i];
                tap[2 + 18] = ck;
                await loadIntoExplorer(tap, 'xss-name.tap');
                const panel2 = d.getElementById('explorerInfoOutput');
                const injected = [...panel2.querySelectorAll('b')]
                    .filter(el => (el.textContent || '').includes('PWNED'));
                assert(injected.length === 0,
                       'a TAP filename cannot add a <b> either',
                       injected.length + ' injected');
                assert(w.__xssRan === undefined, 'and nothing ran at any point');
            });

            assert(errors.length === 0, 'no uncaught errors while driving the Explorer',
                   errors.slice(0, 3).join(' | '));

            log('\n=== COMPLETE ===', 'section');
        })();
    </script>
</body>
</html>
