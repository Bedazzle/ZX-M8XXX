<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Explorer Tests</title>
    <style>
        body { font-family: monospace; background: #1e1e2e; color: #cdd6f4; padding: 16px; }
        #summary { margin: 8px 0 16px; font-size: 15px; }
        .pass { color: #a6e3a1; }
        .fail { color: #f38ba8; }
        .section { color: #89b4fa; font-weight: bold; margin-top: 12px; }
        #log div { white-space: pre; }
        iframe { width: 1400px; height: 900px; border: 1px solid #444; margin-top: 16px; }
    </style>
</head>
<body>
    <h2>Explorer Tests</h2>
    <div id="summary">running…</div>
    <div id="log"></div>
    <iframe id="app" src="../index.html"></iframe>

    <script type="module">
        // The Explorer is a UI module built around the app's DOM (initExplorer wires
        // ~290 functions to elements in index.html), so it can't be unit-tested in
        // isolation - this drives the real thing in an iframe and reads the panels
        // back. Everything else about it was previously covered only by throwaway
        // probes, which is why splitting the file was risky.
        import { TRDLoader, SCLLoader } from '../core/loaders.js';

        const TEST_VERSION = '0.1.0';
        const logEl = document.getElementById('log');
        const summaryEl = document.getElementById('summary');
        let passed = 0, failed = 0;

        function log(msg, cls = '') {
            const d = document.createElement('div');
            d.className = cls;
            d.textContent = msg;
            logEl.appendChild(d);
        }
        function section(name) { log('\n ' + name + ' ', 'section'); }
        function assert(cond, name, detail = '') {
            if (cond) { passed++; log('  ' + name, 'pass'); }
            else { failed++; log('  ' + name + (detail ? ': ' + detail : ''), 'fail'); }
            summaryEl.innerHTML = `v${TEST_VERSION} | <span class="pass">Pass: ${passed}</span> | ` +
                `<span class="fail">Fail: ${failed}</span> | Total: ${passed + failed}`;
        }

        const wait = (ms) => new Promise(r => setTimeout(r, ms));
        async function until(fn, tries = 200, gap = 25) {
            for (let i = 0; i < tries; i++) {
                try { const v = fn(); if (v) return v; } catch (e) { /* not ready */ }
                await wait(gap);
            }
            return null;
        }

        const frame = document.getElementById('app');
        let w, d;

        // ---- fixtures ------------------------------------------------------
        function makeSNA() {                       // 48K: 27-byte header + 48K RAM
            const b = new Uint8Array(27 + 49152);
            b[0] = 0x3F;                           // I
            b[23] = 0x00; b[24] = 0x40;            // SP = $4000
            b[25] = 1;                             // IM 1
            b[26] = 5;                             // border cyan
            for (let i = 0; i < 6912; i++) b[27 + i] = i & 0xFF;   // a screen
            return b;
        }

        function tapBlock(bytes) {                 // length word + flag/data + xor
            const out = new Uint8Array(2 + bytes.length + 1);
            out[0] = (bytes.length + 1) & 0xFF;
            out[1] = (bytes.length + 1) >> 8;
            out.set(bytes, 2);
            let x = 0;
            for (const v of bytes) x ^= v;
            out[out.length - 1] = x;
            return out;
        }

        function makeTAP() {
            const header = new Uint8Array(18);
            header[0] = 0x00;                      // flag: header
            header[1] = 0x03;                      // type: CODE
            const name = 'TESTCODE  ';
            for (let i = 0; i < 10; i++) header[2 + i] = name.charCodeAt(i);
            header[12] = 0x10; header[13] = 0x00;  // length 16
            header[14] = 0x00; header[15] = 0x80;  // start $8000
            const data = new Uint8Array(17);
            data[0] = 0xFF;                        // flag: data
            for (let i = 0; i < 16; i++) data[1 + i] = 0xC9;
            const h = tapBlock(header), dd = tapBlock(data);
            const tap = new Uint8Array(h.length + dd.length);
            tap.set(h, 0); tap.set(dd, h.length);
            return tap;
        }

        // buildTRD works out `sectors` itself; buildSCL wants it (and length /
        // startAddress) spelled out, so the fixture carries both shapes.
        const trdFiles = [
            { name: 'HELLO', ext: 'C', data: new Uint8Array(256).fill(0xC9),
              start: 32768, startAddress: 32768, length: 256, sectors: 1 },
            { name: 'SECOND', ext: 'C', data: new Uint8Array(512).fill(0x00),
              start: 40000, startAddress: 40000, length: 512, sectors: 2 },
        ];

        async function loadIntoExplorer(bytes, filename) {
            const input = d.getElementById('explorerFileInput');
            const dt = new w.DataTransfer();
            dt.items.add(new w.File([bytes], filename));
            input.files = dt.files;
            input.dispatchEvent(new w.Event('change', { bubbles: true }));
            // wait until the panel reports the file we just gave it
            await until(() => (d.getElementById('explorerFileName').textContent || '').includes(filename));
            await wait(150);
            return d.getElementById('explorerInfoOutput').textContent || '';
        }

        // One throwing section must not abort the rest of the suite
        async function part(name, fn) {
            section(name);
            try { await fn(); }
            catch (e) { assert(false, name + ' threw', e && e.message); }
        }

        const clickTab = (label) => {
            const b = [...d.querySelectorAll('button')]
                .find(x => new RegExp('^\\s*' + label + '\\s*$', 'i').test(x.textContent || ''));
            if (b) b.click();
            return !!b;
        };

        // ---- run -----------------------------------------------------------
        (async () => {
            section('App and Explorer come up');
            const ok = await until(() => frame.contentWindow && frame.contentWindow.spectrum);
            assert(!!ok, 'emulator boots in the iframe');
            if (!ok) { log('\n=== ABORTED ===', 'fail'); return; }
            w = frame.contentWindow; d = frame.contentDocument;
            const errors = [];
            w.addEventListener('error', e => errors.push(e.message), true);

            assert(clickTab('Utils') || true, 'Utils tab clicked (Explorer lives there)');
            await wait(200);
            clickTab('Explorer');
            await wait(200);
            assert(!!d.getElementById('explorerFileInput'), 'Explorer file input exists');

            await part('Snapshot: info panel and registers', async () => {
                const info = await loadIntoExplorer(makeSNA(), 'probe.sna');
                assert(/SNA|Snapshot|48K/i.test(info), 'SNA info panel renders', info.slice(0, 60));
                assert(/SP|PC|IM/i.test(info), 'register table is shown');
                assert(/49179|48K|Border/i.test(info), 'snapshot details are shown');
            });

            await part('Tape: TAP catalogue', async () => {
                const info = await loadIntoExplorer(makeTAP(), 'probe.tap');
                assert(/TAP|Tape|Block/i.test(info), 'TAP info panel renders', info.slice(0, 60));
                assert(/TESTCODE/.test(info), 'the tape header name is listed', info.slice(0, 120));
                assert(/8000|32768/i.test(info), 'the CODE start address is shown');
            });

            await part('Disk: TRD catalogue', async () => {
                const trd = TRDLoader.buildTRD(trdFiles, 'PROBE');
                const info = await loadIntoExplorer(trd, 'probe.trd');
                assert(/TR-?DOS|Disk/i.test(info), 'TRD info panel renders', info.slice(0, 60));
                assert(/HELLO/.test(info), 'first file is listed');
                assert(/SECOND/.test(info), 'second file is listed');
                assert(/PROBE/.test(info), 'the disk label is shown');
            });

            await part('Disk: SCL catalogue', async () => {
                const scl = SCLLoader.buildSCL(trdFiles);
                const info = await loadIntoExplorer(scl, 'probe.scl');
                assert(/SCL|Disk|TR-?DOS/i.test(info), 'SCL info panel renders', info.slice(0, 60));
                assert(/HELLO/.test(info), 'SCL files are listed');
            });

            // A BASIC file's autostart line is not in the catalogue: TR-DOS writes
            // $80 $AA and the line after the program. Reading it once threw a
            // ReferenceError that took the whole TRD/SCL info panel down.
            await part('Disk: BASIC autostart line', async () => {
                const prog = new Uint8Array(24);
                prog.set([0x80, 0xAA, 0x0A, 0x00], 20);
                const basic = [{ name: 'boot', ext: 'B', data: prog,
                                 length: 20, programLength: 20, sectors: 1 }];
                const trdInfo = await loadIntoExplorer(TRDLoader.buildTRD(basic, 'PROBE'), 'basic.trd');
                assert(/boot/.test(trdInfo), 'TRD with a BASIC file renders', trdInfo.slice(0, 80));
                assert(/LINE 10/.test(trdInfo), 'TRD shows the BASIC autostart line', trdInfo.slice(0, 200));
                const sclInfo = await loadIntoExplorer(SCLLoader.buildSCL(basic), 'basic.scl');
                assert(/LINE 10/.test(sclInfo), 'SCL shows the BASIC autostart line', sclInfo.slice(0, 200));
            });

            await part('Hex and text views', async () => {
                await loadIntoExplorer(makeSNA(), 'probe.sna');
                const hexBtn = d.getElementById('btnExplorerHex');
                if (hexBtn) {
                    hexBtn.click();
                    const hex = await until(() => {
                        const t = d.getElementById('explorerHexOutput').textContent || '';
                        return t.length > 40 ? t : null;
                    });
                    assert(!!hex, 'hex dump renders');
                    assert(/[0-9A-F]{2}\s+[0-9A-F]{2}/i.test(hex || ''), 'hex dump shows byte pairs',
                           (hex || '').slice(0, 50));
                } else {
                    assert(false, 'hex button exists');
                }
            });

            await part('Addresses and offsets follow the hex/decimal switch', async () => {
                // The Explorer shows two kinds of number: a file's load address and a
                // position INSIDE the file. Both follow Settings -> Display, because an
                // offset column left in hex beside a decimal load address reads as a bug.
                const decBox = d.getElementById('chkDecAddresses');
                const setBase = async (dec) => {
                    decBox.checked = dec;
                    decBox.dispatchEvent(new w.Event('change'));
                    await wait(250);
                };
                const firstAddr = () => {
                    const t = d.getElementById('explorerHexOutput').textContent || '';
                    return (t.trim().split(/\s+/)[0] || '');
                };
                const bytesOf = () => {
                    const t = d.getElementById('explorerHexOutput').textContent || '';
                    return t.trim().split(/\s+/).slice(1, 4).join(' ');
                };

                await setBase(false);
                await loadIntoExplorer(makeSNA(), 'probe.sna');
                d.getElementById('btnExplorerHex')?.click();
                await until(() => (d.getElementById('explorerHexOutput').textContent || '').length > 40);
                const hexAddr = firstAddr();
                const hexBytes = bytesOf();
                assert(/^[0-9A-F]{4}$/.test(hexAddr), 'in hex the offset column is four hex digits',
                       hexAddr);

                await setBase(true);
                const decAddr = firstAddr();
                assert(/^[0-9]+$/.test(decAddr) && Number(decAddr) === parseInt(hexAddr, 16),
                       'in decimal it is the same offset written in decimal',
                       `${hexAddr} -> ${decAddr}`);
                assert(bytesOf() === hexBytes,
                       'and the byte column does NOT move -- bytes have their own switch',
                       `${hexBytes} -> ${bytesOf()}`);

                const box = d.getElementById('explorerHexAddr');
                assert(/^[0-9]+$/.test(box.value),
                       'the address box converted rather than keeping its digits', box.value);
                assert(/decimal/.test(box.title), 'and its tooltip says so', box.title);

                const trd = TRDLoader.buildTRD(trdFiles, 'PROBE');
                const infoDec = await loadIntoExplorer(trd, 'probe.trd');
                assert(/32768/.test(infoDec) && !/\$8000/.test(infoDec),
                       'a load address is decimal, without the hex twin beside it',
                       (infoDec.match(/.{0,30}32768.{0,20}/) || [''])[0]);

                // No reload here: loading the same filename twice makes the wait
                // condition true before the new render, which is a race. The panel
                // redraws itself on the switch, so just throw it and read again.
                await setBase(false);
                const infoHex = d.getElementById('explorerInfoOutput').textContent || '';
                assert(/\$8000/.test(infoHex), 'and in hex the pair comes back',
                       JSON.stringify(infoHex.slice(Math.max(0, infoHex.indexOf('32768') - 60),
                                                     infoHex.indexOf('32768') + 60)));

                // The tape block list is its own renderer, so it gets its own check:
                // a TAP CODE header's start address is the number a user reads most
                // often in this panel.
                await setBase(true);
                const tapDec = await loadIntoExplorer(makeTAP(), 'probe.tap');
                assert(/Start address:\s*32768/.test(tapDec) && !/\$8000/.test(tapDec),
                       'a TAP header start address is decimal too',
                       (tapDec.match(/Start address:.{0,12}/) || [''])[0]);
                await setBase(false);
                const tapHex = d.getElementById('explorerInfoOutput').textContent || '';
                assert(/Start address:\s*\$8000/.test(tapHex), 'and hex brings the sigil back',
                       (tapHex.match(/Start address:.{0,12}/) || [''])[0]);
            });

            await part('Switching files clears the previous one', async () => {
                const trd = TRDLoader.buildTRD(trdFiles, 'PROBE');
                await loadIntoExplorer(trd, 'probe.trd');
                const info = await loadIntoExplorer(makeTAP(), 'probe.tap');
                assert(!/HELLO/.test(info), 'the TRD catalogue is gone after loading a TAP',
                       info.slice(0, 80));
                assert(/TESTCODE/.test(info), 'the TAP catalogue replaced it');
            });

            await part('Disk Map renders a loaded disk', async () => {
                // The Disk Map is the largest untested part of the Explorer; these
                // asserts are the safety net for splitting it out.
                const trd = TRDLoader.buildTRD(trdFiles, 'PROBE');
                await loadIntoExplorer(trd, 'probe.trd');
                const tab = [...d.querySelectorAll('.explorer-subtab')]
                    .find(b => /disk map/i.test(b.textContent || ''));
                assert(!!tab, 'the Disk Map sub-tab exists');
                if (!tab) return;
                tab.click();
                await wait(300);

                const panel = d.getElementById('explorer-diskmap');
                assert(panel && panel.style.display !== 'none', 'the panel is shown');

                const grid = d.getElementById('diskmapGridContainer');
                const canvas = d.getElementById('diskmapCanvas');
                assert(!!(grid || canvas), 'it has a grid or canvas view');
                const painted = (grid && grid.children.length > 0) ||
                                (canvas && canvas.width > 0);
                assert(painted, 'and it drew something for the loaded disk',
                       `grid=${grid ? grid.children.length : 'n/a'} canvas=${canvas ? canvas.width : 'n/a'}`);

                const info = d.getElementById('diskmapInfo');
                const legend = d.getElementById('diskmapLegend');
                assert(!!(info || legend), 'the info/legend area exists');

                // switch the view mode; it must not throw or blank the panel
                const diskBtn = [...d.querySelectorAll('.diskmap-view-btn')]
                    .find(b => /disk/i.test(b.textContent || ''));
                if (diskBtn) {
                    diskBtn.click();
                    await wait(250);
                    assert(panel.style.display !== 'none', 'switching to the disk view keeps the panel up');
                }

                // back to the file list for the sections that follow
                const first = d.querySelector('.explorer-subtab');
                if (first) { first.click(); await wait(150); }
            });

            await part('Edit tab: the per-format editors render', async () => {
                // Covers ui/explorer-editors.js — the disk/tape editors, which the
                // info-panel checks above never touch.
                clickTab('Edit');
                await wait(250);
                const left = d.getElementById('editorPanelLeft');
                assert(!!left, 'the dual-panel editor exists');

                const trd = TRDLoader.buildTRD(trdFiles, 'PROBE');
                await loadIntoExplorer(trd, 'probe.trd');
                clickTab('Edit');
                const listed = await until(() => {
                    const t = (d.getElementById('editorPanels') || {}).textContent || '';
                    return /HELLO/.test(t) ? t : null;
                });
                assert(!!listed, 'a TRD catalogue is listed in the editor panel',
                       ((d.getElementById('editorPanels') || {}).textContent || '').slice(0, 80));
                assert(/SECOND/.test(listed || ''), 'every file is listed');
                assert(/PROBE/.test(listed || ''), 'the disk label strip is shown');

                const toolbar = d.getElementById('editorSharedToolbar');
                assert(!!toolbar && !toolbar.classList.contains('hidden'),
                       'the editor toolbar is available for a disk image');
            });

            await part('Edit: TRD BASIC autostart LINE', async () => {
                // The box a BASIC row opens is its LINE, written into the $80 $AA
                // trailer after the program -- not the Addr box a CODE row gets.
                const prog = new Uint8Array(24);
                prog.set([0x80, 0xAA, 0x0A, 0x00], 20);
                const basic = [{ name: 'boot', ext: 'B', data: prog, length: 20, programLength: 20, sectors: 1 },
                               trdFiles[0]];
                clickTab('Edit');
                await wait(250);
                await loadIntoExplorer(TRDLoader.buildTRD(basic, 'PROBE'), 'line.trd');
                clickTab('Edit');
                const rowOf = (name) => [...d.querySelectorAll('#editorPanels .disk-row')]
                    .find(r => (r.querySelector('.file-name') || {}).textContent === name);
                const openRow = async (name) => {
                    (await until(() => rowOf(name))).click();
                    rowOf(name).click();   // re-found: the first click may re-render the list
                    return await until(() => d.querySelector('#editorPanels .editor-inline-edit'));
                };
                const lineOf = (name) => ((rowOf(name) || d).querySelector('.file-addr') || {}).textContent;
                const status = () => [...d.querySelectorAll('#editorPanels *')]
                    .map(e => e.textContent).join(' ');

                let edit = await openRow('boot');
                const box = edit && edit.querySelector('[data-field="line"]');
                assert(!!box, 'a BASIC row opens a LINE box');
                assert(!!box && box.value === '10', 'holding the current line', box && box.value);
                assert(!edit.querySelector('[data-field="addr"]'), 'and no Addr box');

                box.value = '99999';
                edit.querySelector('[data-action="disk-apply"]').click();
                await wait(100);
                assert(/LINE must be/.test(status()), 'a line past 9999 is refused');
                assert(lineOf('boot') === 'LINE 10', 'and the old line stays', lineOf('boot'));

                box.value = '250';
                edit.querySelector('[data-action="disk-apply"]').click();
                await wait(150);
                assert(lineOf('boot') === 'LINE 250', 'Apply writes the new line', lineOf('boot'));

                edit = await openRow('boot');
                edit.querySelector('[data-field="line"]').value = '';
                edit.querySelector('[data-action="disk-apply"]').click();
                await wait(150);
                assert(lineOf('boot') === '', 'an empty box clears it', lineOf('boot'));

                edit = await openRow('HELLO');
                assert(!!edit.querySelector('[data-field="addr"]') && !edit.querySelector('[data-field="line"]'),
                       'a CODE row still opens an Addr box');
            });

            await part('Hex Dump: Find, including the encoded ladder', async () => {
                // The Explorer had no find at all before this. Encoded is the mode
                // that matters: game text is very often not stored as text, and a
                // plaintext search says the same "nothing" either way.
                const size = 0x1000;
                const raw = new Uint8Array(size);
                for (let i = 0; i < size; i++) raw[i] = (i * 7) & 0xff;
                const plant = (off, text, enc) => Array.from(text).forEach(
                    (ch, i) => { raw[off + i] = enc(ch.charCodeAt(0), i) & 0xff; });
                plant(0x100, 'TREASURE', c => c);              // plain
                plant(0x200, 'TREASURE', c => c ^ 0xff);       // complemented
                plant(0x300, 'TREASURE', (c, i) => c - 0x3b - i);  // c - (key + i)
                plant(0x400, 'TREAS', c => c);                 // five characters only
                await loadIntoExplorer(raw, 'probe.bin');

                clickTab('Hex Dump');
                await wait(200);
                const input = d.getElementById('explorerFindText');
                const mode = d.getElementById('explorerFindMode');
                const results = d.getElementById('explorerFindResults');
                const status = d.getElementById('explorerFindStatus');
                assert(!!input && !!mode && !!results, 'the Find row exists in the Hex Dump tab');
                if (!input) return;

                const find = async (text, m, five = false) => {
                    mode.value = m;
                    d.getElementById('chkExplorerFind5ch').checked = five;
                    input.value = text;
                    d.getElementById('btnExplorerFind').click();
                    await wait(250);
                    return [...results.querySelectorAll('.explorer-find-hit')]
                        .map(h => parseInt(h.dataset.off, 10));
                };

                let hits = await find('TREASURE', 'text');
                assert(hits.includes(0x100), 'Text finds the plaintext copy', hits.join(','));
                assert(!hits.includes(0x200), 'and not the complemented one');

                hits = await find('TREASURE', 'encoded');
                assert(hits.includes(0x100) && hits.includes(0x200) && hits.includes(0x300),
                       'Encoded finds all three', hits.map(h => h.toString(16)).join(','));
                const labels = [...results.querySelectorAll('.explorer-find-hit .he')]
                    .map(e => e.textContent).join(' | ');
                assert(/complement/i.test(labels), 'and names the scheme each was wearing', labels);

                hits = await find('TREASURE', 'encoded', true);
                assert(hits.includes(0x400), 'five-character matching finds a truncated word',
                       hits.map(h => h.toString(16)).join(','));

                hits = await find('43 4E', 'hex');
                assert(Array.isArray(hits), 'Hex mode runs');
                await find('ZZ', 'hex');
                assert(/not hex/i.test(status.textContent), 'and rejects what is not hex',
                       status.textContent);

                await find('QQZZXX', 'text');
                assert(/not found/i.test(status.textContent), 'a word that is absent says so',
                       status.textContent);
                await find('QQZZXX', 'encoded');
                assert(/any of the encodings/i.test(status.textContent),
                       'and the encoded search says which "nothing" it means',
                       status.textContent);

                // A hit is a way into the dump, not a dead end
                await find('TREASURE', 'encoded');
                const row = results.querySelector('.explorer-find-hit[data-off="768"]');  // $300
                if (row) {
                    row.click();
                    await wait(200);
                    assert(d.getElementById('explorerHexAddr').value.toUpperCase() === '0300',
                           'clicking a hit scrolls the dump to it',
                           d.getElementById('explorerHexAddr').value);
                }
            });

            assert(errors.length === 0, 'no uncaught errors while driving the Explorer',
                   errors.slice(0, 3).join(' | '));

            log('\n=== COMPLETE ===', 'section');
        })();
    </script>
</body>
</html>
