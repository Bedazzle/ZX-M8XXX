<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Didaktik Gama Tests</title>
    <style>
        body { font-family: monospace; background: #1e1e2e; color: #cdd6f4; padding: 16px; }
        #summary { margin: 8px 0 16px; font-size: 15px; }
        .pass { color: #a6e3a1; }
        .fail { color: #f38ba8; }
        .skip { color: #f9e2af; }
        .section { color: #89b4fa; font-weight: bold; margin-top: 12px; }
        #log div { white-space: pre; }
        iframe { width: 1000px; height: 500px; border: 1px solid #444; margin-top: 16px; }
    </style>
</head>
<body>
    <h2>Didaktik Gama Tests</h2>
    <div id="summary">running…</div>
    <div id="log"></div>
    <iframe id="app"></iframe>

    <script type="module">
        // Didaktik Gama: 80KB -- two 32KB banks at $8000 picked by PC0 of its
        // 8255 (ports $1F/$3F/$5F/$7F), after ZEsarUX's didaktikgama.c.
        import { Memory } from '../core/memory.js';
        import { Spectrum } from '../core/spectrum.js';
        import { getMachineProfile } from '../core/machines.js';

        const TEST_VERSION = '0.1.0';
        const logEl = document.getElementById('log');
        const summaryEl = document.getElementById('summary');
        let passed = 0, failed = 0, skipped = 0;
        function log(msg, cls = '') {
            const d = document.createElement('div'); d.className = cls; d.textContent = msg; logEl.appendChild(d);
        }
        function section(name) { log('\n ' + name + ' ', 'section'); }
        // Until the end the summary keeps changing (all-tests.html takes a
        // summary that holds still for a second as the result)
        let finished = false, beat = 0;
        setInterval(() => { if (!finished) render(); }, 300);
        function render() {
            if (!finished) {
                summaryEl.textContent = `running\u2026 pass ${passed}, fail ${failed} (${++beat})`;
                return;
            }
            summaryEl.innerHTML = `v${TEST_VERSION} | <span class="pass">Pass: ${passed}</span> | ` +
                `<span class="fail">Fail: ${failed}</span> | Total: ${passed + failed}` +
                (skipped ? ` | Skipped: ${skipped}` : '');
        }
        function assert(cond, name, detail = '') {
            if (cond) { passed++; log('  ' + name, 'pass'); }
            else { failed++; log('  ' + name + (detail ? ': ' + detail : ''), 'fail'); }
            render();
        }
        function skip(name) { skipped++; log('  (skipped) ' + name, 'skip'); render(); }
        const wait = (ms) => new Promise(r => setTimeout(r, ms));
        async function until(fn, tries = 400, gap = 25) {
            for (let i = 0; i < tries; i++) {
                try { const v = fn(); if (v) return v; } catch (e) {}
                await wait(gap);
            }
            return null;
        }


        // The 8255 and the second bank, with NO ROM. Everything below needs
        // roms/dgama89.rom and skips without it, and that ROM is not in FUSE or
        // ZEsarUX's distribution -- so this suite ran 0 asserts and still
        // reported green, which looks exactly like passing. The 80KB IS the
        // layer, so it is pinned here where it always runs.
        function banking() {
            section('the 8255 and the second 32KB bank (no ROM needed)');
            const canvas = document.createElement('canvas');
            const sp = new Spectrum(canvas, { machineType: 'dgama' });
            const m = sp.memory;

            assert(getMachineProfile('dgama').gama80k === true && !!m.gamaBank1 &&
                   m.gamaBank1.length === 32768,
                'a Gama has a second 32KB bank; the profile says so',
                m.gamaBank1 ? m.gamaBank1.length : 'none');
            assert(!new Memory('48k').gamaBank1 && !new Memory('128k').gamaBank1,
                'and nothing else has one');

            // Power-on is mode $9B: every port an input, so PC0 cannot select
            // and is pulled low. Bank 0 whatever port C holds.
            sp.reset();
            assert(m.gamaBank === 0, 'after reset: mode $9B, all inputs, bank 0');
            sp._gama8255Write(3, 0x01);                  // BSR: set PC0
            assert(m.gamaBank === 0,
                'PC0 set while C is an INPUT still reads bank 0',
                'bank ' + m.gamaBank);

            // $92 is what the ROM leaves: the low half of C an output, so PC0
            // counts. Setting the mode clears the outputs, hence bank 0 first.
            sp._gama8255Write(3, 0x92);
            assert(m.gamaBank === 0, 'a mode set clears port C, so bank 0');
            sp._gama8255Write(3, 0x01);                  // BSR: PC0 = 1
            assert(m.gamaBank === 1, 'then PC0 = 1 selects bank 1', 'bank ' + m.gamaBank);
            sp._gama8255Write(3, 0x00);                  // BSR: PC0 = 0
            assert(m.gamaBank === 0, 'and PC0 = 0 comes back to bank 0');

            // The two banks are genuinely separate storage at $8000.
            sp._gama8255Write(3, 0x00);
            m.write(0x8000, 0xA5);
            m.write(0xFFFF, 0x5A);
            sp._gama8255Write(3, 0x01);
            m.write(0x8000, 0x3C);
            const inBank1 = m.read(0x8000);
            sp._gama8255Write(3, 0x00);
            assert(inBank1 === 0x3C && m.read(0x8000) === 0xA5 && m.read(0xFFFF) === 0x5A,
                '$8000-$FFFF is two separate 32KB banks, not one',
                `bank1 $${inBank1.toString(16)}, bank0 $${m.read(0x8000).toString(16)}`);

            // $4000-$7FFF is the machine's own contended RAM in both banks
            sp._gama8255Write(3, 0x00);
            m.write(0x4000, 0x11);
            sp._gama8255Write(3, 0x01);
            assert(m.read(0x4000) === 0x11, '$4000 is the same RAM whichever bank is in');

            // BSR addresses a bit by D3-D1, so only bit 0 moves the bank
            sp._gama8255Write(3, 0x92);
            sp._gama8255Write(3, 0x03);                  // set PC1, not PC0
            assert(m.gamaBank === 0, 'a BSR for another port C bit leaves the bank alone',
                'bank ' + m.gamaBank);
        }

        async function runTests() {
            banking();
            section('Didaktik Gama');
            const ok = async (u) => fetch(u).then(r => r.ok, () => false);
            if (!(await ok('../roms/dgama89.rom'))) { skip('roms/dgama89.rom not present'); return; }
            const frame = document.getElementById('app');
            frame.src = '../index.html';
            const zx = await until(() => frame.contentWindow.zxDebug, 400, 50);
            if (!zx) { assert(false, 'app came up'); return; }
            await zx.ready({ machine: 'dgama' });
            const sp = frame.contentWindow.spectrum;
            const m = sp.memory;
            zx.pause();
            sp.reset();
            const outs = [];
            const pw = sp.cpu.portWrite;
            sp.cpu.portWrite = (p, v, t) => { if ((p & 0x9F) === 0x1F) outs.push((p & 0xFF).toString(16) + '=' + v.toString(16)); return pw(p, v, t); };
            await zx.runFrames(300);
            sp.cpu.portWrite = pw;
            assert(sp.cpu.pc < 0x4000 && m.read(0) === 0xF3, 'Gama ROM boots');
            assert(outs.includes('7f=92') && m.gamaBank === 0, "the ROM sets the 8255 up ($7F=$92: C an output), bank 0", outs.join(' '));
            assert(sp.portRead(0x00FD) === 0xFF, 'no floating bus');
            const saved = m.read(0x9000);
            m.write(0x9000, 0x11);
            sp.portWrite(0x005F, 1);
            const inB1 = m.read(0x9000);
            m.write(0x9000, 0x22);
            const fixed = m.read(0x4000);
            sp.portWrite(0x005F, 0);
            assert(m.read(0x9000) === 0x11 && inB1 !== 0x11, 'PC0 = 1 brings the second 32KB bank to $8000');
            sp.portWrite(0x005F, 1);
            assert(m.read(0x9000) === 0x22 && m.read(0x4000) === fixed, 'bank 1 keeps its data; $4000-$7FFF is not paged');
            sp.portWrite(0x007F, 0x00);                       // BSR: PC0 = 0
            assert(m.gamaBank === 0, 'bit set/reset on the control port switches too');
            sp.portWrite(0x007F, 0x01);                       // BSR: PC0 = 1
            assert(m.gamaBank === 1 && sp.portRead(0x005F) === 0x01, 'port C reads back its latch');
            sp.portWrite(0x007F, 0x9B);                       // mode: all inputs, PC0 pulled low
            assert(m.gamaBank === 0, 'mode with C as input: bank 0 (PC0 pulled low)');
            sp.portWrite(0x007F, 0x92); sp.portWrite(0x005F, 1);
            m.trdosActive = true;
            sp.portWrite(0x005F, 0);
            m.trdosActive = false;
            assert(m.gamaBank === 1, 'while TR-DOS is paged the ports are the Beta Disk\'s');
            sp.portWrite(0x005F, 0);
            m.write(0x9000, saved);
            sp.reset();
            assert(m.gamaBank === 0, 'reset: bank 0');
            // The usual detection routine (BSR on port 127): NZ = 80KB
            //   ld a,1: ld bc,(50000): ld (50000),a: out (127),a: xor a
            //   ld (50000),a: out (127),a: ld a,(50000): ld (50000),bc: or a
            sp.portWrite(0x007F, 0x92);                       // as the ROM leaves it (C an output)
            const code = [0x3E, 0x01, 0xED, 0x4B, 0x50, 0xC3, 0x32, 0x50, 0xC3, 0xD3, 0x7F, 0xAF,
                0x32, 0x50, 0xC3, 0xD3, 0x7F, 0x3A, 0x50, 0xC3, 0xED, 0x43, 0x50, 0xC3, 0xB7];
            code.forEach((b, i) => m.write(0x6000 + i, b));
            m.write(50000, 0x5A);
            const c = sp.cpu, pc0 = c.pc;
            c.pc = 0x6000;
            for (let n = 0; n < 100 && c.pc !== 0x6000 + code.length; n++) c.execute();
            const a = c.a, z = !!(c.f & 0x40);
            c.pc = pc0;
            assert(a !== 0 && !z && m.read(50000) === 0x5A && m.gamaBank === 0,
                'the bank B detection routine finds 80KB (NZ), and puts 50000 back', 'A=' + a);
        }

        (async () => {
            try {
                await runTests();
            } catch (e) {
                assert(false, 'suite threw', e && e.stack || String(e));
            }
            finished = true;
            render();
        })();
    </script>
</body>
</html>
