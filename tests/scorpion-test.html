<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Scorpion TURBO+ Tests</title>
    <style>
        body { font-family: monospace; background: #1e1e2e; color: #cdd6f4; padding: 16px; }
        #summary { margin: 8px 0 16px; font-size: 15px; }
        .pass { color: #a6e3a1; }
        .fail { color: #f38ba8; }
        .skip { color: #f9e2af; }
        .section { color: #89b4fa; font-weight: bold; margin-top: 12px; }
        #log div { white-space: pre; }
        iframe { width: 1000px; height: 500px; border: 1px solid #444; margin-top: 16px; }
    </style>
</head>
<body>
    <h2>Scorpion TURBO+ Tests</h2>
    <div id="summary">running…</div>
    <div id="log"></div>
    <iframe id="app"></iframe>

    <script type="module">
        // CPU turbo (core/spectrum.js _turboSpend) and the Scorpion ZS 256
        // TURBO+ with 1MB (machine 'scorpiontb'): ProfROM planes, 1FFD bits 6-7,
        // turbo on IN from $7FFD / off from $1FFD, AY R14 readback, $1F with the
        // DOS off, SMUC's IDE with no drive, and a disk started from the menu.
        const TEST_VERSION = '0.1.0';
        const logEl = document.getElementById('log');
        const summaryEl = document.getElementById('summary');
        let passed = 0, failed = 0, skipped = 0;
        function log(msg, cls = '') {
            const d = document.createElement('div'); d.className = cls; d.textContent = msg; logEl.appendChild(d);
        }
        function section(name) { log('\n ' + name + ' ', 'section'); }
        // Until the end the summary keeps changing (all-tests.html takes a
        // summary that holds still for a second as the result)
        let finished = false, beat = 0;
        setInterval(() => { if (!finished) render(); }, 300);
        function render() {
            if (!finished) {
                summaryEl.textContent = `running… pass ${passed}, fail ${failed} (${++beat})`;
                return;
            }
            summaryEl.innerHTML = `v${TEST_VERSION} | <span class="pass">Pass: ${passed}</span> | ` +
                `<span class="fail">Fail: ${failed}</span> | Total: ${passed + failed}` +
                (skipped ? ` | Skipped: ${skipped}` : '');
        }
        function assert(cond, name, detail = '') {
            if (cond) { passed++; log('  ' + name, 'pass'); }
            else { failed++; log('  ' + name + (detail ? ': ' + detail : ''), 'fail'); }
            render();
        }
        function skip(name) { skipped++; log('  (skipped) ' + name, 'skip'); render(); }
        const wait = (ms) => new Promise(r => setTimeout(r, ms));
        async function until(fn, tries = 400, gap = 25) {
            for (let i = 0; i < tries; i++) {
                try { const v = fn(); if (v) return v; } catch (e) {}
                await wait(gap);
            }
            return null;
        }

        async function runTests() {
            const frame = document.getElementById('app');
            frame.src = '../index.html';
            const zx = await until(() => frame.contentWindow.zxDebug, 400, 50);
            if (!zx) { assert(false, 'app came up'); return; }

            section('CPU turbo');
            await zx.ready({ machine: '128k' });
            let sp = frame.contentWindow.spectrum;
            zx.pause();
            // JR $ in RAM with interrupts off: 12 T a loop, so the loops in a
            // frame count the CPU's cycles
            const loopsPerFrame = async () => {
                sp.cpu.iff1 = sp.cpu.iff2 = false;
                sp.cpu.halted = false;
                sp.memory.write(0x8000, 0x18); sp.memory.write(0x8001, 0xFE);
                sp.cpu.pc = 0x8000;
                await zx.runFrames(2);
                const a = sp.cpu.instructionCount;
                await zx.runFrames(10);
                return (sp.cpu.instructionCount - a) / 10;
            };
            const tpf = sp.timing.tstatesPerFrame;
            sp.setTurboForce(1);
            const x1 = await loopsPerFrame();
            sp.setTurboForce(2);
            const x2 = await loopsPerFrame();
            sp.setTurboForce(4);
            const x4 = await loopsPerFrame();
            sp.setTurboForce(0);
            assert(x1 === tpf / 12, 'x1: a frame is the machine\'s own T-states', x1 + ' loops');
            assert(x2 === 2 * x1 && x4 === 4 * x1, 'x2 and x4: two and four times the instructions in the same frame',
                x2 + ' / ' + x4);
            assert(sp.turboMultiplier() === 1, 'the setting back on "machine": a 128K has none');
            sp.setTurboForce(2);
            sp.reset();
            assert(sp.turboMultiplier() === 2, 'a forced turbo survives a reset');
            sp.setTurboForce(0);

            section('Scorpion ZS 256 TURBO+ (1MB): ports');
            await zx.ready({ machine: 'scorpiontb' });
            sp = frame.contentWindow.spectrum;
            zx.pause();
            const m = sp.memory;
            assert(sp.machineType === 'scorpiontb' && m.ram.length === 64 && m.rom.length === 16,
                '1MB of RAM, 16 ROM banks (the 256KB ProfROM)', m.ram.length + ' / ' + m.rom.length);
            sp.reset();
            sp.portRead(0x7FFD);
            assert(sp.turboHw === 2 && sp.turboMultiplier() === 2, 'IN from $7FFD: turbo on');
            sp.portRead(0x1FFD);
            assert(sp.turboHw === 1, 'IN from $1FFD: turbo off');
            sp.portRead(0x7FFD); sp.reset();
            assert(sp.turboHw === 1, 'reset: turbo off');
            // RAM page = 7FFD bits 0-2 | 1FFD bit 4 -> 3 | 1FFD bits 6-7 -> 4-5
            sp.portWrite(0x1FFD, 0xD0); sp.portWrite(0x7FFD, 0x05);
            sp.memory.write(0xC000, 0x5A);
            assert(m.currentRamBank === 61 && m.ram[61][0] === 0x5A, '1FFD bits 6-7: pages 16-63 at $C000',
                'page ' + m.currentRamBank);
            sp.portWrite(0x1FFD, 0x00); sp.portWrite(0x7FFD, 0x05);
            assert(m.currentRamBank === 5, 'and back to page 5');
            sp.portWrite(0xFFFD, 14);
            sp.portWrite(0x1FFD, 0x10); sp.portWrite(0x7FFD, 0x13);
            const r14 = sp.portRead(0xFFFD);
            assert(r14 === ((0x10 << 1) | 0x10 | 0x03), 'AY register 14 reads the paging back',
                r14.toString(16));
            sp.portWrite(0x1FFD, 0x00); sp.portWrite(0x7FFD, 0x00);

            section('ProfROM planes');
            m.romPlane = 0;
            sp.portWrite(0x1FFD, 0x02);                     // the service ROM
            m.peek(0x0104);
            assert(m.romPlane === 0, 'a debugger peek does not switch');
            m.read(0x0104);
            assert(m.romPlane === 3, 'read of $0104 from plane 0: plane 3', m.romPlane);
            m.read(0x0108);
            assert(m.romPlane === 1, 'read of $0108 from plane 3: plane 1', m.romPlane);
            m.read(0x0100);
            assert(m.romPlane === 1, 'read of $0100 from plane 1: stays', m.romPlane);
            m.read(0x010C);
            assert(m.romPlane === 0, 'read of $010C from plane 1: plane 0', m.romPlane);
            sp.portWrite(0x1FFD, 0x00);
            m.read(0x0104);
            assert(m.romPlane === 0, 'not in the service ROM: no switch');
            m.romPlane = 1;
            assert(m.read(0x0000) === m.rom[4 + m.currentRomBank][0], 'the ROM read comes from the plane');
            m.romPlane = 0;

            section('Beta Disk and SMUC');
            sp.betaDisk.intrq = true;
            m.trdosActive = false;
            const p1f = sp.portRead(0x001F);
            assert((p1f & 0xC0) === 0x80, 'DOS off: $1F has the Beta INTRQ in bit 7', p1f.toString(16));
            sp.betaDisk.intrq = false;
            m.trdosActive = true;
            assert(sp.portRead(0xFFBE) === 0x7F, 'DOS on: SMUC IDE status with no drive is $7F (not busy)');
            m.trdosActive = false;
            // Service ROM over the DOS, as the ProfROM runs its disk code
            m.trdosActive = true;
            sp.portWrite(0x7FFD, 0x10); sp.portWrite(0x1FFD, 0x02);
            assert(m.read(0x0000) === m.rom[2][0], '1FFD bit 1 shows the service ROM even with the DOS on');
            sp.portWrite(0x1FFD, 0x00);
            assert(m.read(0x0000) === m.rom[3][0], 'without it, the DOS shows TR-DOS (bank 3)');
            m.trdosActive = false;

            section('ProfROM boot and a disk');
            sp.reset();
            const hasRom = m.rom[2].some(b => b !== 0);
            if (!hasRom) {
                skip('roms/profrom.rom is not there: no boot');
            } else {
                let menuAt = -1;
                for (let f = 0; f < 800; f += 10) {
                    await zx.runFrames(10);
                    if (sp.cpu.pc >= 0x3600 && sp.cpu.pc < 0x3700 && m.currentRomBank === 0 && m.romPlane === 0) {
                        menuAt = f; break;
                    }
                }
                assert(menuAt > 0 && menuAt < 600, 'the ProfROM reaches its menu (no minute of waiting on SMUC)',
                    'frame ' + menuAt);
                let disk = null;
                try {
                    const res = await fetch('../headless/beta48/Pang.scl');
                    if (res.ok) disk = new Uint8Array(await res.arrayBuffer());
                } catch (e) {}
                if (!disk) {
                    skip('headless/beta48/Pang.scl is not there: no disk run');
                } else {
                    await zx.loadFile(disk, 'Pang.scl');
                    const r = await zx.autoLoad({ type: 'trd', diskRun: 'Pang', settleFrames: 900 });
                    assert(!r.timedOut && sp.cpu.pc >= 0x4000, 'disk autostart: menu, 128 TR-DOS, RUN "Pang" runs it',
                        'pc ' + sp.cpu.pc.toString(16));
                }
            }
            sp.reset();
        }

        (async () => {
            try {
                await runTests();
            } catch (e) {
                assert(false, 'suite threw', e && e.stack || String(e));
            }
            finished = true;
            render();
        })();
    </script>
</body>
</html>
