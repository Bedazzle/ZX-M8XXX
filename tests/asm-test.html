        // ==================== ADVANCED TESTS ====================

        async function runAdvancedTests() {
            section('SAVEHOB Directive');

            // Basic SAVEHOB produces a hobeta save command
            let result = asm('ORG $8000\nDB 1,2,3,4,5\nSAVEHOB "test.hob", "myfile.C", $8000, 5');
            assert(result.success, 'SAVEHOB assembles successfully');
            let hobCmd = result.saveCommands ? result.saveCommands.find(c => c.type === 'hobeta') : null;
            assert(hobCmd !== null, 'SAVEHOB creates hobeta save command');
            if (hobCmd) {
                assertEqual(hobCmd.innerName, 'myfile  ', 'SAVEHOB inner name padded to 8 chars');
                assertEqual(hobCmd.extChar, 'C', 'SAVEHOB extension char');
                assertEqual(hobCmd.startAddr, 0x8000, 'SAVEHOB start address');
                assert(hobCmd.capturedData !== null && hobCmd.capturedData.length === 5, 'SAVEHOB captured 5 bytes');
                if (hobCmd.capturedData) {
                    assertEqual(hobCmd.capturedData[0], 1, 'SAVEHOB data byte 0');
                    assertEqual(hobCmd.capturedData[4], 5, 'SAVEHOB data byte 4');
                }
            }

            // SAVEHOB with different extension
            result = asm('ORG $6000\nDB 0xFF\nSAVEHOB "out.hob", "prog.B", $6000, 1');
            hobCmd = result.saveCommands ? result.saveCommands.find(c => c.type === 'hobeta') : null;
            if (hobCmd) {
                assertEqual(hobCmd.extChar, 'B', 'SAVEHOB extension B');
            }

            // SAVEHOB with # extension
            result = asm('ORG $6000\nDB 0xFF\nSAVEHOB "out.hob", "data.#", $6000, 1');
            hobCmd = result.saveCommands ? result.saveCommands.find(c => c.type === 'hobeta') : null;
            if (hobCmd) {
                assertEqual(hobCmd.extChar, '#', 'SAVEHOB extension #');
            }

            section('Macro Multi-Pass Convergence');

            // Macros with local labels must converge across passes
            result = asm(`
                ORG $8000
                MACRO COPYBLOCK count
                    LD B, count
.lp:                LD A, (HL)
                    LD (DE), A
                    INC HL
                    INC DE
                    DJNZ .lp
                ENDM
                COPYBLOCK 10
                COPYBLOCK 20
            `);
            assert(result.success, 'Macro with local labels converges');
            assert(result.output && result.output.length > 0, 'Macro with local labels produces output');

            // Multiple macro calls with local labels should not cause convergence failure
            result = asm(`
                ORG $8000
                MACRO WAIT n
                    LD B, n
.loop:              DJNZ .loop
                ENDM
                WAIT 5
                WAIT 10
                WAIT 15
                WAIT 20
            `);
            assert(result.success, 'Multiple macro calls with local labels converge');

            section('Colon as Statement Separator');

            // Instruction followed by colon should be statement separator, not label
            // "exa : ld a,b" = EX AF,AF' then LD A,B (not label "exa" + LD A,B)
            result = asm(`
                ORG $8000
                exa : ld a,b
            `);
            assert(result.success, 'EXA colon as statement separator assembles');
            if (result.output) {
                assertBytes(result.output, [0x08, 0x78], 'EXA : LD A,B = 08 78');
            }

            // Multiple statement separators with instructions
            // "exa : ld a,b : exa" = EX AF,AF' + LD A,B + EX AF,AF'
            result = asm(`
                ORG $8000
                exa : ld a,b : exa
            `);
            assert(result.success, 'Multiple colon separators with instructions');
            if (result.output) {
                assertBytes(result.output, [0x08, 0x78, 0x08], 'EXA : LD A,B : EXA = 08 78 08');
            }

            // NOP as instruction, not label, when followed by colon
            result = asm(`
                ORG $8000
                nop : ret
            `);
            assert(result.success, 'NOP colon as statement separator');
            if (result.output) {
                assertBytes(result.output, [0x00, 0xC9], 'NOP : RET = 00 C9');
            }

            // Column-1 identifier with colon is still a label (even if instruction name)
            result = asm(`
                ORG $8000
nop:
                ret
            `);
            assert(result.success, 'Column-1 NOP colon is label');
            let nopSym = result.symbols ? result.symbols.find(s => s.name === 'nop') : null;
            assert(nopSym !== null, 'Column-1 NOP: defined as label');

            section('Macro Call with Colon Separator');

            // Macro name followed by colon should be macro call + statement separator
            // "GET_BIT : jr nc,somewhere" = expand GET_BIT macro, then JR NC
            result = asm(`
                ORG $8000
                MACRO GET_BIT
                    call $9000
                ENDM
target:
                GET_BIT : jr nc,target
            `);
            assert(result.success, 'Macro call with colon separator assembles');
            if (result.output) {
                // GET_BIT expands to CALL $9000 (3 bytes: CD 00 90)
                // then JR NC,target — target is at $8000, JR is at $8003, offset = -5 = $FB
                assertBytes(result.output, [0xCD, 0x00, 0x90, 0x30, 0xFB], 'Macro : JR NC,target correct bytes');
            }

            // Macro call with colon, then another macro call
            result = asm(`
                ORG $8000
                MACRO INC2
                    inc a
                    inc a
                ENDM
                INC2 : INC2
            `);
            assert(result.success, 'Macro : Macro separator assembles');
            if (result.output) {
                assertBytes(result.output, [0x3C, 0x3C, 0x3C, 0x3C], 'INC2 : INC2 = 4x INC A');
            }

            // Macro with local labels + colon separator must converge
            result = asm(`
                ORG $8000
                MACRO GETBIT
                    sla c
                    jr nz,.done
                    call $9000
.done:
                ENDM
start:
                GETBIT : jr nc,start
                GETBIT : jr nc,start
                ret
            `);
            assert(result.success, 'Macro+locals with colon separator converges');

            // Label with same name as macro (case-insensitive) must define label, not expand macro
            // Bards-tale pattern: lowercase label "wait_key_down:" + uppercase macro "WAIT_KEY_DOWN"
            result = asm(`
                ORG $8000
                MACRO WAIT_KEY_DOWN
                    rst $10
                    db $23
                ENDM
wait_key_down:
                call $9000
                jr nc, wait_key_down
                ret
other:
                WAIT_KEY_DOWN
                jp wait_key_down
            `);
            assert(result.success, 'Label with same name as macro (case-insensitive) assembles');
            if (result.output) {
                // wait_key_down: at $8000
                // call $9000 = CD 00 90
                // jr nc, wait_key_down = 30 FB (-5)
                // ret = C9
                // WAIT_KEY_DOWN macro = rst $10 (D7) + db $23 (23)
                // jp wait_key_down = C3 00 80
                assertBytes(result.output, [0xCD, 0x00, 0x90, 0x30, 0xFB, 0xC9, 0xD7, 0x23, 0xC3, 0x00, 0x80],
                    'Label coexists with same-name macro');
            }

            // Label-only line matching macro name must define label
            result = asm(`
                ORG $8000
                MACRO MY_LABEL
                    nop
                ENDM
MY_LABEL:
                ret
                dw MY_LABEL
            `);
            assert(result.success, 'Label-only line matching macro name defines label');
            if (result.output) {
                // MY_LABEL: at $8000, ret = C9, dw $8000 = 00 80
                assertBytes(result.output, [0xC9, 0x00, 0x80], 'Label-only line value is address, not macro expansion');
            }

            section('Local Labels After Operators');

            // Local label used in expression after + operator
            result = asm(`
                ORG $8000
parent:
.offset: EQU 5
                LD A, parent + .offset
            `);
            assert(result.success, 'Local label after + operator assembles');

            // Local label after subtraction
            result = asm(`
                ORG $8000
base:
.size: EQU 10
                LD HL, $8100 - .size
            `);
            assert(result.success, 'Local label after - operator assembles');

            // Local label after multiplication
            result = asm(`
                ORG $8000
tbl:
.width: EQU 32
                LD HL, 3 * .width
            `);
            assert(result.success, 'Local label after * operator assembles');
            if (result.output) {
                // 3 * 32 = 96 = 0x0060
                assertBytes(result.output, [0x21, 0x60, 0x00], 'Local label after * gives correct value');
            }

            // Local label in complex expression with bitwise operators
            result = asm(`
                ORG $8000
flags:
.mask: EQU $F0
                LD A, $FF & .mask
            `);
            assert(result.success, 'Local label after & operator assembles');
            if (result.output) {
                assertBytes(result.output, [0x3E, 0xF0], 'Local label after & gives correct value');
            }

            section('EQU Local Label Scoping');

            // Local labels after EQU should scope under the EQU
            result = asm(`
                ORG $8000
probs: EQU $9000
.c: EQU 0
.e: EQU 2
                LD A, (probs + .c)
                LD A, (probs + .e)
            `);
            assert(result.success, 'Local labels scope under EQU parent');

            // Verify correct values
            result = asm(`
                ORG $8000
config: EQU $C000
.width: EQU 32
.height: EQU 24
                LD HL, config + .width
                LD DE, config + .height
            `);
            assert(result.success, 'EQU scoped locals resolve correctly');
            if (result.output) {
                // config + .width = 0xC000 + 32 = 0xC020
                assertEqual(result.output[1], 0x20, 'EQU local .width low byte');
                assertEqual(result.output[2], 0xC0, 'EQU local .width high byte');
                // config + .height = 0xC000 + 24 = 0xC018
                assertEqual(result.output[4], 0x18, 'EQU local .height low byte');
                assertEqual(result.output[5], 0xC0, 'EQU local .height high byte');
            }

            // EQU followed by label — local labels after regular label should NOT scope under EQU
            result = asm(`
                ORG $8000
myequ: EQU 42
routine:
.local: NOP
                JR .local
            `);
            assert(result.success, 'Local label after regular label scopes under routine, not EQU');

            section('MODULE Compound Name Lookup');

            // Simple MODULE with compound name lookup
            result = asm(`
                ORG $8000
                MODULE mymod
vars: EQU $9000
.x: EQU 0
.y: EQU 2
                LD HL, vars + .x
                LD DE, vars + .y
                ENDMODULE
            `);
            assert(result.success, 'MODULE with EQU and local labels');

            // Compound name resolution inside MODULE
            result = asm(`
                ORG $8000
                MODULE upkr
probs: EQU $C000
.c: EQU 0
.e: EQU 2
                LD HL, probs + .c
                LD DE, probs + .e
                ; Also test dotted compound name
                LD BC, probs.c
                ENDMODULE
            `);
            assert(result.success, 'MODULE compound name probs.c resolves');

            // Cross-module reference with @
            result = asm(`
                ORG $8000
                MODULE mod1
val: EQU 42
                ENDMODULE
                MODULE mod2
                LD A, @mod1.val
                ENDMODULE
            `);
            assert(result.success, 'Cross-module @ reference');
            if (result.output) {
                assertBytes(result.output, [0x3E, 42], 'Cross-module @ gives correct value');
            }

            // Nested module name resolution
            result = asm(`
                ORG $8000
                MODULE outer
                MODULE inner
label: NOP
                ENDMODULE
                JP outer.inner.label
                ENDMODULE
            `);
            assert(result.success, 'Nested MODULE name resolution');

            // Scope fallback: an unqualified name inside a MODULE that isn't a local
            // member must fall back to the enclosing/global scope (sjasmplus rule).
            // Regression for a real Lode Runner disassembly that referenced GLOBAL
            // labels (defined after the module) from inside MODULE ig_v / dpub.
            result = asm(`
                ORG $8000
                MODULE ig_v
                LD HL, GLOB
                ENDMODULE
GLOB:           DEFB 1, 2
            `);
            assert(result.success, 'global label resolves from inside a MODULE (forward, scope fallback)');
            if (result.output) {
                assertBytes(result.output, [0x21, 0x03, 0x80, 0x01, 0x02], 'global-from-module ref uses the global address ($8003)');
            }

            // Fallback to an OUTER (non-global) module too: inside outer.inner,
            // an unqualified name defined in `outer` resolves up one level.
            result = asm(`
                ORG $9000
                MODULE outer
OVAL:           EQU $1234
                MODULE inner
                LD BC, OVAL
                ENDMODULE
                ENDMODULE
            `);
            assert(result.success, 'unqualified ref resolves to an outer module scope');
            if (result.output) {
                assertBytes(result.output, [0x01, 0x34, 0x12], 'outer-scope ref uses outer value ($1234)');
            }

            // Shadowing: a module-local symbol shadows a global of the same name for
            // unqualified refs INSIDE the module; outside, the global is used.
            result = asm(`
                ORG $8000
COLLIDE:        EQU 99
                MODULE m
COLLIDE:        EQU 1
                LD A, COLLIDE
                ENDMODULE
                LD B, COLLIDE
            `);
            assert(result.success, 'local/global name collision assembles');
            if (result.output) {
                assertBytes(result.output, [0x3E, 0x01, 0x06, 0x63], 'module-local shadows global inside ($01), global outside ($63)');
            }

            // LABELSLIST: produces a 'labelslist' save command whose content is the
            // sjasmplus unreal-speccy ".l" format ("PP:AAAA name", sorted by address).
            result = asm(`
                DEVICE ZXSPECTRUM48
                LABELSLIST "out.l"
                ORG $8000
START:          NOP
NEXT:           NOP
VAL:            EQU 42
            `);
            assert(result.success, 'LABELSLIST assembles (directive recognized)');
            const llCmd = (result.saveCommands || []).find(c => c.type === 'labelslist');
            assert(!!llCmd, 'LABELSLIST emits a labelslist save command');
            if (llCmd) {
                assert(llCmd.filename === 'out.l', 'LABELSLIST filename captured');
                assert(/^02:8000 START$/m.test(llCmd.content), 'LABELSLIST lists START as 02:8000');
                assert(/^02:8001 NEXT$/m.test(llCmd.content), 'LABELSLIST lists NEXT as 02:8001');
                assert(/^00:002A VAL$/m.test(llCmd.content), 'LABELSLIST lists EQU VAL as 00:002A');
                const idxVal = llCmd.content.indexOf('VAL');
                const idxStart = llCmd.content.indexOf('START');
                assert(idxVal >= 0 && idxStart >= 0 && idxVal < idxStart, 'LABELSLIST sorted by address (VAL before START)');
            }

            // TAPOUT/TAPEND: wrap bytes emitted between them as a standard ZX tape
            // block [len_lo][len_hi][flag][data...][checksum], len = data+2,
            // checksum = flag XOR all data bytes (matches sjasmplus framing).
            result = asm(`
                ORG $8000
                TAPOUT "out.tap", $FF
                DB 1, 2, 3
                TAPEND
                TAPOUT "out.tap"
                DW $1234
                TAPEND
            `);
            assert(result.success, 'TAPOUT/TAPEND assembles');
            const toCmds = (result.saveCommands || []).filter(c => c.type === 'tapout');
            assert(toCmds.length === 2, 'TAPOUT/TAPEND emits one block per pair');
            if (toCmds.length === 2) {
                assert(toCmds[0].filename === 'out.tap', 'TAPOUT filename captured');
                // Block 1: flag FF, data 01 02 03, checksum FF^01^02^03 = FF, len = 5
                assertBytes(toCmds[0].blockData, [0x05, 0x00, 0xFF, 0x01, 0x02, 0x03, 0xFF], 'TAPOUT block framing (explicit flag $FF)');
                // Block 2: default flag FF, DW $1234 -> 34 12, checksum FF^34^12 = D9, len = 4
                assertBytes(toCmds[1].blockData, [0x04, 0x00, 0xFF, 0x34, 0x12, 0xD9], 'TAPOUT block framing (default flag)');
            }

            // TAPEND without a preceding TAPOUT is an error. It is REPORTED BY
            // THROWING, so asm() never returns here — this assert used to take the
            // exception out through runAllTests, which stopped the suite dead at
            // this line and still reported green, because nothing had failed.
            const tapend = tryAsm(`
                ORG $8000
                TAPEND
            `);
            assert(!tapend.ok, 'TAPEND without TAPOUT is an error');
            assert(/TAPEND without TAPOUT/.test(tapend.err), 'and says which directive is unmatched',
                   tapend.err);
        }

        // ==================== RUN ALL ====================

        // Assemble every built-in editor snippet (data/asm-snippets.json) so they
        // stay compilable. Each snippet is wrapped with an ORG to give address-using
        // ones a base.
        async function runSnippetTests() {
            section('Built-in Snippets');
            const snippets = snippetsData;
            assert(Array.isArray(snippets) && snippets.length > 0, 'snippets file is a non-empty array');
            for (const s of snippets) {
                const name = (s && s.name) || '(unnamed)';
                let ok = false, info = '';
                try {
                    const res = Assembler.assemble('    org $8000\n' + (s.code || ''));
                    ok = !!(res && res.success);
                    if (!ok) info = (res && res.errors && res.errors[0] && res.errors[0].message) || 'assembly failed';
                } catch (e) {
                    info = e.message;
                }
                assert(ok, `snippet assembles: ${name}`, info);
            }
        }

        // Wrong source must be reported, not silently assembled
        async function runOperandValidationTests() {
            section('Operand Validation');

            // Helpers: does this source fail / warn?
            function fails(src) {
                try {
                    const r = Assembler.assemble(src);
                    return !(r && r.success);
                } catch (e) {
                    return true;
                }
            }
            function warningsOf(src) {
                let r = null;
                try { r = Assembler.assemble(src); } catch (e) { return []; }
                return ((r && r.warnings) || []).map(w => w.message || String(w))
                    .filter(m => !m.startsWith('Unused label:'));
            }

            // Instructions that take no operands must reject them
            assert(fails("exx af,af'"), "EXX with operands rejected");
            assert(fails('nop 5'), 'NOP with operand rejected');
            assert(fails('halt 1'), 'HALT with operand rejected');
            assert(fails('di 1'), 'DI with operand rejected');
            assert(fails('ldir bc,de'), 'LDIR with operands rejected');
            assert(fails('neg a'), 'NEG with operand rejected');
            assert(fails('reti 5'), 'RETI with operand rejected');
            assert(fails("exa af,af'"), "EXA with operands rejected");

            // ...but still assemble bare, including with a colon separator
            assertBytes(bytes('exx'), [0xD9], 'EXX alone still assembles');
            assertBytes(bytes('    ldir'), [0xED, 0xB0], 'LDIR alone still assembles');
            assertBytes(bytes('    nop : ret'), [0x00, 0xC9], 'NOP : RET still assembles');
            assertBytes(bytes('    exa : ld a,b'), [0x08, 0x78], 'EXA : LD A,B still assembles');
            assertBytes(bytes('    ldir ; copy'), [0xED, 0xB0], 'LDIR with comment still assembles');

            // A missing operand must not assemble as zero
            assert(fails('ld a,'), 'LD with trailing comma rejected');
            assert(fails('push bc,'), 'PUSH with trailing comma rejected');
            assert(fails('ld ,a'), 'LD with empty first operand rejected');

            // Values that don't fit are truncated, but must say so
            assert(warningsOf('ld a,300').length === 1, 'LD A,300 warns (8-bit range)');
            assert(warningsOf('db 300').length === 1, 'DB 300 warns (8-bit range)');
            assert(warningsOf('db -200').length === 1, 'DB -200 warns (8-bit range)');
            assert(warningsOf('ld hl,70000').length === 1, 'LD HL,70000 warns (16-bit range)');
            assert(warningsOf('ld b,(ix+200)').length === 1, 'IX displacement +200 warns');
            assertBytes(bytes('ld a,300'), [0x3E, 0x2C], 'LD A,300 still emits the low byte');

            // In-range values (incl. negatives) stay silent
            assert(warningsOf('ld a,255').length === 0, 'LD A,255 silent');
            assert(warningsOf('ld a,-128').length === 0, 'LD A,-128 silent');
            assert(warningsOf('db -1').length === 0, 'DB -1 silent');
            assert(warningsOf('ld hl,-1').length === 0, 'LD HL,-1 silent');
            assert(warningsOf('ld b,(ix+127)').length === 0, 'IX displacement +127 silent');
            assert(warningsOf('    org $8000\n    jr $').length === 0, 'in-range JR silent');
            assert(warningsOf('    org $8000\n    jr $+300').length === 1, 'out-of-range JR warns once');

            // A directive that needs operands is a mistake when bare, not a label
            assert(fails('org'), 'bare ORG rejected');
            assert(fails('include'), 'bare INCLUDE rejected');
            assert(fails('incbin'), 'bare INCBIN rejected');
            assert(fails('align'), 'bare ALIGN rejected');
            assert(fails('macro'), 'bare MACRO rejected');

            // ...but words real sources use as labels still work
            assert(!fails('slot\n    nop'), 'SLOT alone still a label');
            assert(!fails('page\n    nop'), 'PAGE alone still a label');
            assert(!fails('byte\n    nop'), 'BYTE alone still a label');
        }

        // Malformed source must be reported, not quietly turned into something else
        async function runSourceValidationTests() {
            section('Source Validation');

            function fails(src) {
                try {
                    const r = Assembler.assemble(src);
                    return !(r && r.success);
                } catch (e) {
                    return true;
                }
            }
            function warningsOf(src) {
                let r = null;
                try { r = Assembler.assemble(src); } catch (e) { return []; }
                return ((r && r.warnings) || []).map(w => w.message || String(w))
                    .filter(m => !m.startsWith('Unused label:'));
            }

            // Junk after / missing part of an expression
            assert(fails('ld a,1+'), 'dangling operator rejected');
            assert(fails('ld a,1 2'), 'junk after expression rejected');
            assert(fails('ld a,1)'), 'stray closing paren rejected');
            assert(fails('ld a,0b12'), 'bad binary literal rejected');
            assert(fails('ld a,(ix+)'), 'missing IX displacement rejected');

            // Operands that are not immediates must not be evaluated as numbers
            assert(fails('ld (ix+5),(iy+5)'), 'LD (IX+d),(IY+d) rejected');
            assert(fails('ld (ix+5),(hl)'), 'LD (IX+d),(HL) rejected');
            assert(fails('ld b,(bc)'), 'LD B,(BC) rejected');
            assert(fails('add a,(bc)'), 'ADD A,(BC) rejected');
            assert(fails('cp (de)'), 'CP (DE) rejected');

            // H/L and the index halves can't meet — the prefix rewrites them
            assert(fails('ld ixl,h'), 'LD IXL,H rejected');
            assert(fails('ld h,ixl'), 'LD H,IXL rejected');
            assert(fails('ld ixh,iyl'), 'mixing IX and IY halves rejected');
            assertBytes(bytes('ld ixl,ixh'), [0xDD, 0x6C], 'LD IXL,IXH = DD 6C');
            assertBytes(bytes('ld ixh,ixl'), [0xDD, 0x65], 'LD IXH,IXL = DD 65');
            assertBytes(bytes('ld iyl,iyh'), [0xFD, 0x6C], 'LD IYL,IYH = FD 6C');

            // Blocks left open swallow the rest of the file
            assert(fails('    if 1\n    nop'), 'IF without ENDIF rejected');
            assert(fails('    macro m\n    nop'), 'MACRO without ENDM rejected');
            assert(fails('    rept 3\n    nop'), 'REPT without ENDR rejected');
            assert(!fails('    if 1\n    nop\n    endif'), 'closed IF still assembles');
            assert(!fails('    rept 2\n    nop\n    endr'), 'closed REPT still assembles');

            // Duplicate label: say so instead of "failed to converge"
            let dupMsg = '';
            try {
                const r = Assembler.assemble('start: nop\nstart: nop');
                dupMsg = (r && r.errors && r.errors[0] && r.errors[0].message) || '';
            } catch (e) {
                dupMsg = e.message;
            }
            assert(/already defined/i.test(dupMsg), 'duplicate label names the label', dupMsg);
            assert(!fails('    module m1\nstart: nop\n    endmodule\n' +
                          '    module m2\nstart: nop\n    endmodule'),
                   'same label in two modules is not a duplicate');
            assert(!fails('mac macro\n    nop\n    endm\n    mac\n    mac'),
                   'macro expanded twice is not a duplicate');

            // Nonsense sizes/alignments warn
            assert(warningsOf('    ds -5').length === 1, 'negative DS warns');
            assert(warningsOf('    align 3').length === 1, 'non-power-of-2 ALIGN warns');
            assert(warningsOf('    align 4').length === 0, 'ALIGN 4 silent');
        }

        // Three Assembler options, one per kind of non-Zilog form the assembler
        // takes. All on by default (sjasmplus accepts them all); off, each is an
        // error naming the standard form, and each is independent of the others.
        async function runDialectOptionTests() {
            section('Dialect options');

            function build(src, opts) {
                try {
                    const r = Assembler.assemble(src, '<input>', [], opts || {});
                    return { ok: !!(r && r.success), err: '' };
                } catch (e) { return { ok: false, err: e.message }; }
            }
            const ALT = { altMnemonics: false };
            const MULTI = { multiOperand: false };
            const UNDOC = { undocumented: false };

            // Alternative mnemonics
            assert(build('EX HL,DE', ALT).err.includes('EX DE,HL'),
                   'EX HL,DE off: the message names EX DE,HL', build('EX HL,DE', ALT).err);
            assert(!build('EXA', ALT).ok, 'EXA off');
            assert(!build('EX HL,(SP)', ALT).ok, 'EX HL,(SP) off');
            assert(!build('EX AF,AF', ALT).ok, 'EX AF,AF off');
            assert(!build('EX AF', ALT).ok, 'EX AF off');
            assert(!build('LD A,XH', ALT).ok, 'the XH spelling off');
            // ...and the canonical forms still assemble
            assert(build('EX DE,HL', ALT).ok, 'EX DE,HL still assembles');
            assert(build('EX (SP),HL', ALT).ok, 'EX (SP),HL still assembles');
            assert(build("EX AF,AF'", ALT).ok, "EX AF,AF' still assembles");
            assert(build('LD A,IXH', ALT).ok, 'LD A,IXH still assembles');

            // Multi-operand PUSH/POP and INC/DEC
            assert(!build('PUSH HL,AF', MULTI).ok, 'PUSH HL,AF off');
            assert(!build('POP BC,DE', MULTI).ok, 'POP BC,DE off');
            assert(!build('INC E,DE', MULTI).ok, 'INC E,DE off');
            assert(!build('DEC E,DE', MULTI).ok, 'DEC E,DE off');
            assert(build('PUSH HL', MULTI).ok, 'PUSH HL still assembles');
            assert(build('INC E', MULTI).ok, 'INC E still assembles');

            // Undocumented opcodes
            assert(!build('SLL B', UNDOC).ok, 'SLL off');
            assert(!build('SLI B', UNDOC).ok, 'SLI off with it');
            assert(!build('SL1 B', UNDOC).ok, 'SL1 off with it');
            assert(build('SLI B', UNDOC).err.includes('SLI'),
                   'and the message quotes the name the source used', build('SLI B', UNDOC).err);
            // SLI is a name sjasmplus knows; SL1 is only a spelling, so that one
            // needs the alternatives option too
            assert(build('SLI B', ALT).ok, 'SLI survives with alternatives off');
            assert(!build('SL1 B', ALT).ok, 'SL1 does not');
            assert(!build('LD A,IXH', UNDOC).ok, 'IXH off');
            assert(!build('INC IYL', UNDOC).ok, 'IYL off');
            assert(!build('IN F,(C)', UNDOC).ok, 'IN F,(C) off');
            assert(!build('OUT (C),0', UNDOC).ok, 'OUT (C),0 off');
            assert(build('IN A,(C)', UNDOC).ok, 'IN A,(C) still assembles');
            assert(build('OUT (C),A', UNDOC).ok, 'OUT (C),A still assembles');
            assert(build('SRL B', UNDOC).ok, 'SRL B still assembles');

            // Independent of one another
            assert(build('PUSH HL,AF', ALT).ok && build('SLL B', ALT).ok,
                   'turning alternatives off leaves the other two alone');
            assert(build('EX HL,DE', MULTI).ok && build('SLL B', MULTI).ok,
                   'turning multi-operand off leaves the other two alone');
            assert(build('EX HL,DE', UNDOC).ok && build('PUSH HL,AF', UNDOC).ok,
                   'turning undocumented off leaves the other two alone');

            // ...and none of it persists into the next build
            assert(build('EX HL,DE').ok && build('PUSH HL,AF').ok && build('SLL B').ok,
                   'the options do not leak into a build that does not pass them');
        }

        // The line an error is reported on is the line it is on. The parser used to
        // count NEWLINE tokens, but the lexer swallows the newlines inside a /* */
        // comment and at a "\" continuation without emitting one, so from there on
        // every error pointed a few lines too early — and the editor jumped there.
        async function runErrorLineTests() {
            section('Error line numbers');

            const lineOf = (lines) => tryAsm(lines.join('\n')).line;
            const BAD = 'nosuchop zz';   // fails on whatever line it sits on

            assert(lineOf(['nop', 'nop', 'nop', 'nop', BAD]) === 5,
                   'plain source: reported on its own line');
            assert(lineOf(['nop', '', 'foo:', '    or a', BAD]) === 5,
                   'blank and label-only lines are counted');
            assert(lineOf(['nop : nop', 'nop', 'nop', 'nop', BAD]) === 5,
                   'two statements on one line count as one');
            assert(lineOf(['ld \\', ' a,1', 'nop', 'nop', BAD]) === 5,
                   'a "\\" line continuation does not lose a line');
            assert(lineOf(['nop', '/* one', 'two', 'three */', 'nop', BAD]) === 6,
                   'a block comment does not lose its lines');
            assert(lineOf(['/* a', 'b */ /* c', 'd */', BAD]) === 4,
                   'two block comments do not lose their lines');

            // A REPT/DUP body is re-parsed from text, so its lines have to be
            // carried across — otherwise every error in the loop, however far
            // down, is reported on the DUP line
            assert(lineOf([' DUP 3', ' nop', ' nop', ' ' + BAD, ' EDUP']) === 4,
                   'an error in a DUP body is on its own line');
            assert(lineOf([' DUP 2', ' DUP 2', ' nop', ' nop', ' ' + BAD, ' EDUP', ' EDUP']) === 5,
                   'and in a nested DUP body too');
            assert(lineOf([' MACRO m', ' ' + BAD, ' ENDM', ' nop', ' nop',
                           ' DUP 2', ' m', ' EDUP']) === 7,
                   'a macro called from a DUP is reported at the call');
        }

        // Directive and macro forms that real sjasmplus projects use. These were all
        // broken until Lua-using sources exposed them, but none of them need Lua.
        async function runProjectFormTests() {
            section('EXPORT');

            function build(src, opts) {
                let r = null, threw = null;
                try { r = Assembler.assemble(src, '<input>', [], opts || {}); } catch (e) { threw = e.message; }
                return {
                    ok: !threw && !!(r && r.success),
                    err: threw || '',
                    output: (r && r.output) || [],
                    cmds: (r && r.saveCommands) || [],
                    warns: (((r && r.warnings) || []).map(w => w.message || String(w))
                        .filter(m => !m.startsWith('Unused label:'))),
                };
            }

            let b = build([
                '    ORG $8000',
                'start:',
                '    ret',
                '    EXPORT start',
            ].join('\n'));
            assert(b.ok, 'EXPORT assembles', b.err);
            const exp = b.cmds.find(c => c.type === 'export');
            assert(!!exp, 'EXPORT produces an export file');
            assert(!!exp && /^start: EQU 0x8000$/m.test(exp.content || ''),
                   'exported symbol carries its address', exp ? String(exp.content) : '');

            // Forward reference: the value is read after assembly, not at EXPORT time
            b = build([
                '    ORG $9000',
                '    EXPORT later',
                '    nop',
                'later:',
                '    ret',
            ].join('\n'));
            const exp2 = b.cmds.find(c => c.type === 'export');
            assert(b.ok && !!exp2 && /^later: EQU 0x9001$/m.test(exp2.content || ''),
                   'a forward-declared label exports its final value',
                   exp2 ? String(exp2.content) : b.err);

            // Several names, one file
            b = build(['    ORG $8000', 'a:', '    nop', 'b:', '    ret', '    EXPORT a, b'].join('\n'));
            const exp3 = b.cmds.find(c => c.type === 'export');
            assert(b.ok && !!exp3 && /a: EQU/.test(exp3.content || '') && /b: EQU/.test(exp3.content || ''),
                   'EXPORT takes a list', exp3 ? String(exp3.content) : b.err);
            assert(b.cmds.filter(c => c.type === 'export').length === 1, 'one .exp per build');

            section('VFS: renaming a file');
            {
                VFS.reset();
                VFS.addFile('main.asm', '    nop\n');
                VFS.addBinaryFile('pic.bin', new Uint8Array([1, 2, 3]));

                let r = VFS.renameFile('main.asm', 'game.asm');
                assert(r.ok && VFS.exists('game.asm') && !VFS.exists('main.asm'),
                       'a source is renamed', JSON.stringify(r));
                assert(VFS.getFile('game.asm').content === '    nop\n', 'and keeps its contents');

                r = VFS.renameFile('pic.bin', 'screen.scr');
                assert(r.ok && VFS.getBinaryFile('screen.scr').content.length === 3,
                       'a binary keeps its bytes and stays binary', JSON.stringify(r));

                r = VFS.renameFile('game.asm', 'screen.scr');
                assert(!r.ok && /exists/.test(r.error), 'renaming onto an existing file is refused',
                       JSON.stringify(r));
                assert(VFS.exists('game.asm'), 'and the original survives that');

                assert(!VFS.renameFile('nothere.asm', 'x.asm').ok, 'renaming a missing file fails');
                assert(!VFS.renameFile('game.asm', '   ').ok, 'an empty name is refused');
                assert(VFS.renameFile('game.asm', 'game.asm').ok, 'renaming to the same name is a no-op');

                // subdirectories
                VFS.addFile('src/util.asm', '    ret\n');
                r = VFS.renameFile('src/util.asm', 'src/helpers.asm');
                assert(r.ok && VFS.exists('src/helpers.asm'), 'a file inside a directory renames',
                       JSON.stringify(r));
                VFS.reset();
            }

            section('VFS: a single-file build keeps what the caller loaded');
            {
                // Assembling a single file means "no project", not "no data": the
                // INCLUDE/INCBIN payloads the caller loaded must survive, or a build
                // fails with "file not found" for a file the user can see. Only the
                // editor's own scratch buffer is dropped.
                VFS.reset();
                VFS.addFile('editor.asm', '    nop\n', { scratch: true });
                VFS.addFile('old.asm', '    nop\n');
                VFS.addFile('data.inc', 'HELLO');
                VFS.addBinaryFile('game.scr', new Uint8Array([1, 2, 3]));
                VFS.resetSources();
                assert(!VFS.exists('editor.asm'), 'resetSources drops the scratch buffer');
                assert(VFS.exists('old.asm'), 'and keeps a loaded source');
                assert(VFS.exists('data.inc'), 'including one with a source extension');
                assert(VFS.exists('game.scr'), 'and keeps the binaries');
                const kept = VFS.getBinaryFile('game.scr');
                assert(kept && kept.content && kept.content.length === 3,
                       'with their bytes intact', JSON.stringify(kept && kept.content));

                VFS.reset();
                VFS.addBinaryFile('data.bin', new Uint8Array([9, 9, 9, 9]));
                const r = Assembler.assemble('    org $8000\n    incbin "data.bin"\n', 'main.asm');
                assert(r.success && r.output.length === 4,
                       'a single-file build can INCBIN a preloaded binary',
                       r.success ? String(r.output.length) : 'failed');
                assert(VFS.exists('data.bin'), 'and the binary is still there afterwards');

                // The reported case: the payload has a *source* extension, so it is
                // stored as text — assembling twice must still find it.
                VFS.reset();
                VFS.addFile('somefile.inc', 'HELLO-DATA!');
                for (const pass of ['first', 'second']) {
                    const r2 = Assembler.assemble('    org $8000\n    incbin "somefile.inc"\n', 'editor.asm');
                    assert(r2.success && r2.output.length === 11,
                           `a text-extension INCBIN payload survives the ${pass} build`,
                           r2.success ? String(r2.output.length) : 'failed');
                    assert(VFS.exists('somefile.inc'), `and is still listed after the ${pass} build`);
                }

                // Nothing about this is specific to .inc, or to INCBIN: the rule is
                // "the editor's buffer is scratch, everything else was loaded by the
                // user". Every extension the loader treats as text, plus one it
                // doesn't, plus a subdirectory — INCBINned and INCLUDEd, twice each.
                for (const name of ['data.inc', 'data.txt', 'data.def', 'data.h',
                                    'data.dat', 'data.bin', 'assets/data.inc', 'shared.asm']) {
                    VFS.reset();
                    VFS.addFile(name, 'HELLO-DATA!');
                    let ok = true, why = '';
                    for (let i = 0; i < 2; i++) {
                        const rb = Assembler.assemble(`    org $8000\n    incbin "${name}"\n`, 'editor.asm');
                        if (!rb.success || rb.output.length !== 11 || !VFS.exists(name)) {
                            ok = false; why = `incbin pass ${i + 1}`;
                        }
                    }
                    assert(ok, `INCBIN "${name}" survives repeated builds`, why);

                    VFS.reset();
                    VFS.addFile(name, '    nop\n    nop\n');
                    ok = true; why = '';
                    for (let i = 0; i < 2; i++) {
                        const ri = Assembler.assemble(`    org $8000\n    include "${name}"\n`, 'editor.asm');
                        if (!ri.success || ri.output.length !== 2 || !VFS.exists(name)) {
                            ok = false; why = `include pass ${i + 1}` +
                                (ri.success ? ` len=${ri.output.length}` : ' failed');
                        }
                    }
                    assert(ok, `INCLUDE "${name}" survives repeated builds`, why);
                }

                // A loaded file keeps its bytes. Decoding to text for the editor is
                // lossy above 0x7F, so INCBIN used to emit the right *size* and the
                // wrong data — silently, since nothing about the build looked odd.
                VFS.reset();
                const all256 = new Uint8Array(256);
                for (let i = 0; i < 256; i++) all256[i] = i;
                VFS.addFile('gfx.inc', 'whatever the decoder made of it',
                            { bytes: all256 });
                const back = VFS.getBinaryFile('gfx.inc');
                assert(back.content && back.content.length === 256 &&
                       Array.from(back.content).every((b, i) => b === i),
                       'the bytes as loaded come back unchanged',
                       back.content ? `len=${back.content.length}` : JSON.stringify(back));

                const rgfx = Assembler.assemble('    org $8000\n    incbin "gfx.inc"\n', 'editor.asm');
                assert(rgfx.success && rgfx.output.length === 256 &&
                       Array.from(rgfx.output).every((b, i) => b === i),
                       'and INCBIN emits them byte for byte',
                       rgfx.success ? `len=${rgfx.output.length}` : 'failed');

                // Editing the file makes the text the file again
                VFS.setContent('gfx.inc', 'AB');
                const redit = Assembler.assemble('    org $8000\n    incbin "gfx.inc"\n', 'editor.asm');
                assert(redit.success && redit.output.length === 2 &&
                       redit.output[0] === 0x41 && redit.output[1] === 0x42,
                       'editing it drops the stale bytes and follows the text',
                       redit.success ? Array.from(redit.output).join(',') : 'failed');

                // A file with no loaded bytes (typed in, or restored from a project)
                // still works the old way
                VFS.reset();
                VFS.addFile('typed.inc', 'AB');
                const rtyped = Assembler.assemble('    org $8000\n    incbin "typed.inc"\n', 'editor.asm');
                assert(rtyped.success && rtyped.output.length === 2 && rtyped.output[0] === 0x41,
                       'a file that never had bytes still INCBINs its text',
                       rtyped.success ? Array.from(rtyped.output).join(',') : 'failed');

                // Several loaded files at once, none of them dropped
                VFS.reset();
                VFS.addFile('a.inc', 'AA');
                VFS.addFile('b.txt', 'BBB');
                VFS.addBinaryFile('c.bin', new Uint8Array([1, 2, 3, 4]));
                Assembler.assemble('    org $8000\n    incbin "a.inc"\n    incbin "b.txt"\n' +
                                   '    incbin "c.bin"\n', 'editor.asm');
                const still = ['a.inc', 'b.txt', 'c.bin'].filter(p => VFS.exists(p));
                assert(still.length === 3, 'a mixed set of loaded files all survive',
                       JSON.stringify(still));
                VFS.reset();
            }

            section('ORG below the first one still emits');
            {
                // Reported: "org 25000" code then "org 16384 / incbin screen.scr"
                // built as 9 bytes and the image never reached memory.
                VFS.reset();
                VFS.addBinaryFile('pic.bin', new Uint8Array(6912).fill(0xAA));
                const r = Assembler.assemble(
                    '    org 25000\nlab:\n    ld a,r\n    and 7\n    out ($fe),a\n    jp lab\n' +
                    '    org 16384\n    incbin "pic.bin"\n', 'main.asm');
                assert(r.success, 'it assembles', r.success ? '' : 'failed');
                assert(r.outputStart === 16384, 'the output starts at the lower ORG',
                       String(r.outputStart));
                assert(r.output.length === 25009 - 16384, 'and spans both blocks',
                       `${r.output.length} vs ${25009 - 16384}`);
                assert(r.output[0] === 0xAA && r.output[6911] === 0xAA,
                       'the included data is at the lower address',
                       `${r.output[0]},${r.output[6911]}`);
                assert(r.output[6912] === 0, 'the gap is zero-filled');
                assert(r.output[25000 - 16384] === 0xED, 'and the code is at its own ORG',
                       '0x' + (r.output[25000 - 16384] || 0).toString(16));
                VFS.reset();

                // The UI assembles through the async entry point, so it needs the
                // same behaviour — this is the path the reported build actually took.
                VFS.reset();
                VFS.addBinaryFile('pic.bin', new Uint8Array(6912).fill(0xAA));
                const ra = await Assembler.assembleAsync(
                    '    org 25000\n    ret\n    org 16384\n    incbin "pic.bin"\n', 'editor.asm');
                assert(ra.success && ra.outputStart === 16384,
                       'assembleAsync starts at the lower ORG too',
                       `${ra.success} start=${ra.outputStart}`);
                assert(ra.output.length === 25001 - 16384,
                       'and emits both blocks', String(ra.output.length));
                VFS.reset();

                // A typed array from another realm (an iframe, a worker) must not
                // silently become an empty file — that turned INCBIN into a no-op.
                VFS.reset();
                let threw = false;
                try { VFS.addBinaryFile('bad.bin', 'not bytes'); } catch (e) { threw = true; }
                assert(threw, 'addBinaryFile rejects data it cannot read');
                VFS.addBinaryFile('view.bin', new Uint8Array([1, 2, 3]).subarray(1));
                assert(VFS.getBinaryFile('view.bin').content.length === 2,
                       'a typed-array view keeps its own length',
                       String(VFS.getBinaryFile('view.bin').content.length));
                VFS.addBinaryFile('buf.bin', new Uint8Array([4, 5, 6, 7]).buffer);
                assert(VFS.getBinaryFile('buf.bin').content.length === 4, 'an ArrayBuffer works');
                VFS.reset();

                // The ORG-0 measuring trick emits nothing, so it must be unaffected
                const r2 = Assembler.assemble(
                    '    org $8000\n    ld a,1\n    org 0\nlen: equ 5\n    org $8002\n    nop\n', 'm.asm');
                assert(r2.success && r2.outputStart === 0x8000,
                       'an ORG 0 that emits nothing does not move the start',
                       String(r2.outputStart));
            }

            section('Keyword used as a label');
            {
                function warnings(src) {
                    try { Assembler.assemble(src); } catch (e) {}
                    return (ErrorCollector.warnings || []).map(w => w.message || String(w));
                }
                let w = warnings(['    org $8000', 'end     push hl', '        jr end'].join('\n'));
                assert(w.some(m => /"end" is a directive/.test(m)),
                       'a keyword in column 0 used as a label warns', w.join(' | '));
                assert(w.filter(m => /is a directive/.test(m)).length === 1,
                       'warned once, not once per pass', w.join(' | '));

                w = warnings(['    org $8000', 'end:    push hl', '        jr end'].join('\n'));
                assert(!w.some(m => /is a directive/.test(m)),
                       '"end:" with a colon does not warn', w.join(' | '));

                w = warnings(['    org $8000', 'moo     push hl', '        jr moo'].join('\n'));
                assert(!w.some(m => /is a directive/.test(m)),
                       'an ordinary column-0 label does not warn', w.join(' | '));

                w = warnings(['    org $8000', '    ret'].join('\n'));
                assert(!w.some(m => /is a directive/.test(m)),
                       'a plain directive line does not warn', w.join(' | '));

                // Instruction names hit the same trap
                w = warnings(['    org $8000', 'push    exx', '        jr push'].join('\n'));
                assert(w.some(m => /"push" is an instruction/.test(m)),
                       'an instruction name in column 0 used as a label warns', w.join(' | '));
                w = warnings(['    org $8000', 'nop     exx'].join('\n'));
                assert(w.some(m => /"nop" is an instruction/.test(m)),
                       'a no-operand instruction used as a label warns', w.join(' | '));

                // ...but a real label named after an instruction must stay quiet
                w = warnings(['    org $8000', 'rst:    nop', 'jr      rst', '    ret'].join('\n'));
                assert(!w.some(m => /is an instruction/.test(m)),
                       '"jr rst" is quiet when rst: is a real label', w.join(' | '));
                w = warnings(['    org $8000', '        push hl', '        pop hl'].join('\n'));
                assert(!w.some(m => /is an instruction/.test(m)),
                       'ordinary indented instructions do not warn', w.join(' | '));
            }

            section('Labels marked "!" (not exported)');
            {
                // sjasmplus writes "!label = value"; without the marker handled, the
                // line isn't a label at all and later references fail
                const r = build(['    ORG $8000', '!saved = $', '    ld hl,saved', '    ORG saved'].join('\n'));
                assert(r.ok, '"!label = $" defines a usable label', r.err);
                assertBytes(r.output, [0x21, 0x00, 0x80], '"!label" resolves to its address');

                const r2 = build(['!flag: equ 5', '    ld a,flag'].join('\n'));
                assert(r2.ok && r2.output[1] === 5, '"!label:" with EQU works too', r2.err);
            }

            section('Macro parameters written the sjasmplus way (name?)');
            {
                let r = build([
                    'SETB MACRO value?',
                    '    db value?',
                    '  ENDM',
                    '    ORG $8000',
                    '    SETB 7',
                ].join('\n'));
                assert(r.ok && r.output[0] === 7, '"?" parameter is substituted', r.err);

                r = build([
                    'RANGE MACRO from?, to?',
                    '    db to? - from?',
                    '  ENDM',
                    '    ORG $8000',
                    '    RANGE 2, 9',
                ].join('\n'));
                assert(r.ok && r.output[0] === 7, 'several "?" parameters in one expression', r.err);

                // A longer name starting with the same text must not be clobbered
                r = build([
                    'PAIR MACRO a?, ab?',
                    '    db a?, ab?',
                    '  ENDM',
                    '    ORG $8000',
                    '    PAIR 1, 2',
                ].join('\n'));
                assert(r.ok && r.output[0] === 1 && r.output[1] === 2,
                       'a? does not match inside ab?', r.err + ' ' + JSON.stringify(Array.from(r.output)));

                // Parameters without "?" keep working
                r = build(['OLD MACRO value', '    db value', '  ENDM', '    ORG $8000', '    OLD 3'].join('\n'));
                assert(r.ok && r.output[0] === 3, 'parameters without "?" still substitute', r.err);
            }

            section('A mistyped mnemonic is reported, not turned into a label');
            {
                // "dup32" (for "dup 32") used to define a label called dup32 and
                // assemble the body once, reporting OK for a source that never
                // worked. An indented name has to be an instruction or macro call.
                let r = build(['    org 25000', 'label:', '    dup32', '        nop', '    edup'].join('\n'));
                assert(!r.ok, 'the reported source fails instead of emitting 1 byte',
                       r.ok ? r.output.length + ' bytes' : '');
                assert(/dup32/i.test(r.err || ''), 'the message names the line at fault', r.err);

                r = build(['    org 25000', '    frobnicate'].join('\n'));
                assert(!r.ok, 'any unknown indented mnemonic fails');

                // Column 1 is still a label without a colon — sjasmplus allows it
                r = build(['    org 25000', 'start', '    nop', '    jp start'].join('\n'));
                assert(r.ok && r.output.length === 4, 'a colon-less label in column 1 still works', r.err);

                // Block ends with nothing open
                r = build(['    org 25000', '    nop', '    edup'].join('\n'));
                assert(!r.ok && /EDUP without DUP/i.test(r.err || ''), 'EDUP without DUP is an error', r.err);
                r = build(['    org 25000', '    nop', '    endr'].join('\n'));
                assert(!r.ok && /ENDR without REPT/i.test(r.err || ''), 'ENDR without REPT is an error', r.err);

                // ...and the working forms are untouched
                r = build(['    org 25000', '    dup 32', '    nop', '    edup'].join('\n'));
                assert(r.ok && r.output.length === 32, 'DUP 32 still emits 32 bytes', r.err);
                r = build(['    org 25000', '    rept 4', '    nop', '    endr'].join('\n'));
                assert(r.ok && r.output.length === 4, 'REPT 4 still emits 4 bytes', r.err);
                r = build(['    org 25000', '    dup 2', '    dup 3', '    nop', '    edup', '    edup'].join('\n'));
                assert(r.ok && r.output.length === 6, 'nested DUP still expands', r.err);
            }

            section('A symbol used above its EQU');
            {
                // The reference emitted 0, and by the end of the pass the symbol
                // looked defined, so the pass loop stopped and kept the zeros —
                // "OK" for code pointing at address 0. Forward labels always worked.
                let r = build(['    org #8000', '    ld hl,BUF', 'BUF equ #4000'].join('\n'));
                assert(r.ok && r.output[1] === 0x00 && r.output[2] === 0x40,
                       'a forward EQU resolves instead of assembling as 0',
                       r.err + ' ' + Array.from(r.output).join(','));

                r = build(['    org #8000', '    ld a,low (BUF+#505)', 'BUF equ #4000'].join('\n'));
                assert(r.ok && r.output[1] === 0x05, 'and resolves inside low()', r.err);
                r = build(['    org #8000', '    ld a,high (BUF+#505)', 'BUF equ #4000'].join('\n'));
                assert(r.ok && r.output[1] === 0x45, 'and inside high()', r.err);

                // Defined before use is unchanged, and still converges
                r = build(['BUF equ #4000', '    org #8000', '    ld hl,BUF'].join('\n'));
                assert(r.ok && r.output[1] === 0x00 && r.output[2] === 0x40,
                       'the ordinary order still works', r.err);
                // A name that never gets defined must still fail
                r = build(['    org #8000', '    ld hl,NOSUCH'].join('\n'));
                assert(!r.ok, 'a genuinely undefined symbol is still an error');
            }

            section('low/high bind tighter than +');
            {
                // sjasmplus counts low/high as unary operators, so "low X+5" is
                // "(low X)+5", not "low (X+5)".
                let r = build(['BUF equ #4000', '    org #8000', '    ld hl,low BUF+#505'].join('\n'));
                assert(r.ok && r.output[1] === 0x05 && r.output[2] === 0x05,
                       'low X+n is (low X)+n', r.err);
                r = build(['BUF equ #4000', '    org #8000', '    ld a,low BUF+1'].join('\n'));
                assert(r.ok && r.output[1] === 0x01, 'and keeps its value when it fits a byte', r.err);
                r = build(['BUF equ #4000', '    org #8000', '    ld a,low (BUF+#505)'].join('\n'));
                assert(r.ok && r.output[1] === 0x05, 'parentheses take the whole expression', r.err);
                r = build(['BUF equ #4000', '    org #8000', '    ld a,high (BUF+#505)'].join('\n'));
                assert(r.ok && r.output[1] === 0x45, 'and for high', r.err);
            }

            section('Characters that mean nothing are reported');
            {
                // A line typed in the wrong keyboard layout ("щкп" for "org") lost
                // its first word one character at a time and assembled as if the
                // line were absent — at address 0, reported as OK. The lexer's
                // warning never showed either: warnings are cleared at the start of
                // every pass, and tokenising happens once, before them.
                let r = build(['щкп 25000', '    ld a,5', '    ret'].join('\n'));
                assert(!r.ok, 'a mistyped ORG fails instead of assembling at 0',
                       r.ok ? r.output.length + ' bytes' : '');
                assert(/'щкп'/.test(r.err || ''),
                       'and the message quotes the whole word, not one letter', r.err);

                // A name further into the source is reported whole too
                r = build(['    org #8000', '    ld a,(метка)', 'метка: db 5'].join('\n'));
                assert(!r.ok && /'метка'/.test(r.err || ''),
                       'a Cyrillic name inside an operand is quoted whole', r.err);

                r = build(['    org #8000', '    nop ¬'].join('\n'));
                assert(!r.ok && /Unexpected character/.test(r.err || ''),
                       'a stray character is an error too', r.err);

                // Cyrillic is always fine where text belongs
                r = build(['    org #8000  ; комментарий', '    nop'].join('\n'));
                assert(r.ok && r.output.length === 1, 'a Cyrillic comment still assembles', r.err);
                r = build(['    org #8000', '    db "привет"'].join('\n'));
                assert(r.ok && r.output.length === 6, 'a Cyrillic string still assembles', r.err);

                // In a *name* it is an error unless asked for: that is what makes
                // the wrong-layout line above a mistake rather than a label
                const cyr = ['    org #8000', 'МЕТКА:', '    jp МЕТКА'].join('\n');
                r = build(cyr);
                assert(!r.ok, 'a Cyrillic label is rejected by default', r.ok ? 'assembled' : '');
                r = build(cyr, { unicodeLabels: true });
                assert(r.ok && r.output.length === 3 && r.output[1] === 0x00 && r.output[2] === 0x80,
                       'and accepted with the Unicode labels option on', r.err);

                // The option must not leak into the next build
                r = build(cyr);
                assert(!r.ok, 'the option does not persist into the next assembly');

                // ...and a wrong-layout line is still an error with it on, because
                // "щкп" is not an instruction
                r = build(['щкп 25000', '    ret'].join('\n'), { unicodeLabels: true });
                assert(!r.ok && /щкп/.test(r.err || ''),
                       'the mistyped ORG fails even with Unicode labels on', r.err);
            }
        }

        // The map that lets the debugger show a source comment beside the code the
        // line produced. Only lines that EMIT get an entry, and only the final
        // pass's addresses are meaningful.
        async function runLineMapTests() {
            section('Line map: source line -> address');
            const build = (src, opts) => Assembler.assemble(src, 'main.asm', [], opts || {});

            {
                const r = build([
                    '    org $8000',       // 1: emits nothing
                    'start:  ; the label line emits nothing either',
                    '    ld a,5      ; load it',
                    '    ret         ; and go back'
                ].join('\n'));
                const map = r.lineMap;
                assert(Array.isArray(map) && map.length === 2,
                       'one entry per emitting line, none for org or a bare label',
                       map ? `${map.length}: ${map.map(m => m.line).join(',')}` : 'missing');
                assert(map[0].addr === 0x8000 && map[0].line === 3,
                       'the first emitting line is at the ORG', map[0] && `${map[0].line}@${map[0].addr.toString(16)}`);
                assert(map[1].addr === 0x8002 && map[1].line === 4,
                       'and the next follows its bytes', map[1] && `${map[1].line}@${map[1].addr.toString(16)}`);
                assert(/load it/.test(map[0].comment) && /go back/.test(map[1].comment),
                       'each entry carries that line\'s own comment', JSON.stringify(map.map(m => m.comment)));
                assert(map[0].file === 'main.asm', 'and the file it came from', map[0].file);
            }
            {
                // A ';' inside a string is not a comment — the reason the map carries
                // the parser's idea of the comment rather than the raw line text
                const r = build(['    org $8000', '    db "a;b"   ; real one'].join('\n'));
                assert(r.lineMap.length === 1 && /real one/.test(r.lineMap[0].comment)
                       && !/a;b/.test(r.lineMap[0].comment),
                       'a semicolon inside a string is not taken for a comment',
                       JSON.stringify(r.lineMap[0].comment));
            }
            {
                // Addresses must be the settled ones, not an early pass's
                const r = build([
                    '    org $8000',
                    '    jp later      ; forward reference',
                    'later:',
                    '    nop           ; here'
                ].join('\n'));
                const last = r.lineMap[r.lineMap.length - 1];
                assert(last.addr === 0x8003, 'a forward reference does not shift the addresses',
                       last.addr.toString(16));
            }
            {
                // The async path is the one the UI uses, and it resets its own pass
                // state — a map that accumulated there handed the caller the previous
                // build's lines as well, with the stale comments winning.
                const src = (n) => ['    org $8000', `    ld a,${n}   ; take ${n}`, '    ret'].join('\n');
                await Assembler.assembleAsync(src(1), 'main.asm', [], {});
                const r2 = await Assembler.assembleAsync(src(2), 'main.asm', [], {});
                const emitting = r2.lineMap.filter(m => /take/.test(m.comment));
                assert(emitting.length === 1, 'a second async build does not keep the first one\'s lines',
                       `${emitting.length}: ${JSON.stringify(emitting.map(m => m.comment))}`);
                assert(emitting[0].comment.includes('take 2'), 'and carries the current comment',
                       emitting[0].comment);
            }
            {
                // A macro body is expanded by re-entering processLine, so its lines
                // are mapped at depth 1; the call site sits at the same address with
                // depth 0, which is how a caller tells the two apart.
                const r = build([
                    '    macro SETUP',
                    '    ld a,1     ; inside the macro',
                    '    ld b,2     ; second body line',
                    '    endm',
                    '    org $8000',
                    '    SETUP      ; call site'
                ].join('\n'));
                assert(r.success, 'the macro assembles', (r.errors && r.errors[0] || {}).message);
                const at8000 = r.lineMap.filter(m => m.addr === 0x8000);
                assert(at8000.length === 2, "the call and the body's first line share an address",
                       String(at8000.length));
                const outer = at8000.find(m => m.depth === 0);
                assert(outer && /call site/.test(outer.comment),
                       'the shallower entry is the call site', outer && outer.comment);
                assert(at8000.some(m => m.depth > 0 && /inside the macro/.test(m.comment)),
                       'and the deeper one is the body line');
                const second = r.lineMap.find(m => m.addr === 0x8002);
                assert(second && /second body line/.test(second.comment),
                       'later body lines get their own addresses', second && second.comment);
            }
            {
                // Each unrolled copy is its own place in memory, so each gets an entry
                const r = build(['    org $8000', '    dup 3', '    nop  ; body', '    edup'].join('\n'));
                const bodies = r.lineMap.filter(m => /body/.test(m.comment));
                assert(bodies.length === 3, 'a DUP body is mapped once per iteration',
                       String(bodies.length));
                assert(bodies[0].addr === 0x8000 && bodies[2].addr === 0x8002,
                       'each at its own address',
                       bodies.map(b => b.addr.toString(16)).join(','));
            }
        }

        // The sjasmplus address/page operators. Each is a sigil glued to the front
        // of a name (or standing alone), which the lexer has to hand over as ONE
        // token: as two ("$$" then "lab") the expression parser sees a stray
        // identifier after a finished expression and every one of these failed to
        // assemble at all.
        //
        // $$ was the odd one out until v1.0.0: it meant the last ORG -- NASM's
        // "section start", inherited from the standalone sjasmplus-js this engine
        // grew out of, and never tested beyond the lexer. It is the page of $ now,
        // which is what sjasmplus means and what makes it consistent with $$lab.
        async function runDollarOperatorTests() {
            // A construct that no longer parses THROWS, and a throw would abort
            // the rest of the section -- which reads as "all green" with quietly
            // fewer asserts. Turn it into a failed assert instead.
            const bytes = (src) => {
                try { return Assembler.assemble(src).output; }
                catch (e) { assert(false, 'assembles at all', e.message); return null; }
            };
            const D = '    device zxspectrum128\n';

            section('$ is the address, $$ is its page');

            assertBytes(bytes('    org $8000\n    dw $\n'), [0x00, 0x80],
                        '$ is the program counter');
            assertBytes(bytes(D + '    org $C000\n    page 5\n    db $$\n'), [0x05],
                        '$$ is the page the program counter is in');
            assertBytes(bytes(D + '    org $C000\n    page 3\n    db $$\n'), [0x03],
                        'and it follows the page, not the address');
            assertBytes(bytes(D + '    org $C000\n    page 6\n    ld a,$$\n'), [0x3E, 0x06],
                        'in an instruction operand as well as a DB');

            // The whole point of the change: $$ is to $ what $$lab is to lab.
            assertBytes(bytes(D + '    org $C000\n    page 5\nlab: db $$, $$lab\n'),
                        [0x05, 0x05], '$$ agrees with $$lab at the same address');

            // It used to be the last ORG (NASM's "section start"), so `$-$$` was the
            // offset into the ORG block. That reading is gone, and gone loudly:
            // there are no pages without a DEVICE, so the old idiom errors rather
            // than quietly returning a small number that looks like an offset.
            {
                const r = tryAsm('    org $8000\n    nop\n    dw $-$$\n');
                assert(!r.ok && /DEVICE/i.test(r.err),
                       'the old $-$$ block offset is refused, naming DEVICE', r.err);
            }
            assert(!tryAsm('    org $8000\n    dw $$\n').ok,
                   '$$ with no DEVICE is an error, not page 0');
            assert(!tryAsm('    org $8000\nlab: db $$lab\n').ok,
                   'and so is $$lab, for the same reason');

            section('$$$ / $$$$ - the physical address and its page');

            assertBytes(bytes('    org $8000\n    disp $C000\n    dw $$$\n    ent\n'),
                        [0x00, 0x80], 'inside DISP, $$$ is where the bytes really go');
            assertBytes(bytes('    org $8000\n    disp $C000\n    dw $\n    ent\n'),
                        [0x00, 0xC0], 'while $ stays the displaced address');
            assertBytes(bytes('    org $8000\n    dw $$$\n'), [0x00, 0x80],
                        'outside DISP the two are the same');
            // page 7 goes to slot 3, where the DISPLACED address lands; the
            // physical one is $8000, in slot 2, which zxspectrum128 leaves on page
            // 2. The two answers have to differ or this proves nothing -- with
            // `page 2` here they were both 2 and the assert held either way.
            assertBytes(bytes(D + '    org $8000\n    page 7\n    disp $C000\n    db $$$$\n    ent\n'),
                        [0x02], '$$$$ is the page the PHYSICAL address falls in');
            assertBytes(bytes(D + '    org $8000\n    page 7\n    disp $C000\n    db $$$$ = 7\n    ent\n'),
                        [0x00], 'and not the displaced address, whose page is 7 here');

            section('The same four, applied to a label');

            assertBytes(bytes(D + '    org $C000\n    page 5\nlab: nop\n    db $$lab\n'),
                        [0x00, 0x05], '$$lab is the page the label lives in');
            assertBytes(bytes(D + '    org $C000\n    page 3\nlab: nop\n    db $$lab\n'),
                        [0x00, 0x03], 'and it follows the page, not the address');
            assertBytes(bytes(D + '    org $8000\n    disp $C000\nlab: nop\n    ent\n    dw $$$lab\n'),
                        [0x00, 0x00, 0x80], '$$$lab is where a DISP label really sits');
            assertBytes(bytes(D + '    org $8000\n    disp $C000\nlab: nop\n    ent\n    dw lab\n'),
                        [0x00, 0x00, 0xC0], 'while the bare label is still the displaced one');
            assertBytes(bytes(D + '    org $C000\n    page 6\n    disp $4000\nlab: nop\n    ent\n    db $$$$lab\n'),
                        [0x00, 0x06], '$$$$lab is the page of the physical address');
            assertBytes(bytes(D + '    org $8000\n    disp $C000\nlab: nop\n    ent\n    ld hl,$$$lab\n'),
                        [0x00, 0x21, 0x00, 0x80], 'and all of them reach an instruction operand');
            assertBytes(bytes(D + '    org $C000\n    page 4\nlab: nop\npg: equ $$lab\n    db pg\n'),
                        [0x00, 0x04], 'and an EQU');

            assert(!tryAsm('    org $8000\n    dw $$$$$\n').ok,
                   'five dollars is an error, not a silently truncated four');

            section('{x} and {b x} read the assembled image');

            assertBytes(bytes(D + '    org $8000\n    dw $BEEF\n    dw {$8000}\n'),
                        [0xEF, 0xBE, 0xEF, 0xBE], '{x} reads a word back');
            assertBytes(bytes(D + '    org $8000\n    db $99,$77\n    db {b $8000}\n'),
                        [0x99, 0x77, 0x99], '{b x} reads one byte');
            assertBytes(bytes(D + '    org $8000\n    db $99,$77\n    db {b $8001}\n'),
                        [0x99, 0x77, 0x77], 'from the address it was given');
            // Into a DB, a word read is cut down to the same byte the byte read
            // gives -- so the size only shows somewhere wider than a byte.
            assertBytes(bytes(D + '    org $8000\n    db $99,$77\n    dw {b $8000}\n'),
                        [0x99, 0x77, 0x99, 0x00], '{b x} is ONE byte, not a word cut down to one');
            assertBytes(bytes(D + '    org $8000\n    dw $0002\n    dw 1+{$8000}\n'),
                        [0x02, 0x00, 0x03, 0x00], 'and it is an operand like any other');
            assertBytes(bytes(D + '    org $8000\n    db $42\n    ld a,{b $8000}\n'),
                        [0x42, 0x3E, 0x42], 'in an instruction as well as a DB');

            // "b" is the size keyword only when something follows it, so a label
            // called b is still readable as a word.
            assertBytes(bytes(D + '    org $8000\n    dw $1234\nb:  equ $8000\n    dw {b}\n'),
                        [0x34, 0x12, 0x34, 0x12], '{b} on its own is a word read of a label called b');

            // The read is a convergence input: the byte is not there on the first
            // pass, and the value it gave last pass is compared to force another.
            {
                const r = asm(D + '    org $8000\n    dw {tgt}\n    org $9000\ntgt: dw $1234\n');
                assertBytes(r.success ? r.output.slice(0, 2) : null, [0x34, 0x12],
                            'a read of an address filled in later still converges');
            }

            // With no DEVICE there is no image to read, so a braced operand keeps
            // its other sjasmplus meaning -- the STRUCT wrapper.
            section('Braces without a DEVICE are still the STRUCT wrapper');

            assertBytes(bytes('    struct P\nx  byte 7\ny  byte 9\n    ends\n' +
                              '    org $8000\n    P {1,2}\n    P\n'),
                        [0x01, 0x02, 0x07, 0x09], 'a struct instantiated with and without values');
            assertBytes(bytes(D + '    struct P\nx  byte 7\ny  byte 9\n    ends\n' +
                              '    org $8000\n    P {1,2}\n    P\n'),
                        [0x01, 0x02, 0x07, 0x09], 'and the same with a DEVICE set');
        }

        async function runAllTests() {
            clearLog();
            log('Running all assembler tests...', 'info');

            await runSnippetTests();
            await runOperandValidationTests();
            await runSourceValidationTests();
            await runErrorLineTests();
            await runDialectOptionTests();
            await runProjectFormTests();
            await runInstructionTests();
            await runDirectiveTests();
            await runLabelTests();
            await runExpressionTests();
            await runMacroTests();
            await runConditionalTests();
            await runAdvancedTests();
            await runLineMapTests();
            await runDollarOperatorTests();

            log('\n=== COMPLETE ===', 'section');
        }

        // Button handlers
        document.getElementById('runAll').onclick = runAllTests;
        document.getElementById('runInstructions').onclick = () => { clearLog(); runInstructionTests(); };
        document.getElementById('runDirectives').onclick = () => { clearLog(); runDirectiveTests(); };
        document.getElementById('runLabels').onclick = () => { clearLog(); runLabelTests(); };
        document.getElementById('runExpressions').onclick = () => { clearLog(); runExpressionTests(); };
        document.getElementById('runMacros').onclick = () => { clearLog(); runMacroTests(); };
        document.getElementById('runConditionals').onclick = () => { clearLog(); runConditionalTests(); };
        document.getElementById('runAdvanced').onclick = () => { clearLog(); runAdvancedTests(); };

        // Theme handling
        const themeBtn = document.getElementById('themeToggle');

        function updateTheme() {
            const isLight = document.body.classList.contains('light-theme');
            themeBtn.textContent = isLight ? '\u263C' : '\u263E';
        }

        // Load saved theme
        const savedTheme = localStorage.getItem('zxm8_theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
        }
        updateTheme();

        themeBtn.onclick = () => {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            localStorage.setItem('zxm8_theme', isLight ? 'light' : 'dark');
            updateTheme();
        };

        // Run tests on load
        runAllTests();
    </script>
</body>
</html>
