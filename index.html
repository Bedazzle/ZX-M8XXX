<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" id="metaColorScheme" content="dark">
    <script>if(localStorage.getItem('zxm8_theme')==='light')document.getElementById('metaColorScheme').content='light';</script>
    <!-- Compared against APP_VERSION at boot to catch a stale cached bundle -->
    <meta name="zxm8-version" content="0.15.29">
    <title>ZX-M8XXX v0.15.29</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/dialogs.css">
</head>
<body>
    <!-- ROM Selection Modal (shown only if ROMs not found in roms/) -->
    <div data-include="html/modals.html"></div>
    <div class="container">
        <div data-include="html/toolbar.html"></div>

        <div class="main-layout">
            <div data-include="html/screen.html"></div>


            <!-- Tab Container -->
            <div class="tab-container" id="tabContainer">
                <div data-include="html/panel-debug.html"></div>

                <div data-include="html/panel-asm.html"></div>

                <div data-include="html/panel-settings.html"></div>

                <div data-include="html/panel-utils.html"></div>

            </div><!-- tab-container -->
        </div><!-- main-layout -->
    </div><!-- container -->

    <div data-include="html/dialogs.html"></div>
    <script src="lib/pako.min.js"></script>
    <script type="module" src="ui/boot.js"></script>
</body>
</html>
