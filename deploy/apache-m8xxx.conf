# ZX-M8XXX — Apache configuration for a static deploy.
#
# Use this when .htaccess is ignored, which is the Ubuntu default: /var/www is
# shipped with "AllowOverride None", so Apache never reads the file and gives no
# error — headers simply don't appear and directory listings stay on.
#
# Two ways to apply it:
#
#   A. Put this block in the vhost (recommended: no per-request .htaccess lookup)
#        sudo nano /etc/apache2/sites-available/000-default.conf
#        …paste inside <VirtualHost>…
#        sudo a2enmod headers
#        sudo apache2ctl configtest && sudo systemctl reload apache2
#
#   B. Or just let the shipped .htaccess work
#        <Directory /var/www/html/m8xxx>
#            AllowOverride All
#        </Directory>
#        sudo a2enmod headers && sudo systemctl reload apache2
#
# Adjust the path if the app doesn't live in /var/www/html/m8xxx.

<Directory /var/www/html/m8xxx>
    Options -Indexes
    Require all granted

    <IfModule mod_headers.c>
        # The app is ES modules served from disk with no hashed filenames, so a
        # cached module and a fresh index.html silently disagree: the version in
        # the title looks right while the code is older. no-cache still allows a
        # 304, so revalidation is cheap.
        <FilesMatch "\.(html|js|css|json|map)$">
            Header set Cache-Control "no-cache, must-revalidate"
        </FilesMatch>

        <FilesMatch "\.(rom|png|jpg|jpeg|gif|ico|ttf|woff2?|zip|tap|tzx|trd|scl)$">
            Header set Cache-Control "public, max-age=604800"
        </FilesMatch>
    </IfModule>

    <IfModule mod_mime.c>
        AddType text/javascript .js
        AddType application/json .json
    </IfModule>
</Directory>

# ---------------------------------------------------------------------------
# Behind Cloudflare, the origin headers are only half the story:
#
#   * Browser Cache TTL must be "Respect Existing Headers", or the dashboard
#     value overrides what Apache sends. With no origin header at all,
#     Cloudflare injects its own — that is where "Cache-Control: max-age=14400"
#     on every .js came from.
#   * The edge keeps what it already cached. Purge after an upload (Caching →
#     Configuration → Purge Everything), or add a Cache Rule for the app path
#     with "Bypass cache".
#
# Verify from outside afterwards:
#   curl -sI http://<host>/m8xxx/ui/assembler-ui.js | grep -i cache-control
#   → Cache-Control: no-cache, must-revalidate
